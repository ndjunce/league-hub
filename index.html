// Current streak for one team from completed games, newest first: "W3" / "L1" / "T1", "—" before any game.
// No winner (e.g. "UNDECIDED" past weeks) + unequal points -> the higher score wins, matching weekGames().
function streakOf(D, teamId){
  const gs = completedGames(D).filter(g=>(g.homeId===teamId||g.awayId===teamId) && !(g.homePts===0 && g.awayPts===0))
    .sort((a,b)=>b.period-a.period);
  let kind = null, n = 0;
  for(const g of gs){
    const home = g.homeId===teamId;
    let r;
    if(g.winner==="HOME") r = home?"W":"L";
    else if(g.winner==="AWAY") r = home?"L":"W";
    else if(g.winner==="TIE" || g.homePts===g.awayPts) r = "T";
    else r = (g.homePts>g.awayPts) === home ? "W" : "L";
    if(kind===null) kind = r;
    if(r!==kind) break;
    n++;
  }
  return kind ? kind+n : "—";
}

/* ============================ PLAYOFF SCENARIOS ============================ */

// standings sorted by W, then points-for tiebreaker
function standings(D){
  return D.teams.slice().sort((a,b)=> (b.record.w-a.record.w) || (b.pf-a.pf))
    .map((t,i)=>({ seed:i+1, id:t.id, name:t.disp, w:t.record.w, l:t.record.l, t:t.record.t, pf:t.pf }));
}

/* ============================ PLAYOFF ENGINE ============================ */
// Proposal section 3 (hub overhaul, 2026-10-13). Pure functions over DATA; nothing here fetches. Inputs are
// ESPN league data only, plus ESPN's own current-week projected starter totals (team.projTeam), which are
// labeled as ESPN's wherever they show. Replaces the old #1-seed race, Playoff-Spot race and Stakes tab.

const SIM_N = 10000;          // simulated seasons per data load
const ODDS_ENUM_CAP = 18;     // exact 2^k enumeration once <= 18 regular-season games remain (2^18 = 262144)

const winsOf = t => t.record.w + 0.5*t.record.t;             // H2H wins, a tie counts half
const recStr = r => `${r.w}-${r.l}${r.t?"-"+r.t:""}`;
const fmtW = x => Number.isInteger(x) ? String(x) : x.toFixed(1);
const ordinal = n => n + ((n%100>=11 && n%100<=13) ? "th" : ({1:"st",2:"nd",3:"rd"}[n%10] || "th"));
function signed1(x){ const v = Math.round(x*10)/10; return v===0 ? "0.0" : (v>0?"+":"\u2212") + Math.abs(v).toFixed(1); }
// whole percent; "<1%" / ">99%" at the extremes. oddsTxt lets the exact clinch/elim math override the sim.
function pc(p){ if(p==null) return "—"; const v = Math.round(p*100); return v>=100 ? ">99%" : v<=0 ? "<1%" : v+"%"; }
function oddsTxt(p, c){ if(c && c.clinchedIn) return "100%"; if(c && c.eliminated) return "0%"; return pc(p); }

// a completed regular-season game: before the current week and scored (live in-progress scores never count)
const isDoneReg = (D, g) => g.period < D.week && g.period <= D.regWeeks && (g.homePts||g.awayPts) > 0;

// {teamId: [weekly scores, oldest first]} for completed regular-season weeks
function completedWeekScores(D){
  const out = {}; D.teams.forEach(t=> out[t.id] = []);
  D.games.filter(g=>isDoneReg(D, g)).sort((a,b)=>a.period-b.period).forEach(g=>{
    if(out[g.homeId]) out[g.homeId].push(g.homePts);
    if(out[g.awayId]) out[g.awayId].push(g.awayPts);
  });
  return out;
}

// per team: PF/game, all-play record (each week vs all 11 others, 0.5 for equal), expected wins
// (sum of teams beaten / 11 per week), luck = actual wins - expected wins, last-3 average, mean.
function teamStrength(D){
  const scores = completedWeekScores(D);
  const weekMap = {};   // {week: {teamId: pts}}
  D.games.filter(g=>isDoneReg(D, g)).forEach(g=>{
    const m = weekMap[g.period] = weekMap[g.period] || {};
    m[g.homeId] = g.homePts; m[g.awayId] = g.awayPts;
  });
  const out = {};
  D.teams.forEach(t=>{
    const sc = scores[t.id], n = sc.length;
    let aw = 0, al = 0, expW = 0;
    Object.values(weekMap).forEach(m=>{
      const mine = m[t.id]; if(mine==null) return;
      let beat = 0, opp = 0;
      Object.keys(m).forEach(k=>{ if(Number(k)===t.id) return; opp++; beat += mine>m[k] ? 1 : (mine===m[k] ? 0.5 : 0); });
      aw += beat; al += opp - beat; if(opp) expW += beat/opp;
    });
    const sum = sc.reduce((a,b)=>a+b, 0), l3 = sc.slice(-3);
    out[t.id] = { n, scores:sc, mean: n ? sum/n : 0, pfg: n ? t.pf/n : 0,
      allplayW:aw, allplayL:al, expW, luck: winsOf(t) - expW,
      last3: l3.length ? l3.reduce((a,b)=>a+b, 0)/l3.length : null };
  });
  return out;
}

// every remaining regular-season game (current week .. last regular week), indices into D.teams
function remainingGames(D){
  const ix = {}; D.teams.forEach((t,i)=> ix[t.id] = i);
  return D.games
    .filter(g=> g.period>=D.week && g.period<=D.regWeeks && ix[g.homeId]!=null && ix[g.awayId]!=null)
    .sort((a,b)=> (a.period-b.period) || (a.homeId-b.homeId))
    .map(g=>({ wk:g.period, homeIx:ix[g.homeId], awayIx:ix[g.awayId], homeId:g.homeId, awayId:g.awayId }));
}

// remaining strength of schedule: mean PF/game of each remaining opponent (one entry per game); rank 1 = easiest
function sosRemaining(D, str){
  str = str || teamStrength(D);
  const acc = {}; D.teams.forEach(t=> acc[t.id] = { sum:0, n:0 });
  remainingGames(D).forEach(g=>{
    acc[g.homeId].sum += str[g.awayId].pfg; acc[g.homeId].n++;
    acc[g.awayId].sum += str[g.homeId].pfg; acc[g.awayId].n++;
  });
  const out = {}; D.teams.forEach(t=>{ const a = acc[t.id]; out[t.id] = { opp: a.n ? a.sum/a.n : null, games:a.n, rank:null }; });
  D.teams.filter(t=>out[t.id].opp!=null).sort((a,b)=> (out[a.id].opp - out[b.id].opp) || (a.id-b.id))
    .forEach((t,i)=> out[t.id].rank = i+1);
  return out;
}

// seeded PRNG (mulberry32) + Box-Muller normals: same inputs -> identical odds on every load
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function normalSource(rand){
  let spare = null;
  return function(){
    if(spare!==null){ const z = spare; spare = null; return z; }
    let u = 0; while(u===0) u = rand();
    const v = rand(), r = Math.sqrt(-2*Math.log(u));
    spare = r*Math.sin(2*Math.PI*v);
    return r*Math.cos(2*Math.PI*v);
  };
}

// Monte Carlo of the rest of the regular season (proposal 3.3). Returns null before 2 completed weeks.
function monteCarlo(D, str){
  str = str || teamStrength(D);
  const T = D.teams, NT = T.length;
  if(NT < 2) return null;
  const n = Math.min(...T.map(t=>str[t.id].n));            // completed weeks
  if(n < 2) return null;
  // 1. week-to-week noise: pooled within-team SD
  let ss = 0, cnt = 0, total = 0;
  T.forEach(t=>{ const x = str[t.id]; x.scores.forEach(v=>{ ss += (v-x.mean)*(v-x.mean); cnt++; total += v; }); });
  const sigma = Math.sqrt(ss / Math.max(1, cnt - NT));
  const L = total / cnt;                                     // league mean of all completed team-scores
  // 2. shrinkage: tau^2 = how much of the spread in averages is skill; K = clamp(sigma^2/tau^2, 2, 12)
  const means = T.map(t=>str[t.id].mean), mBar = means.reduce((a,b)=>a+b, 0)/NT;
  const varM = means.reduce((a,m)=>a+(m-mBar)*(m-mBar), 0)/(NT-1);
  const tau2 = Math.max(1e-6, varM - sigma*sigma/n);
  const K = Math.min(12, Math.max(2, sigma*sigma/tau2));
  const mu = Float64Array.from(T, t=>(n*str[t.id].mean + K*L)/(n+K));
  // 3. strength uncertainty per simulated season
  const sdTheta = sigma/Math.sqrt(n+K);
  // 4. ESPN's projected starters total, blended 50/50 into the CURRENT week only (0 = none -> theta alone)
  const proj = Float64Array.from(T, t=> t.projTeam>0 ? t.projTeam : 0);
  const rem = remainingGames(D), G = rem.length;
  const gH = Int32Array.from(rem, g=>g.homeIx), gA = Int32Array.from(rem, g=>g.awayIx);
  const gCur = Uint8Array.from(rem, g=> g.wk===D.week ? 1 : 0);
  const baseW = Float64Array.from(T, winsOf), basePF = Float64Array.from(T, t=>t.pf);
  const gLeft = new Int32Array(NT); rem.forEach(g=>{ gLeft[g.homeIx]++; gLeft[g.awayIx]++; });
  const P = D.playoffTeams, B = D.byes || 0;
  const maxG = Math.max(0, ...gLeft), NW = maxG + 1;
  const norm = normalSource(mulberry32(Number(LEAGUE.season)*100 + D.week));
  const inCnt = new Uint32Array(NT), seedHist = new Uint32Array(NT*NT), sumW = new Float64Array(NT);
  const cond = new Uint32Array(G*2*NT), homeWins = new Uint32Array(G);   // P(t in | home / away wins g)
  const byeCond = new Uint32Array(G*2*NT); // same simulated seasons, no additional random draws
  const needIn = new Uint32Array(NT*NW), needAll = new Uint32Array(NT*NW); // by the team's own remaining wins
  const theta = new Float64Array(NT), w = new Float64Array(NT), pf = new Float64Array(NT), myW = new Int32Array(NT);
  const hw = new Uint8Array(G), order = new Int32Array(NT);
  const t0 = performance.now();
  for(let s=0; s<SIM_N; s++){
    for(let i=0; i<NT; i++){ theta[i] = mu[i] + sdTheta*norm(); w[i] = baseW[i]; pf[i] = basePF[i]; myW[i] = 0; }
    // 5. each remaining game: score ~ Normal(game mean, sigma) per side, higher score wins, scores add to PF
    for(let g=0; g<G; g++){
      const h = gH[g], a = gA[g];
      const mh = (gCur[g] && proj[h]>0) ? 0.5*theta[h] + 0.5*proj[h] : theta[h];
      const ma = (gCur[g] && proj[a]>0) ? 0.5*theta[a] + 0.5*proj[a] : theta[a];
      const sh = mh + sigma*norm(), sa = ma + sigma*norm();
      pf[h] += sh; pf[a] += sa;
      if(sh >= sa){ w[h]++; myW[h]++; hw[g] = 1; homeWins[g]++; } else { w[a]++; myW[a]++; hw[g] = 0; }
    }
    // 6. final order: wins desc, then PF desc (TOTAL_POINTS_SCORED); insertion sort over 12 teams
    for(let i=0; i<NT; i++){
      order[i] = i;
      for(let j=i; j>0; j--){
        const y = order[j], x = order[j-1];
        if(w[y] > w[x] || (w[y]===w[x] && pf[y] > pf[x])){ order[j-1] = y; order[j] = x; } else break;
      }
    }
    // 8. accumulate seeds, wins, and the per-game conditional counters in the same pass
    for(let r=0; r<NT; r++){ const i = order[r]; seedHist[i*NT + r]++; if(r < P) inCnt[i]++; }
    for(let i=0; i<NT; i++){ sumW[i] += myW[i]; needAll[i*NW + myW[i]]++; }
    for(let r=0; r<P; r++){ const i = order[r]; needIn[i*NW + myW[i]]++; }
    for(let g=0; g<G; g++){ const base = (g*2 + (hw[g] ? 0 : 1))*NT; for(let r=0; r<P; r++) cond[base + order[r]]++; }
    for(let g=0; g<G; g++){ const base = (g*2 + (hw[g] ? 0 : 1))*NT; for(let r=0; r<B; r++) byeCond[base + order[r]]++; }
  }
  const simMs = performance.now() - t0;
  const ix = {}; T.forEach((t,i)=> ix[t.id] = i);
  const teams = {};
  T.forEach((t,i)=>{
    const seedDist = []; for(let r=0; r<NT; r++) seedDist.push(seedHist[i*NT + r]/SIM_N);
    let pBye = 0; for(let r=0; r<B; r++) pBye += seedDist[r];
    const need = []; for(let k=0; k<=gLeft[i]; k++){ const a = needAll[i*NW + k]; need.push({ n:a, p: a ? needIn[i*NW + k]/a : null }); }
    const mW = sumW[i]/SIM_N;
    teams[t.id] = { pIn: inCnt[i]/SIM_N, pBye, seedDist, need, gLeft: gLeft[i],
      projW: baseW[i] + mW, projL: t.record.l + 0.5*t.record.t + gLeft[i] - mW, mu: mu[i] };
  });
  return { N:SIM_N, NT, n, sigma, K, L, sdTheta, simMs, rem, ix, cond, byeCond, homeWins, teams };
}

// P(team makes the playoffs | remaining game gi goes to home (homeWon=true) or away). null if never sampled.
function condIn(mc, gi, teamId, homeWon){
  const i = mc.ix[teamId]; if(i==null) return null;
  const den = homeWon ? mc.homeWins[gi] : mc.N - mc.homeWins[gi];
  return den ? mc.cond[(gi*2 + (homeWon ? 0 : 1))*mc.NT + i]/den : null;
}

// Exact clinch / elimination (proposal 3.4), never from the sim. A tie in wins at the line is UNDECIDED
// (clinch needs strict >, elimination strict <) because future points-for is unknown.
function clinchMath(D){
  const T = D.teams, NT = T.length, P = D.playoffTeams, B = D.byes || 0;
  const rem = remainingGames(D);
  const W = {}, G = {};
  T.forEach(t=>{ W[t.id] = winsOf(t); G[t.id] = 0; });
  rem.forEach(g=>{ G[g.homeId]++; G[g.awayId]++; });
  const kth = (vals, k) => { const v = vals.slice().sort((a,b)=>b-a); return (k>=1 && k<=v.length) ? v[k-1] : -Infinity; };
  const out = {};
  if(!rem.length){   // regular season over: the final order decides
    standings(D).forEach((r,i)=>{ out[r.id] = { W:W[r.id], G:0, clinchedIn:i<P, eliminated:i>=P,
      clinchedBye:i<B, byeGone:i>=B, magic:null, elimNum:null }; });
    return { byId:out, exact:true };
  }
  T.forEach(t=>{
    const others = T.filter(o=>o.id!==t.id);
    const oCeil = others.map(o=>W[o.id]+G[o.id]), oNow = others.map(o=>W[o.id]);
    const Wi = W[t.id], Gi = G[t.id];
    const ceilP = kth(oCeil, P), nowP = kth(oNow, P);         // the 7th-best OTHER team: ceiling / today
    const r = { W:Wi, G:Gi, clinchedIn: Wi > ceilP, eliminated: Wi + Gi < nowP,
      clinchedBye: B>0 && Wi > kth(oCeil, B), byeGone: B>0 && Wi + Gi < kth(oNow, B), magic:null, elimNum:null };
    for(let m=0; m<=Gi; m++){ if(Wi + m > ceilP){ r.magic = m; break; } }          // wins that clinch regardless
    for(let x=0; x<=Gi; x++){ if(Wi + Gi - x < nowP){ r.elimNum = x; break; } }     // losses that end it regardless
    out[t.id] = r;
  });
  let exact = false;
  if(rem.length <= ODDS_ENUM_CAP){
    // late season: enumerate all 2^k outcomes (the loop carried over from the retired oddsSwing()). Catches
    // cases the bounds miss, e.g. two chasers who play each other can't both win.
    exact = true;
    const ids = T.map(t=>t.id), w = new Float64Array(NT), base = Float64Array.from(ids, id=>W[id]);
    const allIn = new Uint8Array(NT).fill(1), allOut = new Uint8Array(NT).fill(1);
    const allBye = new Uint8Array(NT).fill(1), noBye = new Uint8Array(NT).fill(1);
    const combos = 1 << rem.length;
    for(let mask=0; mask<combos; mask++){
      w.set(base);
      for(let i=0; i<rem.length; i++){ const g = rem[i]; if(mask & (1<<i)) w[g.homeIx]++; else w[g.awayIx]++; }
      for(let i=0; i<NT; i++){
        let above = 0, level = 0;
        for(let j=0; j<NT; j++){ if(j===i) continue; if(w[j] > w[i]) above++; else if(w[j]===w[i]) level++; }
        if(above + level >= P) allIn[i] = 0;   // wins-ties resolved against i: i could miss
        if(above < P) allOut[i] = 0;           // wins-ties resolved for i: i could get in
        if(B>0){ if(above + level >= B) allBye[i] = 0; if(above < B) noBye[i] = 0; }
      }
    }
    ids.forEach((id,i)=>{
      const r = out[id];
      r.clinchedIn = r.clinchedIn || !!allIn[i]; r.eliminated = r.eliminated || !!allOut[i];
      if(B>0){ r.clinchedBye = r.clinchedBye || !!allBye[i]; r.byeGone = r.byeGone || !!noBye[i]; }
    });
  }
  T.forEach(t=>{ const r = out[t.id]; if(r.clinchedIn) r.magic = 0; if(r.eliminated) r.elimNum = 0; });
  return { byId:out, exact };
}

// Owner rule: Bubble includes up to one win above the cutoff and all still-alive
// teams below it. Existing exact clinch/elimination decisions take precedence.
const BADGE = { bye:{label:"BYE",cls:"bs-up"}, clinched:{label:"CLINCHED",cls:"bs-up"}, in:{label:"IN",cls:"bs-up"},
  bubble:{label:"BUBBLE",cls:"bs-warn"}, out:{label:"OUT",cls:"bs-dim"}, elim:{label:"ELIMINATED",cls:"bs-down"} };
function badgeHtml(b){ return `<span class="bs-tag ${b.cls}">${b.label}</span>`; }
function playoffBadges(D, cm){
  const st = standings(D), P = D.playoffTeams;
  const Wd = r => r.w + 0.5*(r.t||0);
  const W7 = st[P-1] ? Wd(st[P-1]) : 0, W8 = st[P] ? Wd(st[P]) : W7;
  const byId = {};
  st.forEach((r,i)=>{
    const c = cm.byId[r.id], Wi = Wd(r), inNow = i < P;
    const gap = inNow ? Wi - W8 : W7 - Wi;                 // in: games over the first team out; out: games back
    const key=HubScenarios.playoffStatus({inNow,wins:Wi,cutoffWins:W7,...c});
    byId[r.id] = { key, label:BADGE[key].label, cls:BADGE[key].cls, seed:i+1, inNow, gap,
      line: gap===0 ? "0, on points" : inNow ? `+${fmtW(gap)}` : `${fmtW(gap)} back` };
  });
  return { byId, W7, W8 };
}

// everything the Playoffs tab (and the Status badges) need, computed once per data load
function playoffEngine(D){
  const t0 = performance.now();
  const str = teamStrength(D), sos = sosRemaining(D, str), cm = clinchMath(D), bd = playoffBadges(D, cm);
  const mc = D.week >= 3 ? monteCarlo(D, str) : null;     // odds from Week 3 on (two weeks of scores)
  return { week:D.week, str, sos, cm:cm.byId, exact:cm.exact, bd, mc, rem: remainingGames(D), ms: performance.now()-t0 };
}

// This week's Stakes: current-week games sorted by swing = |odds if win - odds if lose|, both teams added.
function stakesThisWeek(D, E){
  const mc = E.mc; if(!mc) return [];
  const sh = id => D.byId[id]?.short || "—";
  const P = D.playoffTeams, seedOf = id => E.bd.byId[id]?.seed;
  const rows = [];
  mc.rem.forEach((g,gi)=>{
    if(g.wk!==D.week) return;
    const h = { id:g.homeId, win:condIn(mc,gi,g.homeId,true), lose:condIn(mc,gi,g.homeId,false) };
    const a = { id:g.awayId, win:condIn(mc,gi,g.awayId,false), lose:condIn(mc,gi,g.awayId,true) };
    if([h.win,h.lose,a.win,a.lose].some(x=>x==null)) return;
    h.sw = Math.abs(h.win-h.lose); a.sw = Math.abs(a.win-a.lose);
    let third = null;   // biggest move for a team NOT in this game
    D.teams.forEach(t=>{
      if(t.id===g.homeId || t.id===g.awayId) return;
      const ph = condIn(mc,gi,t.id,true), pa = condIn(mc,gi,t.id,false);
      if(ph==null || pa==null) return;
      const d = Math.abs(ph-pa); if(!third || d > third.d) third = { id:t.id, ph, pa, d };
    });
    rows.push({ gi, homeId:g.homeId, awayId:g.awayId, home:h, away:a, swing: Math.round((h.sw + a.sw)*100), third });
  });
  rows.sort((x,y)=> (y.swing-x.swing) || ((y.home.sw+y.away.sw)-(x.home.sw+x.away.sw)) || (x.gi-y.gi));
  rows.forEach((r,i)=>{
    const [A, Bt] = r.home.sw >= r.away.sw ? [r.home, r.away] : [r.away, r.home];
    const aLine = `${pc(A.win)} with a win, ${pc(A.lose)} with a loss`;
    let s;
    if(i===0) s = `Biggest game of the week. ${sh(A.id)}: ${aLine}.`;
    else if(seedOf(A.id)===P) s = `${sh(A.id)}'s hold on the last spot is on the line: ${aLine}.`;
    else if(seedOf(A.id)===P+1) s = `${sh(A.id)}, the first team out: ${aLine}.`;
    else s = `${sh(A.id)}: ${aLine}.`;
    if(Bt.lose >= 0.9) s += ` ${sh(Bt.id)} is close to safe either way: ${pc(Bt.win)} / ${pc(Bt.lose)}.`;
    else if(Bt.win < 0.25 && Bt.win >= 0.1) s += ` ${sh(Bt.id)} needs it to stay alive: ${pc(Bt.win)} / ${pc(Bt.lose)}.`;
    else s += ` ${sh(Bt.id)}: ${pc(Bt.win)} / ${pc(Bt.lose)}.`;
    if(r.third && Math.round(r.third.d*100) > 4)
      s += ` Also matters to ${sh(r.third.id)}: ${pc(r.third.ph)} if ${sh(r.homeId)} wins, ${pc(r.third.pa)} if ${sh(r.awayId)} wins.`;
    r.sentence = s; r.firstId = A.id; r.secondId = Bt.id;
  });
  return rows;
}

// one bubble card's text: record + seed, schedule rank, form/luck when notable, odds, this week's game,
// and the biggest remaining game by the team's own swing (when it isn't this week's).
function bubbleSentence(D, E, id, topGi){
  const mc = E.mc, b = E.bd.byId[id], x = E.str[id], so = E.sos[id], t = D.byId[id];
  const P = D.playoffTeams, NT = D.teams.length, nm = t.short, sh = k => D.byId[k]?.short || "—";
  const out = [];
  if(b.seed===P && b.gap===0) out.push(`${nm} is ${recStr(t.record)} and holds the last spot on points.`);
  else if(b.seed===P+1) out.push(`${nm} is ${recStr(t.record)}, the first team out.`);
  else out.push(`${nm} is ${recStr(t.record)} (seed ${b.seed}).`);
  if(so.rank!=null){
    const r = so.rank, opp = pts(so.opp);
    let sch;
    if(r===1) sch = `The easiest remaining schedule in the league (opponents avg ${opp})`;
    else if(r<=3) sch = `The ${ordinal(r)}-easiest schedule left (opponents avg ${opp})`;
    else if(r===NT) sch = `The hardest remaining schedule in the league (opponents avg ${opp})`;
    else if(r>=NT-2) sch = `The ${ordinal(NT-r+1)}-hardest schedule left (rank ${r} of ${NT}, opponents avg ${opp})`;
    else sch = `A middle-of-the-pack schedule left (rank ${r} of ${NT}, opponents avg ${opp})`;
    const notes = [];
    if(x.last3!=null && Math.abs(x.last3 - x.pfg) >= 10) notes.push(`${pts(x.last3)} a game over the last 3`);
    if(Math.abs(x.luck) >= 1) notes.push(`${fmtW(Math.round(Math.abs(x.luck)*10)/10)} wins ${x.luck>0?"luckier":"unluckier"} than the all-play record`);
    out.push(sch + (notes.length ? " and " + notes.join(" and ") : "") + ".");
  }
  out.push(`${oddsTxt(mc.teams[id].pIn, E.cm[id])} to make it.`);
  let best = null, cur = null;
  mc.rem.forEach((g,gi)=>{
    if(g.homeId!==id && g.awayId!==id) return;
    const home = g.homeId===id, win = condIn(mc,gi,id,home), lose = condIn(mc,gi,id,!home);
    if(win==null || lose==null) return;
    const y = { gi, wk:g.wk, opp: home ? g.awayId : g.homeId, win, lose, sw: Math.abs(win-lose) };
    if(g.wk===D.week) cur = y;
    if(!best || y.sw > best.sw) best = y;
  });
  if(cur) out.push(cur.gi===topGi
    ? `This week vs ${sh(cur.opp)} is the biggest game of the week: ${pc(cur.win)} with a win, ${pc(cur.lose)} with a loss.`
    : `This week vs ${sh(cur.opp)}: ${pc(cur.win)} with a win, ${pc(cur.lose)} with a loss.`);
  if(best && (!cur || best.gi!==cur.gi)) out.push(`Biggest game left: Week ${best.wk} vs ${sh(best.opp)} (${pc(best.win)} / ${pc(best.lose)}).`);
  return out.join(" ");
}

// "Usually in (80%+) with N more wins of G", from the sims, by the team's own remaining wins
function needLine(mc, id){
  const T = mc.teams[id]; if(!T) return null;
  const k = T.need.findIndex(v=>v.n>=100 && v.p>=0.8);
  if(k<0) return null;
  return k===0 ? `Usually in (80%+) even losing out.` : `Usually in (80%+) with ${k} more win${k===1?"":"s"} of ${T.gLeft}.`;
}

function conditionalBye(mc, gi, id, homeWon){
  const i = mc.ix[id]; if(i==null || !mc.byeCond) return null;
  const n = homeWon ? mc.homeWins[gi] : mc.N-mc.homeWins[gi];
  return n>=100 ? mc.byeCond[(gi*2+(homeWon?0:1))*mc.NT+i]/n : null;
}

// Minimum additional wins guaranteeing the single bye, even if all other outcomes/PF go against us.
// If m wins exceed games against other opponents, the remaining wins must beat this rival.
function byeMagicNumber(D,E,id){
  const c=E?.cm[id];
  if(!c) return "Checking…";
  if(c.clinchedBye) return "Clinched bye";
  if(c.byeGone) return "Out of bye race";
  if(D.byes!==1) return "—";
  const games=remainingGames(D), own=games.filter(g=>g.homeId===id||g.awayId===id), Gi=own.length;
  const rivals=D.teams.filter(t=>t.id!==id).map(t=>({
    ceiling:winsOf(t)+games.filter(g=>g.homeId===t.id||g.awayId===t.id).length,
    meetings:own.filter(g=>g.homeId===t.id||g.awayId===t.id).length
  }));
  const Wi=winsOf(D.byId[id]);
  for(let m=0;m<=Gi;m++){
    if(rivals.every(r=>Wi+m>r.ceiling-Math.max(0,m-(Gi-r.meetings))))
      return m===0 ? "Clinched bye" : `${m} more win${m===1?"":"s"} clinch`;
  }
  return "Needs help";
}

function byePathHtml(D,E,id){
  const magic=byeMagicNumber(D,E,id);
  if(magic!=="Needs help") return esc(magic);
  const games=remainingGames(D),own=games.filter(g=>g.homeId===id||g.awayId===id),t=D.byId[id];
  const target=winsOf(t)+own.length;
  const leaders=D.teams.slice().sort((a,b)=>winsOf(b)-winsOf(a)||b.pf-a.pf),leader=leaders[0];
  const gap=Math.max(0,winsOf(leader)-winsOf(t));
  const losses=D.teams.filter(r=>r.id!==id).flatMap(r=>{
    const left=games.filter(g=>g.homeId===r.id||g.awayId===r.id).length;
    const forced=own.filter(g=>g.homeId===r.id||g.awayId===r.id).length;
    const ceiling=winsOf(r)+left-forced;
    // All our remaining games are wins in this scenario, so head-to-head losses are already included.
    const n=Math.max(0,Math.floor(ceiling-target)+1);
    return n ? [{name:r.short,n}] : [];
  });
  const groups=new Map();
  losses.forEach(r=>{if(!groups.has(r.n)) groups.set(r.n,[]);groups.get(r.n).push(r.name);});
  const lossItems=[...groups].sort((a,b)=>a[0]-b[0]).map(([n,names])=>`<li>${names.map(esc).join(", ")}: ${n} other loss${n===1?"":"es"}${names.length>1?" each":""}.</li>`).join("");
  const pfGap=leader.pf-t.pf;
  const points=pfGap>0 ? `About ${pts(pfGap)} PF behind ${esc(leader.short)} today.`
    : `Not behind ${esc(leader.short)} on PF today.`;
  const record=`${t.record.w+own.length}-${t.record.l}${t.record.t?"-"+t.record.t:""}`;
  const gapLabel=gap===0?"Tied for lead":`${fmtW(gap)} win${gap===1?"":"s"} back`;
  return `<details class="bs-details"><summary>${gapLabel} · Bye path</summary>`
    + `<p class="cap"><b>One example path:</b></p><ul class="cap"><li>Win your last ${own.length} → finish ${record}.</li>${lossItems}</ul>`
    + `<p class="cap">All listed results are needed for this path. “Other losses” exclude games against you, already counted above. Fewer wins can work with more help.</p>`
    + `<p class="cap">${points} Final tied records go to total PF; that target keeps moving.</p></details>`;
}

// Exact race membership comes from clinchMath; simulation percentages never eliminate a team.
function byeRacePanel(D, E){
  const B = D.byes || 0;
  const st = D.teams.slice().sort((a,b)=>winsOf(b)-winsOf(a)||b.pf-a.pf)
    .map((t,i)=>({id:t.id,seed:i+1,...t.record,pf:t.pf}));
  const mc = E?.mc, sh = id=>D.byId[id]?.short || "—";
  const alive = st.filter(r=>!E?.cm[r.id]?.byeGone);
  const title = "Playoff &amp; Bye Race";
  const team = id=>`<span class="tm-cell">${avatarHtml(id,sh(id),20)}<span>${esc(sh(id))}</span></span>`;
  const rows = st.map(r=>{
    const c = E?.cm[r.id], m = mc?.teams[r.id];
    const playoff = !c ? "Checking…" : c.clinchedIn ? "Clinched playoffs" : c.eliminated ? "Out of playoffs" : E.bd?.byId[r.id]?.key==="bubble" ? "Bubble" : r.seed<=D.playoffTeams ? "In playoff position" : "Below cutoff";
    const bye = !c ? "Checking…" : c.clinchedBye ? "Clinched bye" : c.byeGone ? "Out of bye race" : r.seed<=B ? "Holds bye today" : "Chasing bye";
    const pIn = c?.clinchedIn ? "100%" : c?.eliminated ? "0%" : m ? pc(m.pIn) : "—";
    const pBye = c?.clinchedBye ? "100%" : c?.byeGone ? "0%" : m ? pc(m.pBye) : "—";
    return `<tr><td class="race-name">${team(r.id)}</td><td class="num race-metric" data-label="Record">${recStr(r)}</td><td class="num race-metric" data-label="Playoff odds">${pIn}</td>${B?`<td class="num race-metric" data-label="Bye odds">${pBye}</td><td class="race-path" data-label="Bye clinch / path">${byePathHtml(D,E,r.id)}</td>`:""}<td class="race-status" data-label="Status">${esc(playoff)}${B?`<br><span class="bs-dim">${esc(bye)}</span>`:""}</td></tr>`;
  }).join("");
  const details = B && mc ? alive.map(r=>{
    const c = E.cm[r.id]; if(c.clinchedBye) return "";
    const games = mc.rem.flatMap((g,gi)=>{
      if(g.homeId!==r.id && g.awayId!==r.id) return [];
      const home = g.homeId===r.id, win = conditionalBye(mc,gi,r.id,home), lose = conditionalBye(mc,gi,r.id,!home);
      return [{g,win,lose,swing:win==null||lose==null ? -1 : Math.abs(win-lose)}];
    });
    const current = games.find(x=>x.g.wk===D.week);
    const biggest = games.slice().sort((a,b)=>b.swing-a.swing)[0];
    const chosen = [...new Set([current,biggest].filter(Boolean))];
    return chosen.length ? `<p class="cap"><b>${esc(sh(r.id))}:</b> ${chosen.map(({g,win,lose})=>{
      const opp = g.homeId===r.id ? g.awayId : g.homeId;
      return `Week ${g.wk} vs ${esc(sh(opp))}: bye chance ${pc(win)} with a win / ${pc(lose)} with a loss`;
    }).join(". ")}.</p>` : "";
  }).join("") : "";
  return `<section class="bs-panel" id="po-teams"><span id="po-bye"></span><div class="bs-panel-head"><h2 class="bs-h2">${title}</h2><span class="bs-meta">Official records · Hub simulation odds</span></div>`
    + `<div class="bs-panel-body">${B?`<p class="cap">${st.slice(0,B).map(r=>`${esc(sh(r.id))} (${recStr(r)}, ${pts(r.pf)} PF)`).join(" · ")} ${B===1?"leads":"hold the byes"} today. Tied records are separated by total points for; future points can change that order.</p>`:""}`
    + `<p class="cap">All teams are shown; playoff and bye eligibility are separate. Current-score projections and your Season Predictor picks do not change this race.</p></div>`
    + `<div class="bs-table-wrap"><table class="bs-table race-table"><thead><tr><th scope="col">Team</th><th scope="col" class="num">W-L</th><th scope="col" class="num">Playoff odds</th>${B?`<th scope="col" class="num">Bye odds</th><th scope="col">Bye magic number</th>`:""}<th scope="col">Status</th></tr></thead><tbody>${rows}</tbody></table></div>`
    + `<div class="bs-panel-body">${!E?'<p class="cap">Checking clinch and elimination status…</p>':!mc?'<p class="cap">Simulation odds need at least two completed weeks of scores.</p>':""}`
    + (details ? `<details class="bs-details"><summary>Key games in the bye race</summary><p class="cap">Each contender's current game and biggest remaining win/loss swing. These are conditional simulation estimates, not guarantees; other results still matter. — means fewer than 100 simulated outcomes.</p>${details}</details>` : "")
    + `<p class="cap">Clinched and out labels use exact math. Percentages are Hub simulation estimates. Losing bye eligibility does not mean elimination from the playoffs.</p>`
    + (B===1?`<p class="cap"><b>Bye magic number:</b> additional wins that guarantee the #1 seed, regardless of other results or future points. Includes head-to-head games. Where wins alone cannot guarantee it, expand the win-out path for specific rival losses and today's record/PF gap. This is one sufficient scenario, not a prediction or minimum wins required. A tied final record needs the points-for tiebreak. Updated from official records, not live-score assumptions.</p>`:"")
    + extraTeamStatsPanel(D,E,st)
    + `</div></section>`;
}

function extraTeamStatsPanel(D,E,st){
  if(!E?.str || !E?.sos) return "";
  const rows=st.map(r=>{
    const id=r.id,t=D.byId[id],x=E.str[id],so=E.sos[id],m=E.mc?.teams[id],c=E.cm[id];
    const clinch=c.clinchedIn ? "Clinched" : c.eliminated ? "Eliminated" : c.magic!=null ? `${c.magic} W` : c.elimNum!=null ? `${c.elimNum} L` : "—";
    return `<tr><td>${esc(t.short)}</td><td class="num">${pts(x.pfg)}</td><td class="num">${fmtW(x.allplayW)}-${fmtW(x.allplayL)}</td><td class="num">${signed1(x.luck)}</td><td class="num">${x.last3!=null?pts(x.last3):"—"}</td><td class="num">${so.opp!=null?`${pts(so.opp)} (${so.rank})`:"—"}</td><td class="num">${t.espnPlayoffPct!=null?Math.round(t.espnPlayoffPct*100)+"%":"—"}</td><td class="num">${m?`${m.projW.toFixed(1)}-${m.projL.toFixed(1)}`:"—"}</td><td class="num">${clinch}</td><td class="num">${t.projTeam>0?pts(t.projTeam):"—"}</td></tr>`;
  }).join("");

}

function paintPlayoffs(){
  const D = DATA; const el = document.getElementById("pane-playoffs");
  if(!D){ el.innerHTML = `<div class="note">No data.</div>`; return; }
  const E = (ENGINE && ENGINE.week===D.week) ? ENGINE : null;
  const mc = E ? E.mc : null;
  const sh = id => D.byId[id]?.short || "—";
  const P = D.playoffTeams, B = D.byes || 0, st = standings(D);
  const teamCell = (id, seed) => `<span class="tm-cell">${seed!=null?`<span class="bs-dim">${seed}</span>`:""}${avatarHtml(id, sh(id), 20)}<span>${esc(sh(id))}</span></span>`;
  const weeksLeft = Math.max(0, D.regWeeks - D.week + 1);
  const pending = !E ? "Working out the odds…"
    : !mc ? (D.week < 3 ? "Odds start in Week 3, once there are two weeks of scores." : "No odds to show right now.") : null;
  const s = [];

  // ---- 1. If the season ended today (bracket from current seeds) ----
  const byeT = st.slice(0, B), r1 = [];
  for(let k=0; B+k < P-1-k; k++) r1.push([st[B+k], st[P-1-k]]);
  const firstOut = st.slice(P, P+2);
  s.push(`<section class="bs-panel" id="po-today"><div class="bs-panel-head"><h2 class="bs-h2">If the season ended today</h2>`
    + `<span class="bs-meta">Top ${P} of ${D.size} make it${B ? ` · ${B===1 ? "#1 gets a bye" : `top ${B} get byes`}` : ""}</span></div>`);
  if(byeT.length) s.push(`<div class="bs-panel-body"><p class="cap"><b>Bye:</b> ${byeT.map(r=>`${r.seed} ${esc(sh(r.id))}`).join(" · ")}</p></div>`);
  if(r1.length) s.push(`<div class="bs-table-wrap"><table class="bs-table"><thead><tr><th scope="col">Round 1, Week ${D.playoffStart}</th><th scope="col">Opponent</th></tr></thead><tbody>`
    + r1.map(([a,b])=>`<tr><td>${teamCell(a.id, a.seed)}</td><td>${teamCell(b.id, b.seed)}</td></tr>`).join("") + `</tbody></table></div>`);
  s.push(`<div class="bs-panel-body">`);
  if(firstOut.length) s.push(`<p class="cap"><b>First out:</b> ${firstOut.map(r=>`${esc(sh(r.id))} (${recStr(r)}, ${pts(r.pf)} PF)`).join(" · ")}</p>`);
  s.push(`<p class="cap">${weeksLeft ? `${weeksLeft} regular-season week${weeksLeft===1?"":"s"} left (through Week ${D.regWeeks}).` : "The regular season is over."} Full table: <a href="#standings">Standings</a></p></div></section>`);

  s.push(byeRacePanel(D,E));

  // ---- 2. This week's Stakes (sorted by swing; one row + one blurb each) ----
  const stakes = mc ? stakesThisWeek(D, E) : [];
  s.push(`<section class="bs-panel" id="po-stakes"><div class="bs-panel-head"><h2 class="bs-h2">This week's Stakes (Week ${D.week})</h2><span class="bs-meta">Sorted by playoff-odds swing</span></div>`);
  if(pending) s.push(`<div class="bs-panel-body"><p class="cap">${pending}</p></div>`);
  else if(!stakes.length) s.push(`<div class="bs-panel-body"><p class="cap">No regular-season games this week.</p></div>`);
  else {
    s.push(`<div class="bs-table-wrap"><table class="bs-table"><thead><tr><th class="num" scope="col">#</th><th scope="col">Game</th>`
      + `<th class="num" scope="col" title="Points of playoff odds that move between a win and a loss, both teams added">Swing</th></tr></thead><tbody>`
      + stakes.map((r,i)=>`<tr class="po-main"><td class="num">${i+1}</td><td><span class="tm-cell">${avatarHtml(r.homeId, sh(r.homeId), 20)}<span>${esc(sh(r.homeId))}</span>`
          + `<span class="bs-dim">vs</span>${avatarHtml(r.awayId, sh(r.awayId), 20)}<span>${esc(sh(r.awayId))}</span></span></td><td class="num">${r.swing}</td></tr>`
          + `<tr class="po-sub"><td></td><td colspan="2">${esc(r.sentence)}</td></tr>`).join("")
      + `</tbody></table></div>`);
    s.push(`<div class="bs-panel-body"><p class="cap">Swing: how many points of playoff odds (Hub) move between a win and a loss, both teams added.</p></div>`);
  }
  s.push(`</section>`);

  // ---- 3. The Bubble: within one win above cutoff plus all alive below it ----
  const bubble = E ? st.filter(r=>E.bd.byId[r.id].key==="bubble").map(r=>r.id) : [];
  const bset = new Set(bubble);
  const swingGames = E ? E.rem.filter(g=>bset.has(g.homeId) && bset.has(g.awayId)).length : 0;
  s.push(`<section class="bs-panel" id="po-bubble"><div class="bs-panel-head"><h2 class="bs-h2">The Bubble</h2>`
    + `<span class="bs-meta">${E ? `${bubble.length} team${bubble.length===1?"":"s"} in the chase · official records` : ""}</span></div><div class="bs-panel-body">`);
  if(pending) s.push(`<p class="cap">${pending}</p>`);
  else if(!bubble.length) s.push(`<p class="cap">Nobody meets the bubble rule: up to one win above the cutoff, or below it and still mathematically alive.</p>`);
  else s.push(`<p class="cap">Using official records: teams up to one win above the playoff cutoff (seed ${P}), plus every team below it that can still qualify. Clinched-in and mathematically eliminated teams have separate labels.`
    + ` * = swing game: a head-to-head between two bubble teams (${swingGames} left).</p>`);
  s.push(`</div></section>`);
  if(!pending && bubble.length){
    const topGi = stakes.length ? stakes[0].gi : null;
    bubble.forEach(id=>{
      const b = E.bd.byId[id], t = D.byId[id], c = E.cm[id];
      const remRow = E.rem.filter(g=>g.homeId===id || g.awayId===id).map(g=>{
        const opp = g.homeId===id ? g.awayId : g.homeId;
        return `W${g.wk} ${esc(sh(opp))}${bset.has(opp) ? "*" : ""}`;
      }).join(" · ");
      const extra = [needLine(mc, id),
        c.magic!=null ? `Magic number ${c.magic} (wins that clinch a spot no matter what).` : null,
        c.elimNum!=null ? `Elimination number ${c.elimNum} (losses that end it no matter what).` : null].filter(Boolean);
      s.push(`<section class="bs-panel"><div class="bs-panel-head"><h3 class="bs-h2"><span class="tm-cell">${avatarHtml(id, sh(id), 22)}<span>${esc(sh(id))}</span></span></h3>`
        + `<span class="bs-meta">${recStr(t.record)} · seed ${b.seed} · ${oddsTxt(mc.teams[id].pIn, c)}</span></div><div class="bs-panel-body">`
        + `<p class="po-text">${esc(bubbleSentence(D, E, id, topGi))}</p>`
        + (extra.length ? `<p class="cap">${esc(extra.join(" "))}</p>` : "")
        + `<p class="cap">Remaining: ${remRow || "none"}</p></div></section>`);
    });
  }

  // ---- 5. How this works (collapsed) ----
  s.push(`<section class="bs-panel"><div class="bs-panel-body"><details class="bs-details"><summary>How this works</summary>`
    + `<p class="cap">Odds come from playing out the rest of the regular season 10,000 times. Each team's weekly score is drawn around its season average, pulled toward the league average early on, with ESPN's projections mixed in for this week only.</p>`
    + `<p class="cap">Ties in record go to total points for, like ESPN. Clinched and eliminated are exact math, not simulations.</p>`
    + `<p class="cap">The numbers stay the same all week and update when ESPN finalizes scores.</p>`
    + `</details></div></section>`);

  el.innerHTML = s.join("");
}

// The playoff engine runs AFTER the first paint (standings render first, odds fill in), on the first load and
// then only when its inputs change: records, points for, or the set of finalized games (engineSig). An
// auto-refresh with nothing new keeps the same ENGINE, so the odds don't re-run every 2.5 minutes.
let ENGINE_TIMER = null;
let ENGINE_SIG = null;
function engineSig(D){
  return D.week + "|" + D.teams.map(t=>`${t.id}:${t.record.w}-${t.record.l}-${t.record.t}:${t.pf}`).join(",")
    + "|" + D.games.filter(g=>g.finalized).length;
}
function runPlayoffEngine(){
  clearTimeout(ENGINE_TIMER);
  ENGINE_TIMER = setTimeout(()=>{
    if(!DATA) return;
    const sig = engineSig(DATA);
    try{ ENGINE = playoffEngine(DATA); ENGINE_SIG = sig; }
    catch(e){ console.error("Playoff engine failed:", e); return; }
    paintPlayoffs(); paintStandings(); paintTeams();
    scrollToPlayoffSub();
  }, 0);
}

// One team at a time (proposal 4): record, team strength and both playoff odds, the roster (Starters / Bench / IR)
// with ESPN's season numbers and ESPN's projection for this week (labeled as ESPN's), the depth counts that used to
// be their own surplus/shortage tab (retired; IR players now left out), and the full schedule. ESPN league data only.

// Depth counts: rostered players per position vs the starting slots QB, RB x2, WR x2, TE, FLEX (RB/WR/TE), D/ST, K.
// Counts only: no values, no rankings.
const DEPTH_POS = ["QB","RB","WR","TE","DEF","K"];
const START_NEED = { QB:1, RB:2, WR:2, TE:1, DEF:1, K:1 };   // dedicated slots; the one FLEX is handled across RB/WR/TE
const FLEX_POOL = ["RB","WR","TE"];
const DEPTH_TXT = { surplus:{label:"Surplus",cls:"bs-up"}, short:{label:"Short",cls:"bs-down"}, ok:{label:"OK",cls:""} };
// SURPLUS = more than you can start (startable + 1); SHORT = at or below what you must start.
// K and D/ST (one slot, no depth expected): short only at 0, surplus at 3+.
function depthStatus(pos, count){
  const need = START_NEED[pos] || 0;
  const flexEligible = FLEX_POOL.includes(pos);
  if(pos==="K" || pos==="DEF"){
    if(count === 0) return { count, need, status:"short" };
    if(count >= 3)  return { count, need, status:"surplus" };
    return { count, need, status:"ok" };
  }
  const startable = need + (flexEligible ? 1 : 0);   // TE: 1 + FLEX = 2 -> 3+ surplus; RB/WR: 4+; QB: 2+
  if(count >= startable + 1) return { count, need, status:"surplus" };
  if(count <= need) return { count, need, status:"short" };
  return { count, need, status:"ok" };
}
// rostered count per position with IR players EXCLUDED (the retired surplus/shortage tab counted t.players, IR included)
function depthCounts(t){
  const cnt = {}; DEPTH_POS.forEach(p=>cnt[p]=0);
  t.players.forEach(p=>{ if(!p.onIR && cnt[p.pos]!=null) cnt[p.pos]++; });
  return DEPTH_POS.map(p=>({ pos:p, ...depthStatus(p, cnt[p]) }));
}

const SLOT_ORDER = [0,1,2,3,4,5,6,7,23,16,17];   // lineup order: QB, RB, WR, TE, FLEX, D/ST, K
const slotRank = id => { const i = SLOT_ORDER.indexOf(id); return i<0 ? 99 : i; };
const posRank = p => { const i = POS_ORDER.indexOf(p); return i<0 ? 99 : i; };

/* ============================ HISTORY ============================ */
// Champions and all-time records from 2018 to last season, from the same proxy with &season=Y (views mTeam + mSettings).
// ESPN answers not-found for this league before 2018, so those years are left out (and the page says so).
// Owners are grouped by the HASHED ESPN owner id (api/espn.js sanitize: the same account gives the same "m" + 10 hex
// every season), never by team id (team ids get reused) and never by the current-season MEMBER map.
// Past seasons never change: each one is fetched once, the first time History opens, then kept in localStorage.
const HIST_FIRST = 2018;
const HIST = {};   // year -> {state:"loading"|"ok"|"err", data}
function histYears(){ const ys = []; for(let y = Number(LEAGUE.season)-1; y >= HIST_FIRST; y--) ys.push(y); return ys; }   // newest first
const histKey = y => `rc-hist-v1-${LEAGUE.id}-${y}`;
function histCacheGet(y){
  try{ const d = JSON.parse(localStorage.getItem(histKey(y)) || "null");
    return (d && d.year===y && Array.isArray(d.teams) && d.teams.length) ? d : null; }catch(e){ return null; }
}
function histCacheSet(y, d){ try{ localStorage.setItem(histKey(y), JSON.stringify(d)); }catch(e){} }
// called when the History tab opens: read each season from localStorage, fetch only the missing ones
function ensureHistory(){
  const prov = providers[LEAGUE.provider];
  if(!prov.loadSeason) return;
  histYears().forEach(y=>{
    const e = HIST[y];
    if(e && (e.state==="ok" || e.state==="loading")) return;
    const cached = histCacheGet(y);
    if(cached){ HIST[y] = { state:"ok", data:cached }; return; }
    const ne = HIST[y] = { state:"loading", data:null };
    prov.loadSeason(y)
      .then(d=>{ ne.state = "ok"; ne.data = d; histCacheSet(y, d); }, err=>{ ne.state = "err"; console.warn("Season "+y+":", err); })
      .then(()=> paintHistory());
  });
  paintHistory();
}

function paintHistory(){
  const el = document.getElementById("pane-history");
  const D = DATA, years = histYears();
  const seasons = years.filter(y=>HIST[y] && HIST[y].state==="ok").map(y=>HIST[y].data);   // newest first
  const loadingN = years.filter(y=>HIST[y] && HIST[y].state==="loading").length;
  const failed = years.filter(y=>HIST[y] && HIST[y].state==="err");
  // current members by hashed owner id -> current team id (for the member's name and logo)
  const cur = {};
  if(D) D.teams.forEach(t=>(t.owners||[]).forEach(h=>{ cur[h] = t.id; }));
  const curOf = tm => { if(tm.owner && cur[tm.owner]!=null) return cur[tm.owner]; const h = (tm.owners||[]).find(o=>cur[o]!=null); return h ? cur[h] : null; };
  const keyOf = (S, tm) => tm.owner || `t${S.year}-${tm.id}`;   // primary owner's hash; an ownerless team stands alone
  // all-time by owner (oldest season first, so the last team name seen is the most recent one)
  const G = {};
  seasons.slice().reverse().forEach(S=>S.teams.forEach(tm=>{
    const k = keyOf(S, tm);
    const o = G[k] = G[k] || { key:k, seasons:0, titles:0, second:0, playoffs:0, w:0, l:0, t:0, recentName:"", curId:null, best:null };
    o.seasons++; o.w += tm.w; o.l += tm.l; o.t += tm.t; o.recentName = tm.name;
    if(tm.rank===1) o.titles++;
    if(tm.rank===2) o.second++;
    if(S.playoffTeams && tm.seed>=1 && tm.seed<=S.playoffTeams) o.playoffs++;
    const ci = curOf(tm); if(ci!=null) o.curId = ci;
    if(tm.rank>=1 && (o.best==null || tm.rank<o.best)) o.best = tm.rank;
  }));
  const nameOf = o => (o && o.curId!=null && D && D.byId[o.curId]) ? D.byId[o.curId].short : null;
  const teamWho = (S, tm) => {
    const o = G[keyOf(S, tm)], nm = nameOf(o);
    return `<span class="tm-cell">${avatarHtml(o ? o.curId : null, nm || tm.name, 20)}<span>${esc(tm.name)}<span class="sub-line">${nm ? esc(nm) : "past member"}</span></span></span>`;
  };
  const winPct = o => { const g = o.w + o.l + o.t; return g ? (o.w + 0.5*o.t)/g : 0; };
  const pct3 = v => v.toFixed(3).replace(/^0/, "");
  const s = [];
  const range = `${HIST_FIRST}-${years[0]}`;

  // ---- champions by year ----
  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">Champions</h2>`
    + `<span class="bs-meta">${loadingN ? `Loading ${loadingN} season${loadingN===1?"":"s"}…` : range}</span></div>`
    + `<div class="bs-table-wrap"><table class="bs-table" id="champTable"><thead><tr><th class="num" scope="col">Year</th>`
    + `<th scope="col">Champion</th><th scope="col">Runner-up</th></tr></thead><tbody>`
    + years.map(y=>{
        const e = HIST[y];
        if(!e || e.state!=="ok") return `<tr><td class="num">${y}</td><td colspan="2" class="bs-dim">${e && e.state==="err" ? "Couldn't load this season. Try again later." : "Loading…"}</td></tr>`;
        const S = e.data, ch = S.teams.find(z=>z.rank===1), ru = S.teams.find(z=>z.rank===2);
        return `<tr class="champ-row"><td class="num"><a href="#history/${y}">${y}</a></td>`
          + `<td>${ch ? teamWho(S, ch) : "—"}</td><td>${ru ? teamWho(S, ru) : "—"}</td></tr>`;
      }).join("")
    + `</tbody></table></div><div class="bs-panel-body"><p class="cap">Final ESPN standings after the playoffs. Past member = an ESPN account that doesn't own a team this season.</p></div></section>`);

  // ---- all-time by owner ----
  const owners = Object.values(G).sort((a,b)=> (b.titles-a.titles) || (b.second-a.second) || (b.playoffs-a.playoffs) || (winPct(b)-winPct(a)) || (b.seasons-a.seasons));
  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">All-time by owner</h2>`
    + `<span class="bs-meta">${seasons.length} season${seasons.length===1?"":"s"}${seasons.length ? ` (${seasons[seasons.length-1].year}-${seasons[0].year})` : ""}</span></div>`);
  if(!owners.length) s.push(`<div class="bs-panel-body"><p class="cap">${loadingN ? "Loading past seasons…" : "No past seasons loaded."}</p></div>`);
  else s.push(`<div class="bs-table-wrap"><table class="bs-table bs-table--stick1" id="ownerTable"><thead><tr><th scope="col">Owner</th>`
      + `<th class="num" scope="col">Titles</th><th class="num" scope="col" title="Runner-up finishes">2nd</th>`
      + `<th class="num" scope="col" title="Seasons in the playoff field">Playoffs</th><th class="num" scope="col">Seasons</th>`
      + `<th class="num" scope="col" title="Regular-season record">W-L</th><th class="num" scope="col" title="Regular-season win share (ties count half)">Win %</th>`
      + `<th class="num" scope="col" title="Best final finish">Best</th></tr></thead><tbody>`
      + owners.map(o=>{
          const nm = nameOf(o);
          return `<tr><td><span class="tm-cell">${avatarHtml(o.curId, nm || o.recentName, 20)}<span>${esc(nm || o.recentName)}<span class="sub-line">${nm ? esc(o.recentName) : "past member"}</span></span></span></td>`
            + `<td class="num">${o.titles}</td><td class="num">${o.second}</td><td class="num">${o.playoffs}</td><td class="num">${o.seasons}</td>`
            + `<td class="num">${o.w}-${o.l}${o.t ? "-"+o.t : ""}</td><td class="num">${pct3(winPct(o))}</td>`
            + `<td class="num">${o.best!=null ? ordinal(o.best) : "—"}</td></tr>`;
        }).join("")
      + `</tbody></table></div>`
      + `<div class="bs-panel-body"><p class="cap">Grouped by ESPN owner account (only a one-way hash of it reaches this page), so records follow the person through team renames and team-slot changes. A co-managed team counts for its primary owner. Under the name: the most recent team name. Playoffs = seeded into that season's playoff field.</p></div>`);
  s.push(`</section>`);

  // ---- one season (year tabs; #history/<year> deep-links it) ----
  const selY = (HIST_YEAR!=null && years.includes(HIST_YEAR)) ? HIST_YEAR : years[0];
  const se = HIST[selY];
  s.push(`<section class="bs-panel" id="hsSeason"><div class="bs-panel-head"><h2 class="bs-h2">Season ${selY}</h2><span class="bs-meta">Final standings</span></div>`
    + `<div class="bs-panel-body"><div class="bs-tabs bs-tabs--sub wtabs" role="tablist" aria-label="Season" id="hsTabs">`
    + years.map(y=>`<button type="button" role="tab" id="hsY-${y}" data-key="${y}" aria-controls="hsPane" aria-selected="${y===selY}" tabindex="${y===selY?0:-1}">${y}</button>`).join("")
    + `</div>${HIST_YEAR!=null && !years.includes(HIST_YEAR) ? `<p class="cap">There's no ESPN data for ${esc(HIST_YEAR)}; showing ${selY}.</p>` : ""}</div>`
    + `<div id="hsPane" role="tabpanel" aria-labelledby="hsY-${selY}" tabindex="0">`);
  if(!se || se.state!=="ok") s.push(`<div class="bs-panel-body"><p class="cap">${se && se.state==="err" ? `Couldn't load ${selY}. Try again later.` : `Loading ${selY}…`}</p></div>`);
  else {
    const S = se.data, P = S.playoffTeams;
    s.push(`<div class="bs-table-wrap"><table class="bs-table bs-table--stick1"><thead><tr><th class="num" scope="col" title="Final finish">Fin</th><th scope="col">Team</th>`
      + `<th class="num" scope="col">W-L</th><th class="num" scope="col">PF</th><th class="num" scope="col" title="Playoff seed after the regular season">Seed</th></tr></thead><tbody>`
      + S.teams.slice().sort((a,b)=>(a.rank||99)-(b.rank||99)).map(tm=>`<tr><td class="num">${tm.rank||"—"}</td><td>${teamWho(S, tm)}</td>`
          + `<td class="num">${tm.w}-${tm.l}${tm.t ? "-"+tm.t : ""}</td><td class="num">${pts(tm.pf)}</td>`
          + `<td class="num">${tm.seed ? (P && tm.seed<=P ? tm.seed : `<span class="bs-dim">${tm.seed}</span>`) : "—"}</td></tr>`).join("")
      + `</tbody></table></div><div class="bs-panel-body"><p class="cap">${S.size} teams. ${P ? `Seeds 1-${P} made the playoffs (dim seed = missed).` : ""}</p></div>`);
  }
  s.push(`</div></section>`);

  // ---- what's not here ----
  s.push(`<section class="bs-panel"><div class="bs-panel-body">`
    + `<p class="cap">ESPN has no data for this league before ${HIST_FIRST} (its API answers not-found), so earlier seasons aren't shown.</p>`
    + `<p class="cap">The ${esc(LEAGUE.season)} season joins History once it's over. Past seasons are saved in this browser after the first visit.</p>`
    + (failed.length ? `<p class="cap">Couldn't load: ${failed.join(", ")}. They'll be retried the next time History opens.</p>` : "")
    + `</div></section>`);

  const hadFocus = document.getElementById("hsTabs")?.contains(document.activeElement);
  el.innerHTML = s.join("");
  const ht = document.getElementById("hsTabs");
  if(ht){
    wireTabs(ht, k=>{
      const f = ht.contains(document.activeElement);
      HIST_YEAR = Number(k); paintHistory(); writeHash();
      if(f) document.getElementById("hsY-"+k)?.focus();
    });
    if(hadFocus) document.getElementById("hsY-"+selY)?.focus();
  }
}

/* ============================ LOAD / SHELL ============================ */
async function load(){
  const status=document.getElementById("status"), errbox=document.getElementById("errbox");
  errbox.innerHTML=""; status.textContent="ESPN · loading…";
  // banner title = league name (uppercased, styled gold-on-purple); subtitle "League Hub" is static markup.
  document.getElementById("lgTitle").textContent = LEAGUE.name.toUpperCase();
  document.title = `${LEAGUE.name} League Hub`;
  try{
    const res = await providers[LEAGUE.provider].load();
    if(res.authExpired){
      errbox.innerHTML = `<div class="err"><b>ESPN session expired.</b> The saved cookie no longer works, so live data can't load right now. The league admin needs to refresh <code>ESPN_S2</code> + <code>ESPN_SWID</code> in the Vercel project settings. Everything else here will work again once that's done.</div>`;
      status.textContent="ESPN · couldn't update"; return;
    }
    if(res.notConfigured){
      errbox.innerHTML = `<div class="err">The ESPN connection isn't configured on the server yet (missing env vars). No data to show until that's set up.</div>`;
      status.textContent="ESPN · couldn't update"; return;
    }
    DATA = res; LOAD_SEQ++;
    // re-run the odds only when records / points for / finalized games changed (always on the first load)
    const needEngine = !ENGINE || ENGINE_SIG !== engineSig(DATA);
    if(needEngine) ENGINE = null;
    // first successful load: apply the week/position parts of a shared link (needs D.regWeeks). Auto-refresh keeps in-memory state.
    if(!HASH_APPLIED){ applyHash(readHash()); HASH_APPLIED = true; }
    document.getElementById("sub").textContent = `${DATA.size} teams · ${DATA.season||LEAGUE.season} · Week ${DATA.week}`;
    paintScores(); paintStandings(); paintSeasonPredictor(); paintPlayoffs(); paintLeaders(); paintTeams(); paintHistory();
    writeHash();
    const hhmm = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    status.textContent = `ESPN · updated ${hhmm}`;
    document.getElementById("foot").textContent = "Not affiliated with ESPN.";
    if(needEngine) runPlayoffEngine();   // odds fill in after the first paint
    else scrollToPlayoffSub();
  }catch(e){
    errbox.innerHTML = `<div class="err">Couldn't load the league right now: ${esc(e.message)}. Try Refresh in a moment.</div>`;
    status.textContent="ESPN · couldn't update";
  }
}

/* ---- theme toggle: System -> Light -> Dark (shared snippet, identical across the three apps) ---- */
// theme-color metas follow the OS via media=; a manual choice overrides both so the browser chrome matches (review N7).
const TC_META=[...document.querySelectorAll('meta[name="theme-color"]')], TC_ORIG=TC_META.map(x=>x.content), TC_BG={light:"#F5F6F8",dark:"#0E1116"};
function applyTheme(m){ const r=document.documentElement; if(m==="light"||m==="dark") r.setAttribute("data-theme",m); else r.removeAttribute("data-theme");
  TC_META.forEach((x,i)=>{ x.content = TC_BG[m] || TC_ORIG[i]; });
  try{ m==="system"?localStorage.removeItem("bs-theme"):localStorage.setItem("bs-theme",m); }catch(e){}
  const b=document.getElementById("themeBtn"); if(b){ b.textContent="Theme: "+m[0].toUpperCase()+m.slice(1); b.setAttribute("aria-label","Color theme: "+m+". Activate to change."); } }
function currentTheme(){ return document.documentElement.getAttribute("data-theme")||"system"; }
document.getElementById("themeBtn").addEventListener("click",()=>{ const o=["system","light","dark"]; applyTheme(o[(o.indexOf(currentTheme())+1)%3]); });
applyTheme(currentTheme());

/* ---- tabs (WAI-ARIA tabs pattern, roving tabindex; shared snippet, identical across the three apps) ---- */
// tablist: element with role="tablist"; onSelect(key) paints + writes the hash. Buttons carry data-key.
function wireTabs(tablist, onSelect){
  const tabs=[...tablist.querySelectorAll('[role="tab"]')];
  tabs.forEach((t,i)=>{
    t.addEventListener("click",()=>onSelect(t.dataset.key));
    t.addEventListener("keydown",e=>{ let j=null;
      if(e.key==="ArrowRight") j=(i+1)%tabs.length; else if(e.key==="ArrowLeft") j=(i-1+tabs.length)%tabs.length;
      else if(e.key==="Home") j=0; else if(e.key==="End") j=tabs.length-1;
      if(j!==null){ e.preventDefault(); tabs[j].focus(); onSelect(tabs[j].dataset.key); } });
  });
}
function setSelectedTab(tablist, key){ tablist.querySelectorAll('[role="tab"]').forEach(t=>{ const on=t.dataset.key===key;
  t.setAttribute("aria-selected", on?"true":"false"); t.tabIndex = on?0:-1; }); }

/* ---- URL-hash state (proposal 4): #scores[/wkN] · #standings · #playoffs[/stakes|bubble|teams] ·
        #predictor · #teams[/<teamId>] · #leaders[/<POS>] · #history[/<year>]
        Old links still work: #insights[/wkN] -> #scores[/wkN], #stakes -> #playoffs/stakes, #block -> #teams ---- */
const MAIN_KEYS = ["scores","standings","playoffs","predictor","more"];
const MORE_KEYS = ["teams","leaders","history"];
const TAB_KEYS = [...MAIN_KEYS,...MORE_KEYS];
let LAST_MORE = "teams";
const LEGACY_TAB = { insights:"scores", stakes:"playoffs", block:"teams" };
const PO_SUBS = ["bye","stakes","bubble","teams"];
const HASH_POS = { qb:"QB", rb:"RB", wr:"WR", te:"TE", k:"K", def:"DEF", dst:"DEF" };
let HASH_APPLIED = false;   // week/position segments are applied once, after the first successful load()
let PO_SUB = null;          // Playoffs section to scroll to (#playoffs/<sub>); cleared when the user changes tabs
let PO_SCROLL = false;      // a pending sub-anchor scroll (runs once the Playoffs pane has its content)
let TEAM_SEL = null;        // #teams/<teamId> (painted by the Teams tab, FEAT-004)
let HIST_YEAR = null;       // #history/<year> (painted by the History tab, FEAT-004)
function readHash(){
  const segs = String(location.hash||"").replace(/^#/,"").toLowerCase().split("/").filter(Boolean);
  let tab = segs[0] || "", sub = null;
  if(LEGACY_TAB[tab]){ if(tab==="stakes") sub = "stakes"; tab = LEGACY_TAB[tab]; }
  if(!TAB_KEYS.includes(tab)) tab = "scores";
  let wk = null, pos = null, teamId = null, year = null;
  segs.slice(1).forEach(x=>{
    const m = /^wk(\d{1,2})$/.exec(x);
    if(m && tab==="scores") wk = Number(m[1]);
    else if(tab==="playoffs" && PO_SUBS.includes(x)) sub = x;
    else if(tab==="leaders" && HASH_POS[x]) pos = HASH_POS[x];
    else if(tab==="teams" && /^\d{1,3}$/.test(x)) teamId = Number(x);
    else if(tab==="history" && /^\d{4}$/.test(x)) year = Number(x);
  });
  if(tab!=="playoffs") sub = null;
  return { tab, wk, sub, pos, teamId, year };
}
// apply the non-tab parts of a hash; out-of-range values are ignored (the tabs then use their defaults).
// Only touch a value when the hash carries one (an in-page "#scores" link must not reset a picked week).
function applyHash(h){
  if(h.tab==="playoffs"){ PO_SUB = h.sub; PO_SCROLL = !!h.sub; }
  if(h.tab==="teams" && h.teamId!=null) TEAM_SEL = h.teamId;
  if(h.tab==="history" && h.year!=null) HIST_YEAR = h.year;
  if(h.tab==="leaders" && h.pos) LEAD_POS = h.pos;
  if(!DATA) return;
  if(h.tab==="scores" && h.wk!=null && h.wk>=1 && h.wk<=DATA.regWeeks) VIEW_WEEK = h.wk;
}
function writeHash(){
  if(!DATA && !HASH_APPLIED) return;           // never wipe a pending link's segments before the first load
  const parts = [ACTIVE];
  if(DATA && ACTIVE==="scores" && VIEW_WEEK!=null && VIEW_WEEK!==latestScoredWeek(DATA)) parts.push("wk"+VIEW_WEEK);
  if(ACTIVE==="playoffs" && PO_SUB) parts.push(PO_SUB);
  if(ACTIVE==="teams" && TEAM_SEL!=null) parts.push(String(TEAM_SEL));
  if(ACTIVE==="leaders" && LEAD_POS!=="all") parts.push(LEAD_POS==="DEF" ? "DST" : LEAD_POS);
  if(ACTIVE==="history" && HIST_YEAR!=null) parts.push(String(HIST_YEAR));
  const h = "#"+parts.join("/");
  try{ if(location.hash!==h) history.replaceState(null, "", h); }catch(e){}
}
// scroll to a Playoffs section once its content is painted: #po-stakes / #po-bubble / #po-teams
function scrollToPlayoffSub(){
  if(!PO_SCROLL || !PO_SUB || ACTIVE!=="playoffs" || !DATA) return;
  const el = document.getElementById("po-"+PO_SUB);
  if(!el) return;
  el.scrollIntoView({block:"start"});
  if(ENGINE) PO_SCROLL = false;   // stay pending until the odds have filled in (the page grows)
}
function selectTab(key, opts){
  if(!TAB_KEYS.includes(key)) key = "scores";
  if(key==="more") key=LAST_MORE;
  const inMore=MORE_KEYS.includes(key),mainKey=inMore?"more":key;
  if(inMore)LAST_MORE=key;
  ACTIVE = key;
  const tl = document.getElementById("mainTabs");
  setSelectedTab(tl, mainKey);
  setSelectedTab(document.getElementById("moreTabs"),LAST_MORE);
  MAIN_KEYS.forEach(k=>document.getElementById("pane-"+k).classList.toggle("hide",k!==mainKey));
  MORE_KEYS.forEach(k=>document.getElementById("pane-"+k).classList.toggle("hide",k!==key));
  // scroll to the tab bar only when it has scrolled above the viewport
  if(!(opts&&opts.noScroll) && tl.getBoundingClientRect().top < 0) tl.scrollIntoView({block:"start"});
  if(key==="history") ensureHistory();   // past seasons: localStorage first, fetch only what's missing
  writeHash();
}
wireTabs(document.getElementById("mainTabs"), k=>{ PO_SUB = null; PO_SCROLL = false; selectTab(k); });
wireTabs(document.getElementById("moreTabs"), k=>{ PO_SUB = null; PO_SCROLL = false; selectTab(k); });
{ const h0 = readHash(); applyHash(h0); selectTab(h0.tab, {noScroll:true}); }
addEventListener("hashchange", ()=>{
  const h = readHash();
  applyHash(h);
  if(DATA){ paintScores(); paintLeaders(); paintTeams(); }
  paintHistory();
  selectTab(h.tab, {noScroll:true});
  scrollToPlayoffSub();
  if(h.tab==="teams" && h.teamId!=null){ const p = document.getElementById("pane-teams"); if(p.getBoundingClientRect().top < 0) p.scrollIntoView({block:"start"}); }
});
document.getElementById("refreshBtn").addEventListener("click", load);

// optional light auto-refresh so an open tab stays current on game days (re-pulls; does not push)
let AUTO_TIMER = setInterval(()=>{ if(document.getElementById("autoRefresh").checked && !document.hidden) load(); }, AUTO_REFRESH_MS);
document.getElementById("autoRefresh").addEventListener("change", e=>{
  if(!e.target.checked && AUTO_TIMER){ clearInterval(AUTO_TIMER); AUTO_TIMER=null; }
  else if(e.target.checked && !AUTO_TIMER){ AUTO_TIMER=setInterval(()=>{ if(document.getElementById("autoRefresh").checked && !document.hidden) load(); }, AUTO_REFRESH_MS); }
});

load();
</script>
