<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem("bs-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<title>Royal Crushers League Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/family.css?v=1.0.3">
<style>
  :root{--accent:#7A4FB5;--accent-text-dark:#A585D6;--accent-text-light:#5E3796;--brand-gold:#D4AF37}
  /* Royal Crushers Hub on the Box Score family (assets/family.css). Flat fills only: no glow, no drop shadows. */
  b,strong{font-weight:600}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px 48px}

  /* brand band: flat royal purple + gold rule (crest deferred by owner; text wordmark only) */
  header.banner{margin:16px 0 0}
  .banner-inner{background:#3B2466;border-bottom:3px solid var(--brand-gold);padding:16px;display:flex;align-items:center;gap:16px}
  .brand{min-width:0}
  .brand-title{font:600 28px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--brand-gold)}
  @media (min-width:720px){ .brand-title{font-size:40px} }   /* wordmark-only exception, integer px */
  .brand-sub{font:600 12px/1.2 var(--font-display);letter-spacing:.2em;text-transform:uppercase;color:#fff;opacity:.9;margin-top:6px}

  /* app bar under the band: context, freshness, Refresh, Auto, theme */
  .bs-appbar{flex-wrap:wrap;row-gap:4px;padding:6px var(--sp-4);margin:0 0 var(--sp-2)}
  .bs-appbar .ctx{font-size:var(--fs-meta);color:var(--text-2);white-space:nowrap}
  .bs-appbar label{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-meta);color:var(--text-2);min-height:36px;cursor:pointer}
  #mainTabs{margin:0 0 var(--sp-4)}

  .loading{color:var(--text-2);padding:40px 0;text-align:center}
  .note{color:var(--text-2);font-size:var(--fs-meta);text-align:center;padding:16px 0}
  .err{color:var(--down);border:1px solid var(--down);border-radius:var(--r-panel);padding:12px;margin:12px 0;font-size:13px;line-height:1.6}
  .cap{color:var(--text-2);font-size:var(--fs-meta);margin:0 0 var(--sp-2)}
  .cap:last-child{margin-bottom:0}
  .bs-panel-head{flex-wrap:wrap}
  .bs-panel-body .wtabs{margin:0 0 var(--sp-1)}
  .bs-panel-body .bs-table-wrap{margin:0 calc(-1 * var(--sp-3))}
  .bs-panel-body .bs-table-wrap + .cap,.bs-panel-body .cap + .bs-table-wrap{margin-top:var(--sp-2)}
  .bs-seg{margin:0 0 var(--sp-3)}
  .sec-label{margin:var(--sp-4) 0 var(--sp-2)}
  .sec-label:first-child{margin-top:0}

  /* table cells */
  .tm-cell{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .bs-table td.wrap-ok{white-space:normal;min-width:120px;line-height:1.35;padding-top:6px;padding-bottom:6px}
  .bs-table td.lose-side{color:var(--text-2)}
  /* playoffs: a full-width sentence row under a table row (wraps inside 390px instead of scrolling) */
  .bs-table tr.po-main td{border-bottom:0}
  .bs-table tr.po-sub td{white-space:normal;line-height:1.35;height:auto;padding:0 var(--sp-2) 8px}
  .po-text{margin:0 0 var(--sp-2);line-height:1.45}
  .swipe-cue{display:none}
  @media (max-width:519px){
    #mainTabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:visible}
    #mainTabs [role="tab"]{min-width:0;white-space:normal;text-align:center;justify-content:center;padding:8px 2px;min-height:44px;font-size:11px;letter-spacing:.02em;line-height:1.2}
    .swipe-cue{display:block;flex-basis:100%;text-align:right}
  }
  .live{color:var(--down)}
  .snapshot-games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
  .snapshot-game{border:1px solid var(--border);padding:10px;min-width:0;font-size:var(--fs-meta)}
  .snapshot-game strong{display:block;margin-top:4px;overflow-wrap:anywhere}
  .snapshot-game .sub-line{margin-top:4px}
  .predictor-week{border:1px solid var(--border);border-radius:var(--r-panel);margin-top:8px}
  .predictor-week summary{padding:10px;cursor:pointer;font-weight:600}
  .predictor-game{padding:10px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .predictor-picks{display:flex;gap:6px;flex-wrap:wrap}
  .predictor-picks button[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2);color:var(--accent-text-dark)}
  [data-theme="light"] .predictor-picks button[aria-pressed="true"]{color:var(--accent-text-light)}
  .predictor-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .predictor-picks .bs-btn{min-height:44px}
  @media(max-width:519px){.snapshot-games{grid-template-columns:1fr}}
  .why{color:var(--text-2);font-size:var(--fs-micro)}
  /* standings: stick1 pins Seed; this pins Team right after it (fixed-width Seed column) */
  .st-table th:first-child,.st-table td:first-child{width:40px;min-width:40px;max-width:40px}
  .st-table th:nth-child(2),.st-table td:nth-child(2){position:sticky;left:40px;z-index:2;background:var(--surface)}
  .st-table thead th:nth-child(2){z-index:3}
  .st-table tbody tr:hover td:nth-child(2){background:var(--surface-2)}
  /* member name: short on phones, "Name (Team)" from 720px */
  .nm-full{display:none}
  @media (min-width:720px){ .nm-short{display:none} .nm-full{display:inline} }
  /* teams: picker row; history: a dim second line under a team name */
  .tm-pick{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
  .tm-pick .bs-select{max-width:100%}
  .sub-line{display:block;font-size:var(--fs-micro);color:var(--text-2)}

  /* member avatars (round logo, initial fallback) */
  .mav{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:50%;
       overflow:hidden;background:var(--surface-2);border:1px solid var(--border);vertical-align:middle}
  .mav img{width:100%;height:100%;object-fit:cover;display:block}
  .mav-fb{width:100%;height:100%;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text-2)}
  /* player image: headshot -> team logo -> position-color initial (the one sanctioned small fill) */
  .pav{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:50%;
       overflow:hidden;background:var(--surface-2);border:1px solid var(--border);vertical-align:middle}
  .pav img{width:100%;height:100%;object-fit:cover;display:block}
  .pav-fb{width:100%;height:100%;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--surface)}

  .foot{color:var(--text-2);font-size:var(--fs-micro);margin-top:24px;text-align:center}
  .hide{display:none}
  @media(max-width:600px){
    #po-teams .race-table,#po-teams .race-table tbody{display:block;width:100%}
    #po-teams .race-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    #po-teams .race-table tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 12px 12px;padding:12px;border:1px solid var(--border);border-radius:8px;gap:10px}
    #po-teams .race-table td{display:block;min-width:0;height:auto;padding:0;border:0;text-align:left;font-size:15px;white-space:normal;overflow-wrap:anywhere}
    #po-teams .race-table td::before{content:attr(data-label);display:block;font-size:12px;color:var(--text-2);margin-bottom:3px}
    #po-teams .race-table .race-name{grid-column:1/-1;order:0;font-size:17px;font-weight:600}
    #po-teams .race-table .race-name::before{display:none}
    #po-teams .race-table .race-metric{order:1}
    #po-teams .race-table .race-status{grid-column:1/-1;order:2}
    #po-teams .race-table .race-status br{display:none}
    #po-teams .race-table .race-status .bs-dim::before{content:" · "}
    #po-teams .race-table .race-path{grid-column:1/-1;order:3}
    #po-teams .race-table .race-path summary{font-size:15px;line-height:1.5;min-height:44px;align-content:center}
    #po-teams .race-table .race-path .cap{font-size:16px;line-height:1.6;color:var(--text);margin:8px 0}
    #po-teams .race-table .race-path ul{padding-left:20px}
    #po-teams .race-table .race-path li{margin:8px 0}
    #po-teams > .bs-panel-body > .cap{font-size:14px;line-height:1.5}
  }
</style>

<body>
<div class="wrap">
  <header class="banner">
    <div class="banner-inner">
      <!-- CREST SLOT: deferred by the owner (2026-10-13). Wiring is a separate, owner-gated step; text wordmark only until then. -->
      <div class="brand">
        <div class="brand-title" id="lgTitle">ROYAL CRUSHERS</div>
        <div class="brand-sub">League Hub</div>
      </div>
    </div>
  </header>

  <div class="bs-appbar">
    <span class="ctx" id="sub">Loading…</span>
    <span class="bs-fresh" id="status" role="status"></span>
    <button type="button" class="bs-btn" id="refreshBtn">Refresh</button>
    <label><input type="checkbox" id="autoRefresh" checked> Auto</label>
    <button type="button" class="bs-btn" id="themeBtn">Theme: System</button>
  </div>

  <div class="bs-tabs" role="tablist" aria-label="Sections" id="mainTabs">
    <button type="button" role="tab" id="tab-scores" data-key="scores" aria-controls="pane-scores" aria-selected="true">Scores</button>
    <button type="button" role="tab" id="tab-standings" data-key="standings" aria-controls="pane-standings" aria-selected="false" tabindex="-1">Standings</button>
    <button type="button" role="tab" id="tab-playoffs" data-key="playoffs" aria-controls="pane-playoffs" aria-selected="false" tabindex="-1">Playoffs</button>
    <button type="button" role="tab" id="tab-predictor" data-key="predictor" aria-controls="pane-predictor" aria-selected="false" tabindex="-1">Season Predictor</button>
    <button type="button" role="tab" id="tab-more" data-key="more" aria-controls="pane-more" aria-selected="false" tabindex="-1">More</button>
  </div>

  <div id="errbox"></div>
  <div id="pane-scores" role="tabpanel" aria-labelledby="tab-scores"><div class="loading">Loading…</div></div>
  <div id="pane-standings" role="tabpanel" aria-labelledby="tab-standings" class="hide"><div class="loading">Loading…</div></div>
  <div id="pane-predictor" role="tabpanel" aria-labelledby="tab-predictor" class="hide"><div class="loading">Loading…</div></div>
  <div id="pane-playoffs" role="tabpanel" aria-labelledby="tab-playoffs" class="hide"><div class="loading">Loading…</div></div>
  <div id="pane-more" role="tabpanel" aria-labelledby="tab-more" class="hide">
    <div class="bs-tabs" role="tablist" aria-label="More sections" id="moreTabs">
      <button type="button" role="tab" id="tab-teams" data-key="teams" aria-controls="pane-teams" aria-selected="true">Teams</button>
      <button type="button" role="tab" id="tab-leaders" data-key="leaders" aria-controls="pane-leaders" aria-selected="false" tabindex="-1">Leaders</button>
      <button type="button" role="tab" id="tab-history" data-key="history" aria-controls="pane-history" aria-selected="false" tabindex="-1">History</button>
    </div>
    <div id="pane-teams" role="tabpanel" aria-labelledby="tab-teams"><div class="loading">Loading…</div></div>
    <div id="pane-leaders" role="tabpanel" aria-labelledby="tab-leaders" class="hide"><div class="loading">Loading…</div></div>
    <div id="pane-history" role="tabpanel" aria-labelledby="tab-history" class="hide"><div class="loading">Loading…</div></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="assets/standings-scenarios.js"></script>
<script>
/* =============================================================================
   League Hub — standalone, shareable, league-FACING. No personal/targeting data.
   Royal Crushers = ESPN via the serverless proxy (cookie stays server-side).
   Provider abstraction: ESPN now, Sleeper (public API, no secret) can drop in later.
   ============================================================================= */

// ---- CONFIG ----
const LEAGUE = {
  provider: "espn",              // "espn" (via proxy) | "sleeper" (direct public API, later)
  id: "963488",                  // Royal Crushers
  season: "2026",
  name: "Royal Crushers",
  // ESPN proxy base: same-origin on the Vercel deploy; absolute fallback for local/other hosts.
  espnProxy: (location.hostname.endsWith("vercel.app") || location.hostname==="localhost")
    ? "/api/espn"
    : "https://fantasy-dashboard-orpin.vercel.app/api/espn",  // fallback to the existing proxy
  nflStatusProxy: (location.hostname.endsWith("vercel.app") || location.hostname==="localhost")
    ? "/api/nfl-status" : "https://royalcrushersleaguehub.vercel.app/api/nfl-status",
};

// Real member names keyed by ESPN teamId (id-keyed = immune to team-name edits).
// Reconciled against the live 963488 team list: id 17 "Mr. Beer's Boys" = Zach, id 13 "5" = Evan.
const MEMBER = {
  1:"Seth", 2:"Riley", 5:"Nick", 6:"Henry", 7:"Bobby", 8:"Thor",
  12:"Ben", 13:"Evan", 15:"Charlie", 16:"Isaac", 17:"Zach", 18:"Chet",
};
// member logo files copied into assets/logos/ (lowercase firstname + "logo"; Evan is .jpg, rest .png).
const MEMBER_LOGO = {
  "Ben":"benlogo.png","Bobby":"bobbylogo.png","Charlie":"charlielogo.png","Chet":"chetlogo.png",
  "Evan":"Evanlogo.jpg","Henry":"henrylogo.png","Isaac":"isaaclogo.png","Nick":"nicklogo.png",
  "Riley":"rileylogo.png","Seth":"sethlogo.png","Thor":"thorlogo.png","Zach":"zachlogo.png",
};
// display: "Name (Team Name)" when mapped, else the ESPN team name (never blank).
function memberName(id, teamName){ const n = MEMBER[id]; return n ? `${n} (${teamName})` : teamName; }
function memberShort(id, teamName){ return MEMBER[id] || teamName; }
function logoFor(id){ const n = MEMBER[id]; const f = n && MEMBER_LOGO[n]; return f ? `assets/logos/${f}` : null; }
// small round avatar: member logo if present, else initials circle. `label` = name shown for initials fallback.
function avatarHtml(id, label, size){
  const url = logoFor(id); const px = size||24;
  const initial = esc((String(label||"?").trim()[0]||"?").toUpperCase());
  if(url) return `<span class="mav" style="width:${px}px;height:${px}px"><img src="${url}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="mav-fb" style="display:none">${initial}</span></span>`;
  return `<span class="mav" style="width:${px}px;height:${px}px"><span class="mav-fb" style="display:flex">${initial}</span></span>`;
}

// player image: ESPN headshot (by player id) -> NFL team logo (by abbrev) -> position-colored initial.
// Chained onerror so a missing headshot falls back to the team logo, then to a clean initial (never a broken img).
const POS_COLOR = {QB:"var(--pos-qb)",RB:"var(--pos-rb)",WR:"var(--pos-wr)",TE:"var(--pos-te)",DEF:"var(--pos-def)",K:"var(--pos-k)"};
function playerImgHtml(pid, team, pos, size){
  const px = size||18;
  const abbr = (team||"").toLowerCase();
  // D/ST "players" have negative ids and no headshot (a 404 every time): go straight to the team logo
  const head = (pid && !String(pid).startsWith("-")) ? `https://a.espncdn.com/i/headshots/nfl/players/full/${encodeURIComponent(pid)}.png` : "";
  const logo = abbr ? `https://a.espncdn.com/i/teamlogos/nfl/500/${encodeURIComponent(abbr)}.png` : "";
  const initial = esc((String(pos||"?").trim()[0]||"?").toUpperCase());
  const color = POS_COLOR[pos] || "var(--pos-k)";
  const fb = `<span class="pav-fb" aria-hidden="true" style="display:none;background:${color}">${initial}</span>`;
  // build the onerror chain: headshot -> team logo -> initial
  if(head){
    const onErr = logo
      ? `this.onerror=function(){this.style.display='none';this.parentNode.querySelector('.pav-fb').style.display='flex'};this.src='${logo}'`
      : `this.style.display='none';this.parentNode.querySelector('.pav-fb').style.display='flex'`;
    return `<span class="pav" style="width:${px}px;height:${px}px"><img src="${head}" alt="" loading="lazy" onerror="${onErr}">${fb}</span>`;
  }
  if(logo){
    return `<span class="pav" style="width:${px}px;height:${px}px"><img src="${logo}" alt="" loading="lazy" onerror="this.style.display='none';this.parentNode.querySelector('.pav-fb').style.display='flex'">${fb}</span>`;
  }
  return `<span class="pav" style="width:${px}px;height:${px}px"><span class="pav-fb" aria-hidden="true" style="display:flex;background:${color}">${initial}</span></span>`;
}

// auto-refresh: light poll so an open tab stays current on game days (does NOT push; re-pulls on interval)
const AUTO_REFRESH_MS = 150000; // 2.5 min

// ESPN maps (same as the dashboard's proven normalization)
const SLOT = {0:"QB",1:"TQB",2:"RB",3:"RB/WR",4:"WR",5:"WR/TE",6:"TE",7:"OP",8:"DT",9:"DE",
  10:"LB",11:"DL",12:"CB",13:"S",14:"DB",15:"DP",16:"D/ST",17:"K",18:"P",19:"HC",20:"BN",21:"IR",23:"FLEX",24:"ER"};
const POS = {1:"QB",2:"RB",3:"WR",4:"TE",5:"K",16:"DEF"};
const PRO = {0:"FA",1:"ATL",2:"BUF",3:"CHI",4:"CIN",5:"CLE",6:"DAL",7:"DEN",8:"DET",9:"GB",10:"TEN",
  11:"IND",12:"KC",13:"LV",14:"LAR",15:"MIA",16:"MIN",17:"NE",18:"NO",19:"NYG",20:"NYJ",21:"PHI",
  22:"ARI",23:"PIT",24:"LAC",25:"SF",26:"SEA",27:"TB",28:"WSH",29:"CAR",30:"JAX",33:"BAL",34:"HOU"};
const STARTABLE_POS = ["QB","RB","WR","TE","K","DEF"];

let DATA = null;
let ENGINE = null;   // playoff engine output for DATA (see playoffEngine; computed after the first paint)
let ACTIVE = "scores";

async function jraw(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pts(n){ return (Math.round((n||0)*10)/10).toFixed(1); }

/* ---------- provider: ESPN (via proxy) ---------- */
const providers = {};
providers.espn = (function(){
  function teamName(t){ return (t.name || `${t.location||""} ${t.nickname||""}`.trim() || ("Team "+t.id)); }
  const recOf = t => { const o=(t.record&&t.record.overall)||{}; return {w:o.wins||0,l:o.losses||0,t:o.ties||0}; };
  const pf = t => (t.record&&t.record.overall&&t.record.overall.pointsFor)||0;
  const pa = t => (t.record&&t.record.overall&&t.record.overall.pointsAgainst)||0;

  // actual points a player scored in a specific week (source 0 = actual, split 1 = weekly). null if none.
  function weekActual(p, wk){
    if(!p.stats) return null;
    const s = p.stats.find(x=>x.statSourceId===0 && x.statSplitTypeId===1 && x.scoringPeriodId===wk);
    return s ? Math.round((s.appliedTotal||0)*10)/10 : null;
  }
  function playerOf(entry, curWeek){
    const p = (entry.playerPoolEntry && entry.playerPoolEntry.player) || entry.player || {};
    // appliedStatTotal is the LATEST scoring period's points, NOT a season total (the default mRoster
    // only carries one weekly line). It used to feed "season PPG" = latest week (bug fixed 2026-10-13).
    const applied = (entry.playerPoolEntry && entry.playerPoolEntry.appliedStatTotal) || 0;
    const stats = p.stats||[];
    // ESPN's own season line: source 0 = actual, split 0 = season. appliedTotal = season pts,
    // stats["210"] = games played, appliedAverage = season PPG (= appliedTotal / games).
    const seas = stats.find(s=>s.statSourceId===0 && s.statSplitTypeId===0 && s.seasonId===Number(LEAGUE.season));
    // ESPN's projection for the current week (source 1 = projected, split 1 = weekly). Labeled as ESPN's.
    let projWk = 0;
    stats.forEach(s=>{ if(s.statSourceId===1 && s.statSplitTypeId===1 && s.scoringPeriodId===curWeek) projWk += (s.appliedTotal||0); });
    // per-week actual points map for every week this player has a stat line
    const byWeek = {};
    stats.forEach(s=>{ if(s.statSourceId===0 && s.statSplitTypeId===1 && s.scoringPeriodId!=null) byWeek[s.scoringPeriodId] = Math.round((s.appliedTotal||0)*10)/10; });
    return { id:String(p.id||entry.playerId||""), name:p.fullName||("id "+(entry.playerId||"?")),
             pos: POS[p.defaultPositionId]||"?", team: PRO[p.proTeamId]||"", proTeamId:p.proTeamId,
             eligible: (p.eligibleSlots||[]).slice(),          // raw slot ids the player can fill
             slot: SLOT[entry.lineupSlotId] || String(entry.lineupSlotId),
             slotId: entry.lineupSlotId,
             starter: SLOT[entry.lineupSlotId]!=="BN" && SLOT[entry.lineupSlotId]!=="IR",
             onIR: SLOT[entry.lineupSlotId]==="IR",
             latestPts: applied,                               // latest scoring period only (NOT season)
             seasonPts: seas ? (seas.appliedTotal||0) : 0,     // ESPN season total
             gp: seas && seas.stats ? (seas.stats["210"]||0) : 0, // ESPN games played
             seasonPPG: seas ? (seas.appliedAverage||0) : 0,   // ESPN season points per game
             projWk: Math.round(projWk*10)/10,                 // ESPN projection, current week
             byWeek };                                         // {week: actualPts}
  }
  function buildTeam(t, curWeek){
    const entries = ((t.roster||{}).entries)||[];
    const players = entries.map(e=>playerOf(e, curWeek));
    const tn = teamName(t);
    const starters = players.filter(p=>p.starter);           // starter = lineupSlotId not BN(20) / IR(21)
    const sim = t.currentSimulationResults;
    return {
      id: t.id, name: tn, disp: memberName(t.id, tn), short: memberShort(t.id, tn),
      record: recOf(t), pf: pf(t), pa: pa(t),
      moves: (t.transactionCounter&&t.transactionCounter.acquisitions)||0,
      players,
      starters,
      bench: players.filter(p=>!p.starter && !p.onIR),
      // ESPN's projected starters total for the current week (labeled as ESPN's wherever shown)
      projTeam: Math.round(starters.reduce((a,p)=>a+(p.projWk||0),0)*10)/10,
      // ESPN's own playoff odds (fraction 0..1 as ESPN sends it) and ESPN's current seed
      espnPlayoffPct: (sim && sim.playoffPct!=null) ? sim.playoffPct : null,
      espnSeedRank: t.playoffSeed!=null ? t.playoffSeed : null,
      // Identity: the client keys members by ESPN team id (MEMBER map), never by ESPN owner ids.
      // The proxy hashes team.owners / primaryOwner to "m" + 10 hex (api/espn.js sanitize), and the
      // same ESPN owner id always hashes the same, so History (FEAT-004) uses that hash as the cross-season
      // owner key (team ids get reused across seasons). data.members carries only hashed ids.
      owners: (t.owners||[]).slice(),
    };
  }

  async function load(){
    const url = `${LEAGUE.espnProxy}?league=${encodeURIComponent(LEAGUE.id)}&season=${encodeURIComponent(LEAGUE.season)}`
      + `&view=mTeam&view=mRoster&view=mMatchup&view=mSettings&view=mStandings&view=mSchedule`;
    const d = await jraw(url);
    if(d && d.error){
      if(d.error==="espn_auth_expired") return { authExpired:true };
      if(d.error==="server_not_configured") return { notConfigured:true };
      throw new Error(d.message || d.error);
    }
    const settings = d.settings||{};
    const sched = settings.scheduleSettings || {};
    const regWeeks = sched.matchupPeriodCount || 14;
    const playoffTeams = sched.playoffTeamCount || 6;
    // playoff rounds = matchup periods after the regular season (3 = Wk15-17); byes = 2^rounds - playoff teams
    const playoffRounds = Object.keys(sched.matchupPeriods||{}).filter(k=>parseInt(k,10) > regWeeks).length;
    const byes = playoffRounds ? Math.max(0, Math.pow(2, playoffRounds) - playoffTeams) : 0;
    const seedingRule = sched.playoffSeedingRule || null;   // e.g. "TOTAL_POINTS_SCORED" (the sim + clinch math assume it)
    const week = (d.status && d.status.currentMatchupPeriod) || d.scoringPeriodId || 1;
    let nflStatus=null;
    try{
      const status=await jraw(`${LEAGUE.nflStatusProxy}?season=${encodeURIComponent(LEAGUE.season)}&week=${week}`);
      if(status.season===Number(LEAGUE.season)&&status.week===week &&
         (d.scoringPeriodId==null||Number(d.scoringPeriodId)===week)) nflStatus=status;
    }catch(_){ /* Official scores still work if NFL status is unavailable. */ }
    const teams = (d.teams||[]).map(t=>buildTeam(t, week));
    const byId = {}; teams.forEach(t=>byId[t.id]=t);

    // lineup slot config (slotId -> count) for the exact optimal-lineup solve. Only slots with count>0
    // that aren't bench/IR are startable slots.
    const slotCounts = (settings.rosterSettings && settings.rosterSettings.lineupSlotCounts) || {};
    const startSlots = []; // list of startable slotIds, one entry per slot (e.g. RB appears twice if 2 RB)
    Object.keys(slotCounts).forEach(sid=>{
      const id = Number(sid), n = slotCounts[sid]||0, lbl = SLOT[id];
      if(n>0 && lbl!=="BN" && lbl!=="IR") for(let i=0;i<n;i++) startSlots.push(id);
    });

    // Live-score fix: ESPN leaves matchup totalPoints=0 for the current week until it FINALIZES (Tue after MNF),
    // even though games have been played. For the current/in-progress week, compute each team's live score by
    // summing its STARTERS' applied points from rosterForMatchupPeriod (excludes bench=20/IR=21). Prefer
    // totalPoints when >0 so it auto-heals once ESPN finalizes.
    function liveSideScore(side){
      const tp = side.totalPoints || 0;
      if(tp > 0) return { pts: tp, computed:false };            // finalized/populated -> trust it
      const rost = side.rosterForMatchupPeriod || side.rosterForCurrentScoringPeriod;
      const entries = (rost && rost.entries) || [];
      if(!entries.length) return { pts: 0, computed:false };
      let sum = 0;
      for(const e of entries){
        if(e.lineupSlotId===20 || e.lineupSlotId===21) continue;  // exclude bench / IR
        sum += (e.playerPoolEntry && e.playerPoolEntry.appliedStatTotal) || 0;
      }
      return { pts: Math.round(sum*10)/10, computed: sum>0 };     // computed live total from starters
    }
    // Snapshot standings keep ESPN's full precision, including negative/zero final scores.
    // Existing score cards retain their established display behavior.
    function snapshotSideScore(side, final){
      const roster = side.rosterForMatchupPeriod || side.rosterForCurrentScoringPeriod;
      const entries = roster && roster.entries;
      const total = side.totalPoints;
      if(Number.isFinite(total) && (final || total !== 0)) return total;
      if(entries && entries.length) return entries.reduce((sum,e)=>{
        if(e.lineupSlotId===20 || e.lineupSlotId===21) return sum;
        const value = e.playerPoolEntry && e.playerPoolEntry.appliedStatTotal;
        return sum + (Number.isFinite(value) ? value : 0);
      },0);
      return Number.isFinite(total) ? total : null;
    }
    // games from schedule; winner from ESPN when set; scores prefer totalPoints, else computed-from-starters.
    const games = (d.schedule||[]).filter(g=>g.home&&g.away&&g.home.teamId!=null&&g.away.teamId!=null).map(g=>{
      const h = liveSideScore(g.home), a = liveSideScore(g.away);
      const finalized = (g.winner==="HOME" || g.winner==="AWAY" || g.winner==="TIE") && (g.home.totalPoints>0 || g.away.totalPoints>0);
      const snapshotFinal = ["HOME","AWAY","TIE"].includes(g.winner);
      function sideCompletion(side){
        if(g.matchupPeriodId!==week) return null;
        const roster=side.rosterForMatchupPeriod||side.rosterForCurrentScoringPeriod;
        const current=(d.teams||[]).find(t=>t.id===side.teamId)?.roster?.entries;
        const lineup=HubScenarios.starterLineup(roster?.entries,current,startSlots);
        return {...HubScenarios.completion(lineup.starters,nflStatus,lineup.complete),source:lineup.source};
      }
      const homeCompletion=sideCompletion(g.home),awayCompletion=sideCompletion(g.away);
      const playersFinished=!!(homeCompletion?.done&&awayCompletion?.done);
      return {
        period: g.matchupPeriodId,
        homeId: g.home.teamId, awayId: g.away.teamId,
        homePts: h.pts, awayPts: a.pts,
        winner: g.winner,  // "HOME" | "AWAY" | "UNDECIDED"
        // live = scores exist (played) but ESPN hasn't finalized totalPoints yet (computed from starters)
        live: (h.computed || a.computed) && !finalized,
        finalized,
        snapshotFinal,
        playersFinished,homeCompletion,awayCompletion,
        snapshotHomePts: snapshotSideScore(g.home, snapshotFinal || g.matchupPeriodId < week),
        snapshotAwayPts: snapshotSideScore(g.away, snapshotFinal || g.matchupPeriodId < week),
      };
    });

    return {
      provider:"espn", name: settings.name || LEAGUE.name, size: settings.size || teams.length,
      week, regWeeks, playoffStart: regWeeks+1, playoffTeams, playoffRounds, byes, seedingRule,
      startSlots,nflStatusAvailable:!!nflStatus,
      teams, byId, games,
    };
  }

  // One week's rosters AS OF that scoring period (scoringPeriodId=N), so a player is credited to the team that
  // had him THAT week, plus each player's actual points that week. The default mRoster only carries the latest
  // week's lines, which is why the old top-scorers table was empty for earlier weeks.
  async function loadWeekRoster(wk){
    const url = `${LEAGUE.espnProxy}?league=${encodeURIComponent(LEAGUE.id)}&season=${encodeURIComponent(LEAGUE.season)}`
      + `&view=mRoster&scoringPeriodId=${encodeURIComponent(wk)}`;
    const d = await jraw(url);
    if(d && d.error) throw new Error(d.message || d.error);
    const rows = [];
    (d.teams||[]).forEach(t=>{
      (((t.roster||{}).entries)||[]).forEach(e=>{
        const p = (e.playerPoolEntry && e.playerPoolEntry.player) || e.player || {};
        const wp = weekActual(p, wk);
        if(wp==null) return;
        rows.push({ teamId:t.id, id:String(p.id||e.playerId||""), name:p.fullName||("id "+(e.playerId||"?")),
                    pos: POS[p.defaultPositionId]||"?", team: PRO[p.proTeamId]||"", pts:wp });
      });
    });
    return rows;
  }
  // One past season's final standings (History). Owners stay the proxy's hashed ids ("m" + 10 hex), the
  // cross-season key. Throws when ESPN has no such season (the proxy answers 502 for ESPN's 404: every year before 2018).
  async function loadSeason(year){
    const url = `${LEAGUE.espnProxy}?league=${encodeURIComponent(LEAGUE.id)}&season=${encodeURIComponent(year)}`
      + `&view=mTeam&view=mSettings`;
    const d = await jraw(url);
    if(d && d.error) throw new Error(d.message || d.error);
    const settings = d.settings || {}, sched = settings.scheduleSettings || {};
    const teams = (d.teams||[]).map(t=>{ const r = recOf(t); return {
      id:t.id, name:teamName(t), owner: t.primaryOwner || (t.owners||[])[0] || null, owners:(t.owners||[]).slice(),
      rank: t.rankCalculatedFinal||0, seed: t.playoffSeed||0, w:r.w, l:r.l, t:r.t, pf: Math.round(pf(t)*100)/100 }; });
    if(!teams.some(t=>t.rank===1)) throw new Error("no final standings for " + year);
    return { year:Number(year), size: settings.size || teams.length, playoffTeams: sched.playoffTeamCount || 0, teams };
  }
  return { load, loadWeekRoster, loadSeason };
})();

/* ============================ INSIGHTS ============================ */

// completed games only (a game with a winner set, or a period before the current week)
function completedGames(D){ return D.games.filter(g=>(g.winner==="HOME"||g.winner==="AWAY") || g.period < D.week); }

// plain standings: W-L order, points-for tiebreaker (no "power" editorializing)
function standingsList(D){
  return D.teams.slice().sort((a,b)=> (b.record.w-a.record.w) || (b.pf-a.pf))
    .map((t,i)=>({ rank:i+1, id:t.id, disp:t.disp, pf:t.pf, rec:t.record }));
}

// which completed weeks have games (for the week tabs)
function completedWeeks(D){
  const set = new Set(completedGames(D).map(g=>g.period));
  return [...set].sort((a,b)=>a-b);
}

// games for a specific week, with margin + winner/loser resolved
function weekGames(D, wk){
  return D.games.filter(g=>g.period===wk).map(g=>{
    const homeWon = g.homePts>g.awayPts, tie = g.homePts===g.awayPts;
    return {
      period:wk, homeId:g.homeId, awayId:g.awayId, homePts:g.homePts, awayPts:g.awayPts,
      margin: Math.round(Math.abs(g.homePts-g.awayPts)*10)/10, tie,
      winId: tie?null:(homeWon?g.homeId:g.awayId), loseId: tie?null:(homeWon?g.awayId:g.homeId),
      winPts: Math.max(g.homePts,g.awayPts), losePts: Math.min(g.homePts,g.awayPts),
      live: !!g.live, finalized: !!g.finalized,
      playersFinished:!!g.playersFinished, snapshotFinal:!!g.snapshotFinal,
    };
  });
}

// margin- + league-context-aware superlatives for ONE week
function weekSuperlatives(D, wk){
  const games = weekGames(D, wk).filter(g=>(g.homePts||g.awayPts)>0);
  if(!games.length) return null;
  // per-team scores this week
  const scores = [];
  games.forEach(g=>{
    scores.push({ id:g.homeId, pts:g.homePts, won:g.homePts>g.awayPts, opp:g.awayPts, margin:g.margin });
    scores.push({ id:g.awayId, pts:g.awayPts, won:g.awayPts>g.homePts, opp:g.homePts, margin:g.margin });
  });
  const ptsList = scores.map(s=>s.pts).sort((a,b)=>a-b);
  const median = ptsList[Math.floor(ptsList.length/2)];
  const rankOf = p => scores.filter(s=>s.pts>p).length + 1; // 1 = highest that week
  const n = scores.length;

  const byPts = scores.slice().sort((a,b)=>b.pts-a.pts);
  const high = byPts[0], low = byPts[byPts.length-1];
  const blowout = games.slice().sort((a,b)=>b.margin-a.margin)[0];
  const nailbiter = games.slice().sort((a,b)=>a.margin-b.margin)[0];

  const others = n - 1;  // number of OTHER teams in the league this week (for "N of M other teams")

  // Mutually exclusive pools: UNLUCKY only from losers, LUCKY only from winners. A team plays once/week,
  // so a loser can never be lucky and a winner can never be unlucky. Ties are excluded from both.
  const losers  = scores.filter(s=>!s.won && s.pts!==s.opp);
  const winners = scores.filter(s=> s.won && s.pts!==s.opp);

  // UNLUCKY: the LOSER whose score would have beaten the most OTHER teams this week (i.e. lost despite a
  // league-leading-caliber score). wouldBeat = how many of the other teams' scores it topped.
  let unlucky=null;
  if(losers.length){
    unlucky = losers.map(s=>{
      const wouldBeat = scores.filter(o=>o.id!==s.id && o.pts < s.pts).length;
      const isTopScore = s.pts === high.pts;      // scored the most in the whole league but still lost
      return { id:s.id, pts:s.pts, wouldBeat, others, isTopScore };
    }).sort((a,b)=> b.wouldBeat-a.wouldBeat || b.pts-a.pts)[0];
  }
  // LUCKY: the WINNER whose score was topped by the most OTHER teams this week (won despite a low score).
  // wouldLose = how many other teams outscored them; outscored = how many they beat.
  let lucky=null;
  if(winners.length){
    lucky = winners.map(s=>{
      const wouldLose  = scores.filter(o=>o.id!==s.id && o.pts > s.pts).length;
      const outscored  = scores.filter(o=>o.id!==s.id && o.pts < s.pts).length;
      return { id:s.id, pts:s.pts, wouldLose, outscored, others };
    }).sort((a,b)=> b.wouldLose-a.wouldLose || a.pts-b.pts)[0];
  }
  return { high, low, blowout, nailbiter, unlucky, lucky, median };
}

// NOTE: "Points Left on the Bench" was REMOVED in v3. A truly-exact figure needs each week's
// HISTORICAL started lineup, but ESPN's mRoster only exposes the CURRENT roster (which churns via
// adds/drops/lineup changes), so a past week's optimal-vs-actual can't be computed exactly. Per the
// "exact or gone" rule, it's gone rather than shipping a misleading approximation.

// games played + season PPG come straight from ESPN's season line (see playerOf), not from byWeek
// (the default mRoster only carries the latest week, which made "season PPG" = latest week's points).
function playerGames(p){ return p.gp||0; }
function playerPPG(p){ return p.seasonPPG||0; }

// Season leaders: full rostered position lists by ESPN season points.
// The All view takes five from each position, then sorts that combined list by points.
function positionalLeaders(D){
  const byPos = {};  // pos -> [{id, pos, player, team, ownerId, owner, gp, total, ppg}]
  D.teams.forEach(t=>t.players.forEach(p=>{
    if(!STARTABLE_POS.includes(p.pos)) return;
    (byPos[p.pos]=byPos[p.pos]||[]).push({ id:p.id, pos:p.pos, player:p.name, team:p.team, ownerId:t.id, owner:t.short,
      gp:playerGames(p), total:p.seasonPts||0, ppg:playerPPG(p) });
  }));
  Object.keys(byPos).forEach(P=>{ byPos[P].sort((a,b)=> (b.total-a.total) || (b.ppg-a.ppg) || String(a.id).localeCompare(String(b.id))); });
  return { byPos };
}

// Top-3 scorers per position for ONE week, from that week's rosters (loadWeekRoster): rows already carry the
// week's points and the team that rostered the player that week.
function weekTopScorers(rows){
  const byPos = {};  // pos -> [{id, pos, player, team, ownerId, pts}]
  (rows||[]).forEach(r=>{
    if(!STARTABLE_POS.includes(r.pos)) return;
    (byPos[r.pos]=byPos[r.pos]||[]).push({ id:r.id, pos:r.pos, player:r.name, team:r.team, ownerId:r.teamId, pts:r.pts });
  });
  Object.keys(byPos).forEach(P=>{ byPos[P].sort((a,b)=>b.pts-a.pts); byPos[P]=byPos[P].slice(0,3); });
  return byPos;
}

const POS_LABEL = {QB:"QB",RB:"RB",WR:"WR",TE:"TE",DEF:"D/ST",K:"K"};
const POS_ORDER = ["QB","RB","WR","TE","K","DEF"];

// which week the Scores tab is showing (null = default: the latest week that has scores)
let VIEW_WEEK = null;
let LOAD_SEQ = 0;            // bumps on every successful load(); the live week's rosters refetch per load
const WEEK_TOP = {};         // wk -> {state:"loading"|"ok"|"err", rows, seq}: per-week roster fetches, cached

// latest regular-season week with ANY scores (live or final); on Tue/Wed that is last week, not the empty current one
function latestScoredWeek(D){
  let best = 0;
  D.games.forEach(g=>{ if(g.period<=D.regWeeks && g.period<=D.week && (g.homePts||g.awayPts)>0 && g.period>best) best = g.period; });
  return best || D.week;
}

// this week's roster fetch: past weeks are fetched once and kept; the current (live) week refetches on each load
function weekTopEntry(wk){
  const D = DATA, e = WEEK_TOP[wk];
  const prov = providers[LEAGUE.provider];
  if(!prov.loadWeekRoster) return null;
  const stale = !e || (e.state!=="loading" && e.seq!==LOAD_SEQ && (e.state==="err" || wk >= D.week));
  if(!stale) return e;
  const ne = WEEK_TOP[wk] = { state:"loading", rows: e ? e.rows : null, seq: LOAD_SEQ };
  prov.loadWeekRoster(wk)
    .then(rows=>{ ne.state = "ok"; ne.rows = rows; }, err=>{ ne.state = "err"; console.warn("Week "+wk+" rosters:", err); })
    .then(()=> fillWeekTop(wk));
  return ne;
}
function fillWeekTop(wk){
  const el = document.getElementById("scTop");
  if(el && el.dataset.wk===String(wk)) el.innerHTML = weekTopHtml(wk);
}
function weekTopHtml(wk){
  const D = DATA, e = WEEK_TOP[wk];
  const live = wk===D.week ? " (live)" : "";
  const head = `<h3 class="bs-micro sec-label">Week ${wk} top scorers${live}</h3>`;
  if(!e || !e.rows){
    return head + `<p class="cap">${e && e.state==="err" ? `Couldn't load Week ${wk}'s rosters. Try Refresh.` : `Loading Week ${wk} top scorers…`}</p>`;
  }
  const tops = weekTopScorers(e.rows);
  const order = ["QB","RB","WR","TE","DEF","K"].filter(p=>tops[p] && tops[p].length);
  if(!order.length) return head + `<p class="cap">No player scores for Week ${wk} yet.</p>`;
  const shortOf = id => D.byId[id]?.short || "—";
  return head
    + `<p class="cap">Top 3 per position among rostered players (started or benched), credited to the team that had them in Week ${wk}.</p>`
    + `<div class="bs-table-wrap"><table class="bs-table"><thead><tr><th scope="col">Pos</th><th class="num" scope="col">#</th><th scope="col">Player</th>`
    + `<th scope="col">Owner</th><th class="num" scope="col">Pts</th></tr></thead><tbody>`
    + order.map(P=> tops[P].map((x,i)=>`<tr><td><span class="pos-${P}">${POS_LABEL[P]}</span></td><td class="num">${i+1}</td>`
        + `<td><span class="tm-cell">${playerImgHtml(x.id,x.team,x.pos,20)}<span>${esc(x.player)}</span></span></td>`
        + `<td>${esc(shortOf(x.ownerId))}</td><td class="num">${pts(x.pts)}</td></tr>`).join("")).join("")
    + `</tbody></table></div>`;
}

/* ============================ SCORES ============================ */
function paintScores(){
  const D = DATA; const el = document.getElementById("pane-scores");
  if(!D){ el.innerHTML = `<div class="note">No data.</div>`; return; }
  const s = [];
  const shortOf = id => D.byId[id]?.short || "—";

  // week tabs for ALL regular-season weeks; default = the latest week that has scores
  const allWeeks = []; for(let w=1; w<=D.regWeeks; w++) allWeeks.push(w);
  if(VIEW_WEEK==null || !allWeeks.includes(VIEW_WEEK)) VIEW_WEEK = latestScoredWeek(D);
  const wk = VIEW_WEEK;
  const isCurrent = wk === D.week;
  const isFuture = wk > D.week;

  const weekTabs = weekTabsHtml("scWtabs", "scWk-", "scWeekPane", allWeeks, wk, D.week);

  const wgAll = weekGames(D, wk);
  const wgScored = wgAll.filter(g=>(g.homePts||g.awayPts)>0);
  const anyScores = wgScored.length>0;

  // results table: Away · score · Home · score · status. Winner in --text, loser in --text-2, margin as a micro-label.
  // Per-game status: LIVE (computed from starters, not yet finalized) vs FINAL (ESPN finalized totalPoints).
  function resultRow(g){
    const scored = (g.homePts||g.awayPts)>0;
    const homeWins = scored && !g.tie && g.homePts>g.awayPts;
    const awayWins = scored && !g.tie && g.awayPts>g.homePts;
    const cls = (won, lost) => won ? "" : (lost ? " lose-side" : "");
    const st = g.finalized||g.snapshotFinal ? `<span class="bs-micro">FINAL</span>`
             : g.playersFinished ? `<span class="bs-micro" title="Every starter's NFL game is finished. Subject to stat corrections.">FINAL · STARTERS DONE</span>`
             : g.live ? `<span class="bs-micro live">● LIVE</span>` : (scored ? "" : `<span class="bs-micro">—</span>`);
    const mov = scored ? (g.tie ? ` <span class="bs-micro">tie</span>` : ` <span class="bs-micro">+${pts(g.margin)}</span>`) : "";
    return `<tr>
      <td class="${cls(awayWins, homeWins).trim()}">${esc(shortOf(g.awayId))}</td>
      <td class="num${cls(awayWins, homeWins)}">${scored?pts(g.awayPts):"—"}</td>
      <td class="${cls(homeWins, awayWins).trim()}">${esc(shortOf(g.homeId))}</td>
      <td class="num${cls(homeWins, awayWins)}">${scored?pts(g.homePts):"—"}</td>
      <td>${st}${mov}</td></tr>`;
  }
  const resultsTable = rowsHtml => `<div class="bs-table-wrap"><table class="bs-table"><thead><tr><th scope="col">Away</th><th class="num" scope="col">Pts</th>
      <th scope="col">Home</th><th class="num" scope="col">Pts</th><th scope="col">Status</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`;

  let weekBody;
  if(isFuture || !anyScores){
    weekBody = `<p class="cap">${isFuture?`Week ${wk} schedule.`:`No scores yet for Week ${wk}.`}</p>` + resultsTable(wgAll.map(resultRow).join(""));
  } else {
    const anyLive = wgScored.some(g=>g.live&&!g.playersFinished&&!g.snapshotFinal);
    const liveNote = anyLive
      ? `<p class="cap"><span class="live">● LIVE</span> means the matchup is unfinished. Players yet to kick off show 0. A matchup is finished when every starter's NFL game ends, or ESPN declares it final; stat corrections remain possible.</p>`
      : wgScored.some(g=>g.playersFinished&&!g.snapshotFinal)?`<p class="cap">FINAL · STARTERS DONE means every starter's NFL game has finished. ESPN may finalize the fantasy result later; stat corrections remain possible.</p>`:"";
    weekBody = liveNote + resultsTable(wgScored.map(resultRow).join(""));
  }

  // per-week superlatives (margin- + context-aware) — compact table, only when there are real scores
  const sup = anyScores ? weekSuperlatives(D, wk) : null;
  let supHtml = "";
  if(sup){
    const row=(cls,k,v,d)=>`<tr><td><span class="bs-micro${cls?" "+cls:""}">${k}</span></td><td>${esc(v)}</td><td class="wrap-ok">${esc(d)}</td></tr>`;
    supHtml = `<h3 class="bs-micro sec-label">Week ${wk} superlatives${isCurrent?" (live)":""}</h3>`
      + `<div class="bs-table-wrap"><table class="bs-table"><thead><tr><th scope="col">Award</th><th scope="col">Team</th><th scope="col">Detail</th></tr></thead><tbody>`
      + row("bs-up","Highest scorer", shortOf(sup.high.id), `${pts(sup.high.pts)} pts`)
      + row("bs-down","Lowest scorer", shortOf(sup.low.id), `${pts(sup.low.pts)} pts`)
      + row("","Biggest blowout", shortOf(sup.blowout.winId), `beat ${shortOf(sup.blowout.loseId)} by ${pts(sup.blowout.margin)}`)
      + row("","Closest game", shortOf(sup.nailbiter.winId), `won by ${pts(sup.nailbiter.margin)} over ${shortOf(sup.nailbiter.loseId)}`)
      + (sup.unlucky ? row("bs-warn","Unlucky", shortOf(sup.unlucky.id),
          sup.unlucky.isTopScore
            ? `${pts(sup.unlucky.pts)} pts, most in the league, and lost`
            : `${pts(sup.unlucky.pts)} pts and lost; would've beaten ${sup.unlucky.wouldBeat} of ${sup.unlucky.others} other teams`) : "")
      + (sup.lucky ? row("bs-warn","Lucky", shortOf(sup.lucky.id),
          `won with ${pts(sup.lucky.pts)} pts; outscored only ${sup.lucky.outscored} of ${sup.lucky.others} other teams`) : "")
      + `</tbody></table></div>`;
  }

  // top 3 per position for the selected week, from that week's rosters (fetched on demand, cached per week)
  let topHtml = "";
  if(anyScores && weekTopEntry(wk)) topHtml = `<div id="scTop" data-wk="${wk}">${weekTopHtml(wk)}</div>`;

  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">Scores</h2><span class="bs-meta">Week ${wk}${isCurrent?" (this week)":""}</span></div><div class="bs-panel-body">${weekTabs}</div>`);
  // single week tabpanel: everything scoped to the selected week (results, superlatives, top scorers)
  s.push(`<div class="bs-panel-body" id="scWeekPane" role="tabpanel" aria-labelledby="scWk-${wk}" tabindex="0">${weekBody}${supHtml}${topHtml}</div></section>`);

  el.innerHTML = s.join("");

  // wire week tabs (repaint keeps keyboard focus on the newly selected week)
  const wt = document.getElementById("scWtabs");
  if(wt) wireTabs(wt, k=>{
    const hadFocus = wt.contains(document.activeElement);
    VIEW_WEEK = Number(k); paintScores(); writeHash();
    if(hadFocus) document.getElementById("scWk-"+k)?.focus();
  });
}

/* ============================ STANDINGS ============================ */
// Rebuild this week's snapshot from ESPN matchup history, rather than adding a win
// to official records that ESPN may already have updated. Never mutate DATA.
function scoreHeldStandings(D,allowNoScores=false){
  const unavailable = reason=>({rows:[],games:[],reason});
  if(D.provider!=="espn") return unavailable("This view requires ESPN matchup data.");
  if(D.week>D.regWeeks) return unavailable("Regular-season standings are complete. Playoff games do not change them.");
  if(D.seedingRule && D.seedingRule!=="TOTAL_POINTS_SCORED")
    return unavailable("The league's seeding rule needs verification before showing projected ranks.");
  const ids = new Set(D.teams.map(t=>t.id));
  const games = D.games.filter(g=>g.period>=1 && g.period<=D.week);
  const rows = new Map(D.teams.map(t=>[t.id,{id:t.id,w:0,l:0,t:0,pf:0,pa:0}]));
  const seen = new Set();
  for(const g of games){
    if(!ids.has(g.homeId)||!ids.has(g.awayId)||g.homeId===g.awayId)
      return unavailable("ESPN's matchup schedule is incomplete. Try Refresh.");
    for(const id of [g.homeId,g.awayId]){
      const key = `${g.period}:${id}`;
      if(seen.has(key)) return unavailable("ESPN returned duplicate matchup entries. Try Refresh.");
      seen.add(key);
    }
    if(!Number.isFinite(g.snapshotHomePts)||!Number.isFinite(g.snapshotAwayPts))
      return unavailable("ESPN has not supplied all matchup scores. Try Refresh.");
  }
  // Royal Crushers plays one H2H matchup per team per regular-season week.
  for(let w=1;w<=D.week;w++) for(const id of ids)
    if(!seen.has(`${w}:${id}`)) return unavailable("ESPN's weekly schedule is incomplete. Try Refresh.");
  const current = games.filter(g=>g.period===D.week);
  const started = current.some(g=>g.snapshotFinal || g.playersFinished || g.snapshotHomePts!==0 || g.snapshotAwayPts!==0);
  if(!started&&!allowNoScores) return {...unavailable("No scores yet for this week. Projected standings will appear once ESPN reports scoring."),games:current};
  for(const g of games){
    const h=rows.get(g.homeId),a=rows.get(g.awayId);
    h.pf+=g.snapshotHomePts; h.pa+=g.snapshotAwayPts;
    a.pf+=g.snapshotAwayPts; a.pa+=g.snapshotHomePts;
    const result = g.snapshotFinal ? g.winner :
      (Math.abs(g.snapshotHomePts-g.snapshotAwayPts)<1e-8 ? "TIE" : g.snapshotHomePts>g.snapshotAwayPts ? "HOME" : "AWAY");
    if(result==="HOME"){h.w++;a.l++;} else if(result==="AWAY"){a.w++;h.l++;} else {h.t++;a.t++;}
  }
  // Cross-check the historical baseline against official ESPN totals. A complete
  // schedule full of placeholder zeros must not masquerade as valid history.
  // Official records and PF may update separately, so accept before/after states
  // independently. The current result is removed exactly once for this check.
  const prior=new Map([...rows].map(([id,r])=>[id,{...r}]));
  for(const g of current){
    const h=prior.get(g.homeId),a=prior.get(g.awayId);
    h.pf-=g.snapshotHomePts;a.pf-=g.snapshotAwayPts;
    const result=g.snapshotFinal?g.winner:(Math.abs(g.snapshotHomePts-g.snapshotAwayPts)<1e-8?"TIE":g.snapshotHomePts>g.snapshotAwayPts?"HOME":"AWAY");
    if(result==="HOME"){h.w--;a.l--;}else if(result==="AWAY"){a.w--;h.l--;}else{h.t--;a.t--;}
  }
  for(const team of D.teams){
    const before=prior.get(team.id),after=rows.get(team.id),official=team.record;
    const recordMatches=r=>r.w===official.w && r.l===official.l && r.t===official.t;
    if((!recordMatches(before)&&!recordMatches(after)) ||
       (Math.abs(team.pf-before.pf)>0.011 && Math.abs(team.pf-after.pf)>0.011))
      return unavailable("ESPN's records and matchup history have not synchronized. Try Refresh; official standings remain below.");
  }
  // A tied game is half a win. PF is the verified league tiebreak; exact ties
  // share a rank (team id only stabilizes display order, never breaks the tie).
  const sorted=[...rows.values()].sort((a,b)=>(b.w+b.t/2-a.w-a.t/2)||(b.pf-a.pf)||(a.id-b.id));
  const official=new Map(standingsList(D).map(r=>[r.id,r.rank]));
  sorted.forEach((r,i)=>{
    const prev=sorted[i-1];
    r.rank=prev && r.w+r.t/2===prev.w+prev.t/2 && Math.abs(r.pf-prev.pf)<1e-8 ? prev.rank : i+1;
    r.move=official.get(r.id)-r.rank;
  });
  return {rows:sorted,games:current,reason:null,pending:current.filter(g=>!g.snapshotFinal&&!g.playersFinished).length};
}

function scoreHeldPanel(D){
  const snapshot=scoreHeldStandings(D);
  const label="If current scores hold";
  let html=`<section class="bs-panel" aria-labelledby="snapshot-title"><div class="bs-panel-head"><h2 class="bs-h2" id="snapshot-title">${label}</h2>`
    + `<span class="bs-meta">Week ${D.week} · ${snapshot.reason||snapshot.pending?"Projected / in progress":"All matchups finished"}</span><button type="button" class="bs-btn" data-jump-predictor>Open Season Predictor</button></div><div class="bs-panel-body">`;
  if(snapshot.reason) return html+`<p class="cap">${esc(snapshot.reason)}</p></div></section>`;
  html+=`<p class="cap">Current ESPN scores only. Players yet to play, including Monday night, have no future points added. Official standings are shown separately below.</p>`
    + `<p class="cap">${snapshot.pending ? `${snapshot.pending} of ${snapshot.games.length} matchups are not confirmed finished.` : "Every matchup is finished (ESPN final, or both teams' starters are done). The official records below may take time to update."} Equal scores count as a provisional tie. Scores remain subject to ESPN stat corrections.</p>`
    + (!D.nflStatusAvailable?`<p class="cap">NFL player status is unavailable; only ESPN-declared finals can be confirmed.</p>`:"")
    + `<div class="bs-table-wrap"><table class="bs-table bs-table--stick1 st-table" id="scoreHeldTable"><caption class="cap">Projected standings through Week ${D.week} · ESPN scores</caption><thead><tr><th scope="col" class="num">Rank</th><th scope="col">Team</th><th scope="col" class="num">W–L–T</th><th scope="col" class="num">PF</th><th scope="col" class="num">Move*</th></tr></thead><tbody>`;
  html+=snapshot.rows.map(r=>{
    const t=D.byId[r.id], move=r.move>0?`↑ ${r.move}`:r.move<0?`↓ ${-r.move}`:"—";
    return `<tr><td class="num${r.rank===D.playoffTeams?" bs-cut":""}">${r.rank}</td><td><span class="tm-cell">${avatarHtml(r.id,t.short,22)}<span class="nm-short">${esc(t.short)}</span><span class="nm-full">${esc(t.disp)}</span></span></td><td class="num">${r.w}–${r.l}–${r.t}</td><td class="num">${r.pf.toFixed(2)}</td><td class="num">${move}</td></tr>`;
  }).join("")+`</tbody></table></div><p class="cap">*Movement versus the official standings below. Rank uses wins plus half a win per tie, then total points for. Exact ties share a rank.</p><div class="snapshot-games">`;
  html+=snapshot.games.map(g=>{
    const home=D.byId[g.homeId],away=D.byId[g.awayId];
    const equal=Math.abs(g.snapshotHomePts-g.snapshotAwayPts)<1e-8;
    const closed=g.snapshotFinal||g.playersFinished;
    const sideText=(t,c)=>`${esc(t.short)}: ${c?.unknown?`${c.remaining} remaining; lineup/status incomplete`:c?c.remaining?`${c.remaining} starter${c.remaining===1?"":"s"} remaining`:"all starters done":"status unavailable"}`;
    return `<div class="snapshot-game"><span class="bs-micro${closed?"":" live"}">${g.snapshotFinal?"FINAL — ESPN":g.playersFinished?"FINAL — ALL STARTERS DONE":"IN PROGRESS — NOT FINAL"}</span><strong>${esc(home.short)} ${g.snapshotHomePts.toFixed(2)} · ${esc(away.short)} ${g.snapshotAwayPts.toFixed(2)}</strong>`
      + `<span class="sub-line">${closed?"Result included once; subject to stat corrections.":equal?"Tied if scores hold.":`${esc(g.snapshotHomePts>g.snapshotAwayPts?home.short:away.short)} wins if scores hold.`}</span>`
      + (!g.snapshotFinal?`<span class="sub-line">${sideText(home,g.homeCompletion)} · ${sideText(away,g.awayCompletion)}</span>`:"")+`</div>`;
  }).join("")+`</div></div></section>`;
  return html;
}

// Personal what-if picks: local to this browser/origin/league/season. No network writes.
let SEASON_PICKS={scope:null,picks:{},persistent:true,open:new Set()};
function seasonPicksScope(){return `hub-season-predictor:${LEAGUE.id}:${LEAGUE.season}:v1`;}
function loadSeasonPicks(D){
  const scope=seasonPicksScope();
  if(SEASON_PICKS.scope!==scope){
    const remaining=D.games.filter(g=>g.period>=D.week&&g.period<=D.regWeeks&&!HubScenarios.done(g));
    const firstWeek=remaining.length?Math.min(...remaining.map(g=>g.period)):D.week;
    SEASON_PICKS={scope,picks:{},persistent:true,open:new Set([firstWeek])};
    try{
      const stored=localStorage.getItem(scope);
      if(stored){const parsed=JSON.parse(stored);if(parsed?.version===1) SEASON_PICKS.picks=parsed.picks||{};}
    }catch(error){if(!(error instanceof SyntaxError)) SEASON_PICKS.persistent=false;}
  }
  SEASON_PICKS.picks=HubScenarios.cleanPicks(SEASON_PICKS.picks,D.games.filter(g=>g.period>=D.week&&g.period<=D.regWeeks));
}
function saveSeasonPicks(reset=false){
  try{
    if(reset) localStorage.removeItem(SEASON_PICKS.scope);
    else localStorage.setItem(SEASON_PICKS.scope,JSON.stringify({version:1,picks:SEASON_PICKS.picks}));
    SEASON_PICKS.persistent=true;
  }catch(_){SEASON_PICKS.persistent=false;}
}
function seasonPredictorPanel(D){
  loadSeasonPicks(D);
  const result=HubScenarios.scenario(D,scoreHeldStandings(D,true),SEASON_PICKS.picks);
  let html=`<section class="bs-panel" id="season-predictor" aria-labelledby="predictor-title"><div class="bs-panel-head"><h2 class="bs-h2" id="predictor-title">Season predictor</h2><span class="bs-meta">Your personal what-if sandbox</span></div><div class="bs-panel-body">`;
  if(result.reason) return html+`<p class="cap">${esc(result.reason)}</p></div></section>`;
  const complete=result.left===0;
  html+=`<p class="cap">Pick winners for every unfinished regular-season matchup, including this week. Finished games are locked. Your choices change only this scenario; they are never shared or official.</p>`
    + `<div class="predictor-toolbar"><button type="button" class="bs-btn" data-reset-picks>Reset my picks</button><span class="bs-meta" role="status" aria-live="polite">${result.picked} / ${result.total} picks made${result.left?` · ${result.left} remaining`:" · scenario complete"}</span></div>`
    + `<p class="cap">${SEASON_PICKS.persistent?"Picks save automatically in this browser on this device. Preview and live-site storage are separate.":"Browser storage is unavailable. Picks work for this visit, but will not survive a reload."}</p>`
    + `<p class="cap">*Seed tiebreaks use current points for (including this week's scores), held fixed. Future scoring and stat corrections can change tied teams' seeds. ${complete?"These are scenario final records and seeds.":"Records and ranks are partial until you choose every game; unpicked games add no win, loss, or tie."}</p>`
    + `<div class="bs-table-wrap"><table class="bs-table bs-table--stick1 st-table" id="seasonScenarioTable"><caption class="cap">${complete?"Scenario final records / playoff seeds":"Partial scenario — picks still needed"}</caption><thead><tr><th scope="col" class="num">${complete?"Seed*":"Rank*"}</th><th scope="col">Team</th><th scope="col" class="num">W–L–T</th><th scope="col" class="num">PF*</th><th scope="col">${complete?"Playoffs*":"State"}</th></tr></thead><tbody>`;
  html+=result.rows.map(r=>{
    const team=D.byId[r.id],tied=result.rows.filter(t=>t.rank===r.rank).length,lastSeed=r.rank+tied-1;
    let state="Picks incomplete";
    if(complete){
      state=r.rank>D.playoffTeams?"Outside playoffs":lastSeed>D.playoffTeams?"Tied at cutoff":
        D.byes&&r.rank<=D.byes?(lastSeed<=D.byes?"Playoffs + bye":"Playoffs; bye tied"):"Playoffs";
    }
    return `<tr><td class="num">${tied>1?"T-":""}${r.rank}</td><td><span class="tm-cell">${avatarHtml(r.id,team.short,22)}<span class="nm-short">${esc(team.short)}</span><span class="nm-full">${esc(team.disp)}</span></span></td><td class="num">${r.w}–${r.l}–${r.t}</td><td class="num">${r.pf.toFixed(2)}</td><td>${state}</td></tr>`;
  }).join("")+`</tbody></table></div>`;
  const byWeek=new Map();
  for(const g of result.games){if(!byWeek.has(g.period)) byWeek.set(g.period,[]);byWeek.get(g.period).push(g);}
  for(const [week,games] of byWeek){
    const picked=games.filter(g=>SEASON_PICKS.picks[HubScenarios.key(g)]).length;
    html+=`<details class="predictor-week" data-predictor-week="${week}"${SEASON_PICKS.open.has(week)?" open":""}><summary>Week ${week}${week===D.week?" · in progress":""} — ${picked}/${games.length} picked</summary>`;
    for(const g of games){
      const key=HubScenarios.key(g),choice=SEASON_PICKS.picks[key],h=D.byId[g.homeId],a=D.byId[g.awayId];
      html+=`<div class="predictor-game"><span><span class="tm-cell">${avatarHtml(a.id,a.short,24)}${esc(a.short)}</span> at <span class="tm-cell">${avatarHtml(h.id,h.short,24)}${esc(h.short)}</span>${week===D.week?`<span class="sub-line">Current: ${g.snapshotAwayPts.toFixed(2)} – ${g.snapshotHomePts.toFixed(2)} · not final</span>`:""}</span><div class="predictor-picks" role="group" aria-label="Week ${week}: ${esc(a.short)} at ${esc(h.short)}">`;
      for(const [pick,label] of [["AWAY",a.short],["HOME",h.short],["TIE","Tie"]])
        html+=`<button type="button" class="bs-btn" data-game="${key}" data-pick="${pick}" aria-label="${pick==="TIE"?"Pick a tie":`Pick ${esc(label)} to win`} · Week ${week}" aria-pressed="${choice===pick}">${pick==="TIE"?"":avatarHtml(pick==="HOME"?h.id:a.id,label,20)} ${esc(label)}</button>`;
      html+=`</div></div>`;
    }
    html+=`</details>`;
  }
  if(!result.games.length) html+=`<p class="cap">No unfinished regular-season games remain. Finished results are locked.</p>`;
  return html+`</div></section>`;
}
function wireSeasonPredictor(D,el){
  const panel=el.querySelector('#season-predictor');if(!panel)return;
  panel.addEventListener('toggle',event=>{
    const week=Number(event.target.dataset?.predictorWeek);if(!week)return;
    if(event.target.open) SEASON_PICKS.open.add(week);else SEASON_PICKS.open.delete(week);
  },true);
  panel.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    const key=button.dataset.game,pick=button.dataset.pick,reset=button.hasAttribute('data-reset-picks');
    if(reset) SEASON_PICKS.picks={};
    else{
      const game=D.games.find(g=>HubScenarios.key(g)===key&&!HubScenarios.done(g));
      if(!game||!['HOME','AWAY','TIE'].includes(pick))return;
      if(SEASON_PICKS.picks[key]===pick)delete SEASON_PICKS.picks[key];else SEASON_PICKS.picks[key]=pick;
    }
    saveSeasonPicks(reset);
    panel.outerHTML=seasonPredictorPanel(D);
    wireSeasonPredictor(D,el);
    const next=el.querySelector('#season-predictor');
    (reset?next.querySelector('[data-reset-picks]'):next.querySelector(`[data-game="${key}"][data-pick="${pick}"]`))?.focus({preventScroll:true});
  });
}

// The ONE official standings table (proposal 3.6). Odds / Bye / Proj W-L are the Hub simulation's; Status + Line are
// the playoff engine's exact-math badges. "—" until the engine has run (odds start in Week 3).
function paintStandings(){
  const D = DATA; const el = document.getElementById("pane-standings");
  if(!D){ el.innerHTML = `<div class="note">No data.</div>`; return; }
  const E = (ENGINE && ENGINE.week===D.week) ? ENGINE : null;
  const mc = E ? E.mc : null;
  const P = D.playoffTeams, B = D.byes || 0;
  const sl = standingsList(D);
  const dash = `<span class="bs-dim">—</span>`;
  const s = [scoreHeldPanel(D)];
  if(D.week<=2) s.push(`<p class="cap">Week ${D.week}: small samples. Playoff odds start in Week 3.</p>`);
  const meta = `Top ${P} make it${B ? ` · ${B===1 ? "#1 gets a bye" : `top ${B} get byes`}` : ""}`;
  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">Official standings</h2><span class="bs-meta">ESPN records · ${meta}</span>`
    + `<span class="bs-meta swipe-cue">Swipe the table for PF, PA, Bye, Proj W-L and Streak</span></div>`
    + `<div class="bs-table-wrap"><table class="bs-table bs-table--stick1 st-table" id="standingsTable">`
    + `<thead><tr><th class="num" scope="col">Sd</th><th scope="col">Team</th><th class="num" scope="col">W-L</th>`
    + `<th class="num" scope="col" title="Games over the first team out (+N), or games back of the last playoff spot">Line</th>`
    + `<th class="num" scope="col" title="Playoff odds from the Hub's 10,000-season simulation">Playoffs</th>`
    + `<th scope="col">Status</th>`
    + `<th class="num" scope="col" title="Points for (breaks ties in record)">PF</th><th class="num" scope="col" title="Points against">PA</th>`
    + (B ? `<th class="num" scope="col" title="Odds of the bye, from the Hub simulation">Bye</th>` : "")
    + `<th class="num" scope="col" title="Average final record across the Hub simulations">Proj W-L</th><th scope="col">Strk</th></tr></thead><tbody>`
    + sl.map((r,i)=>{
        const id = r.id, t = D.byId[id];
        const bdg = E ? E.bd.byId[id] : null, c = E ? E.cm[id] : null, m = mc ? mc.teams[id] : null;
        const cut = (i+1)===P ? " bs-cut" : "";
        const td = (html, num) => `<td class="${num ? "num" : ""}${cut}">${html}</td>`;
        const bye = !B ? "" : td(m ? (c.clinchedBye ? "100%" : c.byeGone ? "0%" : pc(m.pBye)) : dash, true);
        return `<tr>`
          + td(r.rank, true)
          + td(`<span class="tm-cell">${avatarHtml(id, t.short, 22)}<span class="nm-short">${esc(t.short)}</span><span class="nm-full">${esc(r.disp)}</span></span>`)
          + td(recStr(r.rec), true)
          + td(bdg ? esc(bdg.line) : dash, true)
          + td(m ? oddsTxt(m.pIn, c) : dash, true)
          + td(bdg ? badgeHtml(bdg) : dash)
          + td(pts(r.pf), true) + td(pts(t.pa), true)
          + bye
          + td(m ? `${m.projW.toFixed(1)}-${m.projL.toFixed(1)}` : dash, true)
          + td(streakOf(D, id))
          + `</tr>`;
      }).join("")
    + `</tbody></table></div>`);
  const rule = D.seedingRule;
  s.push(`<div class="bs-panel-body">`
    + `<p class="cap">The dashed line is the playoff cut (seed ${P}). Line: games over the first team out (+N) or games back of the last spot; "0, on points" = tied in wins.</p>`
    + (rule && rule!=="TOTAL_POINTS_SCORED"
        ? `<p class="cap">Tiebreak: ${esc(rule)} (the Hub's odds and clinch math assume total points for).</p>`
        : `<p class="cap">Ties in record go to total points for (ESPN league setting).</p>`)
    + `<p class="cap">Playoffs, Bye and Proj W-L come from the Hub's simulation${D.week<3 ? " (from Week 3 on)" : ""}; ESPN's own odds are next to them on <a href="#playoffs/teams">Playoffs</a>. Odds: see Playoffs › How this works.</p>`
    + `</div></section>`);
  el.innerHTML = s.join("");
  el.querySelector('[data-jump-predictor]')?.addEventListener('click',()=>selectTab('predictor'));
}
function paintSeasonPredictor(){
  const el=document.getElementById('pane-predictor');
  if(!DATA){el.innerHTML='<div class="note">No data.</div>';return;}
  el.innerHTML=seasonPredictorPanel(DATA);wireSeasonPredictor(DATA,el);
}

/* ============================ LEADERS ============================ */
let LEAD_POS = "all";   // Leaders filter: "all" or a POS key (QB/RB/WR/TE/K/DEF); #leaders/<POS> deep-links it
let LEAD_SORT = "total", LEAD_DESC = true;
function paintLeaders(){
  const D = DATA; const el = document.getElementById("pane-leaders");
  if(!D){ el.innerHTML = `<div class="note">No data.</div>`; return; }
  const { byPos } = positionalLeaders(D);
  const keys = POS_ORDER.filter(p=>byPos[p] && byPos[p].length);
  if(LEAD_POS!=="all" && !POS_ORDER.includes(LEAD_POS)) LEAD_POS = "all";

    : (byPos[LEAD_POS]||[]).map((x,i)=>({...x,posRank:i+1}));
  shown.sort((a,b)=>(LEAD_DESC?-1:1)*(a[LEAD_SORT]-b[LEAD_SORT]) || b.total-a.total || b.ppg-a.ppg || String(a.id).localeCompare(String(b.id)));
  const sortHeader = (key,label,title)=>`<th class="num" scope="col" aria-sort="${LEAD_SORT===key?(LEAD_DESC?"descending":"ascending"):"none"}"><button type="button" class="bs-sort" data-lead-sort="${key}" title="${title}. Sort ${LEAD_SORT===key&&LEAD_DESC?"lowest":"highest"} first">${label}</button></th>`;
  const s = [];
  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">Positional Leaders</h2>`
    + `<span class="bs-meta">Season total points (ESPN scoring). Rostered players only.</span></div>`

    + tabs.map(x=>`<button type="button" role="tab" id="ldPos-${x.k}" data-key="${x.k}" aria-controls="ldPane" aria-selected="${x.k===LEAD_POS}" tabindex="${x.k===LEAD_POS?0:-1}">${x.l}</button>`).join("")
    + `</div></div><div id="ldPane" role="tabpanel" aria-labelledby="ldPos-${LEAD_POS}" tabindex="0">`);
  if(!shown.length) s.push(`<div class="bs-panel-body"><p class="cap">No qualified players yet.</p></div>`);
  else s.push(`<div class="bs-table-wrap"><table class="bs-table bs-table--stick1"><thead><tr><th scope="col">Pos</th><th scope="col">Player</th><th scope="col">Owner</th>`
      + sortHeader("gp","GP","Games played") + sortHeader("total","Total","Season points (ESPN scoring)")
      + sortHeader("ppg","PPG","Season points per game played") + `</tr></thead><tbody>`
      + shown.map(x=>`<tr><td><span class="pos-${x.pos}">${POS_LABEL[x.pos]}</span> <span class="bs-dim">${x.posRank}</span></td>`
          + `<td><span class="tm-cell">${playerImgHtml(x.id,x.team,x.pos,20)}<span>${esc(x.player)}</span></span></td>`
          + `<td><span class="tm-cell">${avatarHtml(x.ownerId,x.owner,20)}<span>${esc(x.owner)}</span></span></td>`
          + `<td class="num">${x.gp}</td><td class="num">${pts(x.total)}</td><td class="num">${pts(x.ppg)}</td></tr>`).join("")
      + `</tbody></table></div>`);
  s.push(`<div class="bs-panel-body"><p class="cap">${LEAD_POS==="all"?"Top 5 rostered players per position by season total points; sorting reorders these same players.":"All rostered players at this position. No minimum games played."} Click GP, Total or PPG to sort; click again to reverse. Position numbers show season-total rank within that position. Owner = the team that rosters the player now; free agents are not included.</p></div></div></section>`);
  el.innerHTML = s.join("");
  el.querySelectorAll('[data-lead-sort]').forEach(button=>button.addEventListener('click',()=>{
    const key=button.dataset.leadSort;
    LEAD_DESC = LEAD_SORT===key ? !LEAD_DESC : true; LEAD_SORT=key;
    paintLeaders();
    el.querySelector(`[data-lead-sort="${key}"]`)?.focus();
  }));
  const lt = document.getElementById("ldTabs");
  if(lt) wireTabs(lt, k=>{
    const hadFocus = lt.contains(document.activeElement);
    LEAD_POS = k; paintLeaders(); writeHash();
    if(hadFocus) document.getElementById("ldPos-"+k)?.focus();

}

// week tablist (1..regWeeks) as real tab buttons in a scroll-snap row; current week carries aria-current="date".
function weekTabsHtml(listId, idPrefix, paneId, weeks, sel, cur){
  return `<div class="bs-tabs bs-tabs--sub wtabs" role="tablist" aria-label="Week" id="${listId}">` + weeks.map(w =>
    `<button type="button" role="tab" id="${idPrefix}${w}" data-key="${w}" aria-controls="${paneId}"`
