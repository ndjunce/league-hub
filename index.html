<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Crushers League Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* v6 ROYAL PURPLE + GOLD reskin (skin only; content/data/logic unchanged) */
  :root{
    --ink:#120a1f;         /* deep purple-tinted near-black bg */
    --panel:#1c1230;       /* card bg (purple charcoal) */
    --panel2:#160e28;      /* inner/darker panel */
    --line:#332248;        /* purple-tinted borders */
    --txt:#f1ecf8; --mut:#a596bd;   /* light text / muted lavender */
    --accent:#8b5cf6;      /* ROYAL PURPLE (replaces the old blue accent everywhere) */
    --accent2:#6d28d9;     /* deeper purple */
    --gold:#e6b800;        /* gold highlight */
    --gold2:#d4af37;       /* softer gold */
    --grn:#33e08a; --red:#ff6b6b; --purp:#b878ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--txt);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:1000px;margin:0 auto;padding:0 14px 60px}
  /* branded banner header (gold-on-purple) */
  header.banner{margin:16px 0 6px}
  .banner-inner{position:relative;border-radius:16px;overflow:hidden;
    background:linear-gradient(135deg,#3b1a63 0%,#5b2a86 45%,#2a1147 100%);
    border:1px solid #6d28d9;box-shadow:0 6px 30px rgba(91,42,134,.35), inset 0 0 0 1px rgba(230,184,0,.12);
    padding:26px 22px;display:flex;align-items:center;gap:16px}
  /* subtle gold sheen accent */
  .banner-inner::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 100% 0%, rgba(230,184,0,.14), transparent 55%)}
  .banner-logo{width:64px;height:64px;flex:0 0 auto;border-radius:12px;object-fit:contain;
    background:rgba(0,0,0,.25);box-shadow:0 0 0 1px rgba(230,184,0,.35)}
  .brand{position:relative;min-width:0}
  .brand-title{font-family:"Oswald",Impact,"Arial Narrow",sans-serif;font-weight:700;
    font-size:clamp(30px,9vw,54px);line-height:.98;letter-spacing:.06em;text-transform:uppercase;
    background:linear-gradient(180deg,#ffe58a 0%,#e6b800 55%,#c99700 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#e6b800;
    text-shadow:0 1px 0 rgba(0,0,0,.15)}
  .brand-sub{font-family:"Oswald",sans-serif;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
    color:#e9ddff;font-size:clamp(12px,3.2vw,15px);margin-top:6px;opacity:.92}
  .sub{color:var(--mut);font-size:13px;margin-top:8px;padding-left:2px}

  .tabs{display:flex;gap:8px;margin:16px 0 16px;flex-wrap:wrap}
  .tab{padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel);
       color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;user-select:none}
  .tab.active{color:var(--txt);border-color:var(--accent);background:rgba(139,92,246,.14)}

  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .btn{padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
       color:var(--txt);font-weight:700;font-size:12.5px;cursor:pointer}
  .btn:hover{border-color:var(--mut)}
  .btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  .status{color:var(--mut);font-size:12px}

  .loading{color:var(--mut);padding:40px 0;text-align:center}
  .err{color:var(--red);border:1px solid var(--red);border-radius:9px;padding:14px;margin:10px 0;font-size:13px;line-height:1.6}
  .note{color:var(--mut);font-size:12.5px;text-align:center;padding:16px 0}

  .card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:800;margin:0 0 4px}
  .card .cap{color:var(--mut);font-size:12px;margin:0 0 12px}

  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}

  /* superlative tiles */
  .tile{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:12px}
  .tile .k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  .tile .v{font-size:15px;font-weight:800;margin-top:4px}
  .tile .d{font-size:12px;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums}
  .tile.good .k{color:var(--grn)} .tile.bad .k{color:var(--red)} .tile.luck .k{color:var(--gold)} .tile.pos .k{color:var(--purp)}

  /* ranked rows */
  .rows{display:flex;flex-direction:column;gap:2px}
  .row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;
       padding:8px 6px;border-top:1px solid var(--line);font-size:13.5px}
  .row:first-child{border-top:none}
  .row .rk{font-weight:800;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
  .row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .row .nm .sub2{color:var(--mut);font-weight:600;font-size:11.5px;margin-left:6px}
  .row .val{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .row .val .rec{color:var(--mut);font-weight:600;font-size:12px;margin-left:6px}
  .row.me{background:rgba(139,92,246,.10)}

  /* matchup preview */
  .mu{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
      border-top:1px solid var(--line);padding:10px 4px}
  .mu:first-child{border-top:none}
  .mu .side{min-width:0}
  .mu .side.r{text-align:right}
  .mu .tn{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mu .tr{color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums}
  .mu .vs{color:var(--mut);font-size:11px;font-weight:800;text-align:center}
  .mu .mov{color:var(--grn);font-weight:800;font-variant-numeric:tabular-nums}
  .mu .side.win .tn{color:var(--txt)} .mu .side .tn{color:var(--mut)}
  .mu .side.win .tr{color:var(--txt);font-weight:800} .mu .side .tr{color:var(--mut);font-weight:700}
  /* week tabs */
  .wtabs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
  .wtab{padding:5px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
        color:var(--mut);font-weight:700;font-size:12.5px;cursor:pointer;user-select:none}
  .wtab.on{color:var(--txt);border-color:var(--accent);background:rgba(139,92,246,.16)}

  /* playoff status pills */
  .pill{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:7px;border:1px solid;white-space:nowrap}
  .pill.clinch{color:var(--grn);border-color:var(--grn);background:rgba(51,224,138,.12)}
  .pill.elim{color:var(--red);border-color:var(--red);background:rgba(255,96,96,.12)}
  .pill.alive{color:var(--gold);border-color:var(--gold);background:rgba(255,207,63,.10)}
  .pline{color:var(--mut);font-size:12px;margin-top:3px;line-height:1.5}

  /* member avatars */
  .mav{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:50%;
       overflow:hidden;background:var(--panel2);border:1px solid var(--line);vertical-align:middle}
  .mav img{width:100%;height:100%;object-fit:cover;display:block}
  .mav-fb{width:100%;height:100%;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--mut)}
  /* At-a-glance list (fixed: full names, no clip) */
  .ag-list{display:flex;flex-direction:column;gap:2px}
  .ag-row{display:flex;align-items:center;gap:9px;padding:8px 4px;border-top:1px solid var(--line);flex-wrap:wrap}
  .ag-row:first-child{border-top:none}
  .ag-nm{font-weight:800;font-size:14px;flex:0 0 auto}
  .ag-txt{color:var(--mut);font-size:12.5px;font-weight:600;flex:1 1 100%;padding-left:35px}
  @media(min-width:480px){.ag-txt{flex:1 1 auto;padding-left:0;text-align:right}}
  .tm-cell{display:inline-flex;align-items:center;gap:7px}
  /* top-3 rows inside a tile */
  .t3{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0;border-top:1px solid var(--line)}
  .t3:first-of-type{border-top:none;margin-top:4px}
  .t3r{color:var(--mut);font-weight:800;width:12px;text-align:center;flex:0 0 auto}
  .t3n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
  .t3o{color:var(--mut);font-size:10.5px;flex:0 0 auto}
  .t3p{font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto;margin-left:2px}
  /* trade block grid */
  .blk-legend{display:flex;gap:8px;margin:2px 0 12px;flex-wrap:wrap}
  .bpill{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:7px;border:1px solid}
  .bpill.surplus{color:var(--grn);border-color:var(--grn);background:rgba(51,224,138,.12)}
  .bpill.short{color:var(--red);border-color:var(--red);background:rgba(255,96,96,.12)}
  .bpill.ok{color:var(--mut);border-color:var(--line);background:var(--panel2)}
  .blk-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.blk{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  table.blk th,table.blk td{padding:8px 6px;text-align:center;font-size:13px;border-top:1px solid var(--line)}
  table.blk thead th{color:var(--mut);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border-top:none}
  table.blk th.tmh,table.blk td.tmh{text-align:left;font-weight:700;white-space:nowrap;position:sticky;left:0;background:var(--panel);z-index:1}
  table.blk td.bc{border-radius:0}
  table.blk td.bc .bn{display:inline-block;min-width:22px;font-weight:800}
  table.blk td.bc.surplus{background:rgba(51,224,138,.14);color:var(--grn)}
  table.blk td.bc.short{background:rgba(255,96,96,.14);color:var(--red)}
  table.blk td.bc.ok{color:var(--mut)}
  .foot{color:var(--mut);font-size:11.5px;margin-top:26px;text-align:center;line-height:1.6}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="banner">
    <div class="banner-inner">
      <!-- LOGO SLOT: drop a real logo by setting the img src (or add one) — text title is the fallback.
           To use an image later: <img class="banner-logo" src="assets/royal-crushers-logo.png" alt="Royal Crushers"> -->
      <div class="brand">
        <div class="brand-title" id="lgTitle">ROYAL CRUSHERS</div>
        <div class="brand-sub">League Hub</div>
      </div>
    </div>
    <div class="sub" id="sub">Loading…</div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="insights">📊 League Insights</div>
    <div class="tab" data-tab="playoffs">🏆 Playoff Picture</div>
    <div class="tab" data-tab="block">🔁 Trade Block</div>
  </div>

  <div class="bar">
    <button class="btn primary" id="refreshBtn">↻ Refresh</button>
    <span class="status" id="status"></span>
    <label class="status" style="margin-left:auto"><input type="checkbox" id="autoRefresh" checked> auto-refresh</label>
  </div>

  <div id="errbox"></div>
  <div id="pane-insights"><div class="loading">Loading…</div></div>
  <div id="pane-playoffs" class="hide"><div class="loading">Loading…</div></div>
  <div id="pane-block" class="hide"><div class="loading">Loading…</div></div>

  <div class="foot" id="foot"></div>
</div>

<script>
/* =============================================================================
   League Hub — standalone, shareable, league-FACING. No personal/targeting data.
   Royal Crushers = ESPN via the serverless proxy (cookie stays server-side).
   Provider abstraction: ESPN now, Sleeper (public API, no secret) can drop in later.
   ============================================================================= */

// ---- CONFIG ----
const LEAGUE = {
  provider: "espn",              // "espn" (via proxy) | "sleeper" (direct public API, later)
  id: "963488",                  // Royal Crushers
  season: "2026",
  name: "Royal Crushers",
  // ESPN proxy base: same-origin on the Vercel deploy; absolute fallback for local/other hosts.
  espnProxy: (location.hostname.endsWith("vercel.app") || location.hostname==="localhost")
    ? "/api/espn"
    : "https://fantasy-dashboard-orpin.vercel.app/api/espn",  // fallback to the existing proxy
};

// Real member names keyed by ESPN teamId (id-keyed = immune to team-name edits).
// Reconciled against the live 963488 team list: id 17 "Mr. Beer's Boys" = Zach, id 13 "5" = Evan.
const MEMBER = {
  1:"Seth", 2:"Riley", 5:"Nick", 6:"Henry", 7:"Bobby", 8:"Thor",
  12:"Ben", 13:"Evan", 15:"Charlie", 16:"Isaac", 17:"Zach", 18:"Chet",
};
// member logo files copied into assets/logos/ (lowercase firstname + "logo"; Evan is .jpg, rest .png).
const MEMBER_LOGO = {
  "Ben":"benlogo.png","Bobby":"bobbylogo.png","Charlie":"charlielogo.png","Chet":"chetlogo.png",
  "Evan":"Evanlogo.jpg","Henry":"henrylogo.png","Isaac":"isaaclogo.png","Nick":"nicklogo.png",
  "Riley":"rileylogo.png","Seth":"sethlogo.png","Thor":"thorlogo.png","Zach":"zachlogo.png",
};
// display: "Name (Team Name)" when mapped, else the ESPN team name (never blank).
function memberName(id, teamName){ const n = MEMBER[id]; return n ? `${n} (${teamName})` : teamName; }
function memberShort(id, teamName){ return MEMBER[id] || teamName; }
function logoFor(id){ const n = MEMBER[id]; const f = n && MEMBER_LOGO[n]; return f ? `assets/logos/${f}` : null; }
// small round avatar: member logo if present, else initials circle. `label` = name shown for initials fallback.
function avatarHtml(id, label, size){
  const url = logoFor(id); const px = size||24;
  const initial = esc((String(label||"?").trim()[0]||"?").toUpperCase());
  if(url) return `<span class="mav" style="width:${px}px;height:${px}px"><img src="${url}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="mav-fb" style="display:none">${initial}</span></span>`;
  return `<span class="mav" style="width:${px}px;height:${px}px"><span class="mav-fb" style="display:flex">${initial}</span></span>`;
}

// auto-refresh: light poll so an open tab stays current on game days (does NOT push; re-pulls on interval)
const AUTO_REFRESH_MS = 150000; // 2.5 min

// ESPN maps (same as the dashboard's proven normalization)
const SLOT = {0:"QB",1:"TQB",2:"RB",3:"RB/WR",4:"WR",5:"WR/TE",6:"TE",7:"OP",8:"DT",9:"DE",
  10:"LB",11:"DL",12:"CB",13:"S",14:"DB",15:"DP",16:"D/ST",17:"K",18:"P",19:"HC",20:"BN",21:"IR",23:"FLEX",24:"ER"};
const POS = {1:"QB",2:"RB",3:"WR",4:"TE",5:"K",16:"DEF"};
const PRO = {0:"FA",1:"ATL",2:"BUF",3:"CHI",4:"CIN",5:"CLE",6:"DAL",7:"DEN",8:"DET",9:"GB",10:"TEN",
  11:"IND",12:"KC",13:"LV",14:"LAR",15:"MIA",16:"MIN",17:"NE",18:"NO",19:"NYG",20:"NYJ",21:"PHI",
  22:"ARI",23:"PIT",24:"LAC",25:"SF",26:"SEA",27:"TB",28:"WSH",29:"CAR",30:"JAX",33:"BAL",34:"HOU"};
const STARTABLE_POS = ["QB","RB","WR","TE","K","DEF"];

let DATA = null;
let ACTIVE = "insights";

async function jraw(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pts(n){ return (Math.round((n||0)*10)/10).toFixed(1); }

/* ---------- provider: ESPN (via proxy) ---------- */
const providers = {};
providers.espn = (function(){
  function teamName(t){ return (t.name || `${t.location||""} ${t.nickname||""}`.trim() || ("Team "+t.id)); }
  const recOf = t => { const o=(t.record&&t.record.overall)||{}; return {w:o.wins||0,l:o.losses||0,t:o.ties||0}; };
  const pf = t => (t.record&&t.record.overall&&t.record.overall.pointsFor)||0;
  const pa = t => (t.record&&t.record.overall&&t.record.overall.pointsAgainst)||0;

  // actual points a player scored in a specific week (source 0 = actual, split 1 = weekly). null if none.
  function weekActual(p, wk){
    if(!p.stats) return null;
    const s = p.stats.find(x=>x.statSourceId===0 && x.statSplitTypeId===1 && x.scoringPeriodId===wk);
    return s ? Math.round((s.appliedTotal||0)*10)/10 : null;
  }
  function playerOf(entry, curWeek){
    const p = (entry.playerPoolEntry && entry.playerPoolEntry.player) || entry.player || {};
    const applied = (entry.playerPoolEntry && entry.playerPoolEntry.appliedStatTotal) || 0; // season-to-date actual
    // per-week actual points map for every week this player has a stat line
    const byWeek = {};
    (p.stats||[]).forEach(s=>{ if(s.statSourceId===0 && s.statSplitTypeId===1 && s.scoringPeriodId!=null) byWeek[s.scoringPeriodId] = Math.round((s.appliedTotal||0)*10)/10; });
    return { id:String(p.id||entry.playerId||""), name:p.fullName||("id "+(entry.playerId||"?")),
             pos: POS[p.defaultPositionId]||"?", team: PRO[p.proTeamId]||"",
             eligible: (p.eligibleSlots||[]).slice(),          // raw slot ids the player can fill
             slot: SLOT[entry.lineupSlotId] || String(entry.lineupSlotId),
             slotId: entry.lineupSlotId,
             starter: SLOT[entry.lineupSlotId]!=="BN" && SLOT[entry.lineupSlotId]!=="IR",
             onIR: SLOT[entry.lineupSlotId]==="IR",
             pts: applied,                                     // season total (positional leaders)
             byWeek };                                         // {week: actualPts}
  }
  function buildTeam(t, curWeek){
    const entries = ((t.roster||{}).entries)||[];
    const players = entries.map(e=>playerOf(e, curWeek));
    const tn = teamName(t);
    return {
      id: t.id, name: tn, disp: memberName(t.id, tn), short: memberShort(t.id, tn),
      record: recOf(t), pf: pf(t), pa: pa(t),
      moves: (t.transactionCounter&&t.transactionCounter.acquisitions)||0,
      players,
      starters: players.filter(p=>p.starter),
      bench: players.filter(p=>!p.starter && !p.onIR),
    };
  }

  async function load(){
    const url = `${LEAGUE.espnProxy}?league=${encodeURIComponent(LEAGUE.id)}&season=${encodeURIComponent(LEAGUE.season)}`
      + `&view=mTeam&view=mRoster&view=mMatchup&view=mSettings&view=mStandings&view=mSchedule`;
    const d = await jraw(url);
    if(d && d.error){
      if(d.error==="espn_auth_expired") return { authExpired:true };
      if(d.error==="server_not_configured") return { notConfigured:true };
      throw new Error(d.message || d.error);
    }
    const settings = d.settings||{};
    const sched = settings.scheduleSettings || {};
    const regWeeks = sched.matchupPeriodCount || 14;
    const playoffTeams = sched.playoffTeamCount || 6;
    const week = (d.status && d.status.currentMatchupPeriod) || d.scoringPeriodId || 1;
    const teams = (d.teams||[]).map(t=>buildTeam(t, week));
    const byId = {}; teams.forEach(t=>byId[t.id]=t);

    // lineup slot config (slotId -> count) for the exact optimal-lineup solve. Only slots with count>0
    // that aren't bench/IR are startable slots.
    const slotCounts = (settings.rosterSettings && settings.rosterSettings.lineupSlotCounts) || {};
    const startSlots = []; // list of startable slotIds, one entry per slot (e.g. RB appears twice if 2 RB)
    Object.keys(slotCounts).forEach(sid=>{
      const id = Number(sid), n = slotCounts[sid]||0, lbl = SLOT[id];
      if(n>0 && lbl!=="BN" && lbl!=="IR") for(let i=0;i<n;i++) startSlots.push(id);
    });

    // games from schedule; keep winner + a "played" flag (has any points). Live current week included.
    const games = (d.schedule||[]).filter(g=>g.home&&g.away&&g.home.teamId!=null&&g.away.teamId!=null).map(g=>({
      period: g.matchupPeriodId,
      homeId: g.home.teamId, awayId: g.away.teamId,
      homePts: g.home.totalPoints||0, awayPts: g.away.totalPoints||0,
      winner: g.winner,  // "HOME" | "AWAY" | "UNDECIDED"
    }));

    return {
      provider:"espn", name: settings.name || LEAGUE.name, size: settings.size || teams.length,
      week, regWeeks, playoffStart: regWeeks+1, playoffTeams,
      startSlots,
      teams, byId, games,
    };
  }
  return { load };
})();

/* ---------- provider: Sleeper (stub for later — public API, no secret) ---------- */
providers.sleeper = (function(){
  async function load(){ throw new Error("Sleeper provider not enabled yet for this hub."); }
  return { load };
})();

/* ============================ INSIGHTS ============================ */

// completed games only (a game with a winner set, or a period before the current week)
function completedGames(D){ return D.games.filter(g=>(g.winner==="HOME"||g.winner==="AWAY") || g.period < D.week); }

// plain standings: W-L order, points-for tiebreaker (no "power" editorializing)
function standingsList(D){
  return D.teams.slice().sort((a,b)=> (b.record.w-a.record.w) || (b.pf-a.pf))
    .map((t,i)=>({ rank:i+1, id:t.id, disp:t.disp, pf:t.pf, rec:t.record }));
}

// which completed weeks have games (for the week tabs)
function completedWeeks(D){
  const set = new Set(completedGames(D).map(g=>g.period));
  return [...set].sort((a,b)=>a-b);
}

// games for a specific week, with margin + winner/loser resolved
function weekGames(D, wk){
  return D.games.filter(g=>g.period===wk).map(g=>{
    const homeWon = g.homePts>g.awayPts, tie = g.homePts===g.awayPts;
    return {
      period:wk, homeId:g.homeId, awayId:g.awayId, homePts:g.homePts, awayPts:g.awayPts,
      margin: Math.round(Math.abs(g.homePts-g.awayPts)*10)/10, tie,
      winId: tie?null:(homeWon?g.homeId:g.awayId), loseId: tie?null:(homeWon?g.awayId:g.homeId),
      winPts: Math.max(g.homePts,g.awayPts), losePts: Math.min(g.homePts,g.awayPts),
    };
  });
}

// margin- + league-context-aware superlatives for ONE week
function weekSuperlatives(D, wk){
  const games = weekGames(D, wk).filter(g=>(g.homePts||g.awayPts)>0);
  if(!games.length) return null;
  // per-team scores this week
  const scores = [];
  games.forEach(g=>{
    scores.push({ id:g.homeId, pts:g.homePts, won:g.homePts>g.awayPts, opp:g.awayPts, margin:g.margin });
    scores.push({ id:g.awayId, pts:g.awayPts, won:g.awayPts>g.homePts, opp:g.homePts, margin:g.margin });
  });
  const ptsList = scores.map(s=>s.pts).sort((a,b)=>a-b);
  const median = ptsList[Math.floor(ptsList.length/2)];
  const rankOf = p => scores.filter(s=>s.pts>p).length + 1; // 1 = highest that week
  const n = scores.length;

  const byPts = scores.slice().sort((a,b)=>b.pts-a.pts);
  const high = byPts[0], low = byPts[byPts.length-1];
  const blowout = games.slice().sort((a,b)=>b.margin-a.margin)[0];
  const nailbiter = games.slice().sort((a,b)=>a.margin-b.margin)[0];

  // UNLUCKY: lost AND scored well relative to the field. Score each loser by (weekRank low=better) +
  // small margin bonus. Prefer a loser who scored above the median / would've beaten most teams.
  const losers = scores.filter(s=>!s.won);
  let unlucky=null;
  if(losers.length){
    unlucky = losers.map(s=>{
      const r = rankOf(s.pts);                    // 1=best score in league that week
      const beatMedian = s.pts >= median;
      // "would have won" count: how many opponents this week scored less than s
      const wouldBeat = scores.filter(o=>o.id!==s.id && o.pts < s.pts).length;
      const unluckScore = (n - r) + (beatMedian?3:0) + wouldBeat*0.5 + Math.max(0,(15-s.margin))/15; // small margin adds
      return { ...s, r, wouldBeat, beatMedian, unluckScore };
    }).sort((a,b)=>b.unluckScore-a.unluckScore)[0];
  }
  // LUCKY: won AND scored poorly relative to the field. Prefer low weekRank winner, close margin.
  const winners = scores.filter(s=>s.won);
  let lucky=null;
  if(winners.length){
    lucky = winners.map(s=>{
      const r = rankOf(s.pts);
      const belowMedian = s.pts <= median;
      const wouldLose = scores.filter(o=>o.id!==s.id && o.pts > s.pts).length; // how many outscored them
      const luckScore = r + (belowMedian?3:0) + wouldLose*0.5 + Math.max(0,(15-s.margin))/15;
      return { ...s, r, wouldLose, belowMedian, luckScore };
    }).sort((a,b)=>b.luckScore-a.luckScore)[0];
  }
  return { high, low, blowout, nailbiter, unlucky, lucky, median };
}

// NOTE: "Points Left on the Bench" was REMOVED in v3. A truly-exact figure needs each week's
// HISTORICAL started lineup, but ESPN's mRoster only exposes the CURRENT roster (which churns via
// adds/drops/lineup changes), so a past week's optimal-vs-actual can't be computed exactly. Per the
// "exact or gone" rule, it's gone rather than shipping a misleading approximation.

// games played for PPG = number of weeks this player has an actual weekly stat entry (dynamic, not hardcoded).
function playerGames(p){ return Object.keys(p.byWeek||{}).length; }
function playerPPG(p){ const g = playerGames(p); return g ? (p.pts / g) : 0; }

// Positional Leaders (season): top scorer per position BY PPG (season total ÷ games played).
function positionalLeaders(D){
  const best = {};  // pos -> {player, team, ppg, ownerId, owner}
  D.teams.forEach(t=>t.players.forEach(p=>{
    if(!STARTABLE_POS.includes(p.pos)) return;
    const ppg = playerPPG(p);
    if(!best[p.pos] || ppg > best[p.pos].ppg) best[p.pos] = { player:p.name, team:p.team, ppg, ownerId:t.id, owner:t.short };
  }));
  return best;
}

// Top-3 scorers per position for a SPECIFIC week (from each player's actual weekly points).
function weekTopScorers(D, wk){
  const byPos = {};  // pos -> [{player, team, ownerId, owner, pts}]
  D.teams.forEach(t=>t.players.forEach(p=>{
    if(!STARTABLE_POS.includes(p.pos)) return;
    const wp = (p.byWeek||{})[wk];
    if(wp==null) return;
    (byPos[p.pos]=byPos[p.pos]||[]).push({ player:p.name, team:p.team, ownerId:t.id, owner:t.short, pts:wp });
  }));
  Object.keys(byPos).forEach(P=>{ byPos[P].sort((a,b)=>b.pts-a.pts); byPos[P]=byPos[P].slice(0,3); });
  return byPos;
}

function paintInsights(){

      </div>`).join("") + `</div></div>`);

  // --- WEEKLY VIEW: tabs for ALL regular-season weeks; default = current week ---

    `<span class="wtab ${w===wk?'on':''}${w===D.week?' cur':''}" data-wk="${w}">Wk ${w}</span>`).join("") + `</div>`;

  const wgAll = weekGames(D, wk);
  const wgScored = wgAll.filter(g=>(g.homePts||g.awayPts)>0);
  const anyScores = wgScored.length>0;

  // matchup row: score on EACH side, winner highlighted, margin attached to the winner. No lone middle number.
  function muRow(g){
    const homeWins = !g.tie && g.homePts>g.awayPts;
    const awayWins = !g.tie && g.awayPts>g.homePts;
    const scored = (g.homePts||g.awayPts)>0;
    const homeSide = `<div class="side ${homeWins?'win':''}">
        <div class="tn">${homeWins?'▸ ':''}${esc(shortOf(g.homeId))}</div>
        <div class="tr">${scored?pts(g.homePts):'—'}${homeWins?` <span class="mov">+${pts(g.margin)}</span>`:''}</div></div>`;
    const awaySide = `<div class="side r ${awayWins?'win':''}">
        <div class="tn">${awayWins?'▸ ':''}${esc(shortOf(g.awayId))}</div>
        <div class="tr">${awayWins?`<span class="mov">+${pts(g.margin)}</span> `:''}${scored?pts(g.awayPts):'—'}</div></div>`;
    return `<div class="mu">${homeSide}<div class="vs">${g.tie&&scored?'tie':'vs'}</div>${awaySide}</div>`;
  }

  let weekBody;
  if(isFuture || !anyScores){
    weekBody = `<div class="cap">${isFuture?`Week ${wk} hasn't been played yet — scheduled matchups:`:`No scores yet for Week ${wk}.`}</div>`
      + wgAll.map(g=>`<div class="mu"><div class="side"><div class="tn">${esc(shortOf(g.homeId))}</div></div><div class="vs">vs</div><div class="side r"><div class="tn">${esc(shortOf(g.awayId))}</div></div></div>`).join("");
  } else {
    const liveNote = isCurrent ? `<div class="cap">${isCurrent?'Week '+wk+' — live/in-progress; finals where games are done.':''}</div>` : "";
    weekBody = liveNote + wgScored.map(muRow).join("");
  }

  // per-week superlatives (margin- + context-aware) — only when there are real scores
  const sup = anyScores ? weekSuperlatives(D, wk) : null;
  let supHtml = "";
  if(sup){
    const tile=(cls,k,v,d)=>`<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div></div>`;
    supHtml = `<div class="cap" style="margin-top:12px">Week ${wk} superlatives${isCurrent?' (live)':''}</div><div class="grid">`
      + tile("good","Highest Scorer", shortOf(sup.high.id), `${pts(sup.high.pts)} pts`)
      + tile("bad","Lowest Scorer", shortOf(sup.low.id), `${pts(sup.low.pts)} pts`)
      + tile("","Biggest Blowout", shortOf(sup.blowout.winId), `beat ${esc(shortOf(sup.blowout.loseId))} by ${pts(sup.blowout.margin)}`)
      + tile("","Closest Game", shortOf(sup.nailbiter.winId), `won by just ${pts(sup.nailbiter.margin)} over ${esc(shortOf(sup.nailbiter.loseId))}`)
      + (sup.unlucky ? tile("luck","Unlucky", shortOf(sup.unlucky.id),
          `${pts(sup.unlucky.pts)} pts and LOST${sup.unlucky.wouldBeat?` — would've beaten ${sup.unlucky.wouldBeat} other team${sup.unlucky.wouldBeat>1?"s":""} this week`:""}${sup.unlucky.margin!=null?`, by just ${pts(sup.unlucky.margin)}`:""}`) : "")
      + (sup.lucky ? tile("luck","Lucky", shortOf(sup.lucky.id),
          `${pts(sup.lucky.pts)} pts and WON${sup.lucky.wouldLose?` — ${sup.lucky.wouldLose} team${sup.lucky.wouldLose>1?"s":""} outscored them but they still won`:""}${sup.lucky.margin!=null?`, by just ${pts(sup.lucky.margin)}`:""}`) : "")
      + `</div>`;
  }

  s.push(`<div class="card"><h2>Weekly Results</h2>${weekTabs}${weekBody}${supHtml}</div>`);

  // --- TOP 3 weekly scorers per position (for the selected week) ---
  if(anyScores){
    const tops = weekTopScorers(D, wk);
    const order = ["QB","RB","WR","TE","DEF","K"].filter(p=>tops[p] && tops[p].length);
    if(order.length){
      const posName = {QB:"QB",RB:"RB",WR:"WR",TE:"TE",DEF:"D/ST",K:"K"};
      s.push(`<div class="card"><h2>Top Scorers — Week ${wk}${isCurrent?' (live)':''}</h2><div class="cap">Highest-scoring players at each position this week.</div><div class="grid">`
        + order.map(P=>`<div class="tile"><div class="k">${posName[P]}</div>`
            + tops[P].map((x,i)=>`<div class="t3"><span class="t3r">${i+1}</span>${avatarHtml(x.ownerId,x.owner,18)}<span class="t3n">${esc(x.player)}</span><span class="t3o">${esc(x.owner)}</span><span class="t3p">${pts(x.pts)}</span></div>`).join("")
            + `</div>`).join("")
        + `</div></div>`);
    }
  }

  // --- Positional leaders (season) ---
  const pl = positionalLeaders(D);
  const plKeys = STARTABLE_POS.filter(p=>pl[p]);
  if(plKeys.length){
    s.push(`<div class="card"><h2>Positional Leaders</h2><div class="cap">Season leader at each position by points per game (season total ÷ games played).</div><div class="grid">`
      + plKeys.map(p=>`<div class="tile pos"><div class="k">${p}</div><div class="v">${esc(pl[p].player)}</div><div class="d">${avatarHtml(pl[p].ownerId,pl[p].owner,16)} ${pts(pl[p].ppg)} PPG · ${esc(pl[p].owner)}</div></div>`).join("")
      + `</div></div>`);
  }

  // (Points Left on the Bench removed in v3 — can't be computed exactly for past weeks; see note above.)

  el.innerHTML = s.join("");

  // wire week tabs
  el.querySelectorAll(".wtab").forEach(t => t.addEventListener("click", () => {
    VIEW_WEEK = Number(t.dataset.wk); paintInsights();
  }));
}

/* ============================ PLAYOFF SCENARIOS ============================ */

// standings sorted by W, then points-for tiebreaker
function standings(D){
  return D.teams.slice().sort((a,b)=> (b.record.w-a.record.w) || (b.pf-a.pf))
    .map((t,i)=>({ seed:i+1, id:t.id, name:t.disp, w:t.record.w, l:t.record.l, t:t.record.t, pf:t.pf }));
}

function paintPlayoffs(){
  const D = DATA; const el = document.getElementById("pane-playoffs");
  if(!D){ el.innerHTML = `<div class="note">No data.</div>`; return; }
  const st = standings(D);
  const played = Math.max(0, D.week-1);
  const gamesLeft = Math.max(0, D.regWeeks - played);
  const cutoff = D.playoffTeams;
  const s = [];

  // header / context
  s.push(`<div class="card"><h2>Playoff Picture</h2>
    <div class="cap">Top <b>${cutoff}</b> of ${D.size} make the playoffs · ${D.regWeeks}-week regular season · ~${gamesLeft} game(s) left (playoffs start Week ${D.playoffStart}).</div>`);
  if(gamesLeft >= D.regWeeks-1){
    s.push(`<div class="cap">It's early — everyone is still alive and almost every scenario is open. This section gets sharper each week as games are played. For now, here's the current seeding by record (points-for breaks ties).</div>`);
  }
  s.push(`</div>`);

  // clinch/elim/alive — simple, honest bounds:
  // best case = win all remaining; worst = lose all. Compare against the current cutoff line.
  const maxW = t => t.w + gamesLeft;   // if they win out
  const cutoffTeam = st[cutoff-1];
  const firstOutW = st[cutoff] ? st[cutoff].w : 0;   // team just outside
  const lastInMaxIfLose = st[cutoff-1] ? st[cutoff-1].w : 0;

  s.push(`<div class="card"><h2>Standings & Status</h2><div class="cap">W-L, points-for tiebreaker. Status uses win-out / lose-out bounds (early-season honest bounds, not a projection).</div><div class="rows">`);
  st.forEach((t,i)=>{
    const inLine = i < cutoff;
    // ALIVE by default early; only mark clinched/eliminated when math is certain
    let status="alive", label="ALIVE", why="";
    if(gamesLeft===0){
      status = inLine ? "clinch" : "elim"; label = inLine ? "IN" : "OUT";
    } else {
      // eliminated if even winning out can't catch the current cutoff team's floor (lose-out)... too strict early -> keep ALIVE
      const bestFinish = t.w + gamesLeft;
      const cutoffFloor = (st[cutoff-1]?.w)||0; // current #cutoff wins (won't decrease)
      if(bestFinish < cutoffFloor && i>=cutoff){ status="elim"; label="OUT"; why="can't catch the cut line even winning out"; }
      // clinched if worst finish still beats the best possible of the first team out
      const worstFinish = t.w;
      const chaserCeil = (st[cutoff]?.w||0) + gamesLeft;
      if(i<cutoff && worstFinish > chaserCeil){ status="clinch"; label="IN"; why="can't be caught even losing out"; }
    }
    const seedNote = inLine ? `seed ${i+1} (in)` : `seed ${i+1} (out by ${((st[cutoff-1]?.w||0) - t.w) || "tiebreak"})`;
    s.push(`<div class="row">
      <span class="rk">${i+1}</span>
      <span class="nm">${esc(t.name)}<span class="sub2">${t.w}-${t.l}${t.t?"-"+t.t:""} · ${pts(t.pf)} pf</span></span>
      <span class="val"><span class="pill ${status}">${label}</span></span>
    </div>${why?`<div class="pline" style="padding:0 6px 6px 42px">${esc(t.name)} ${why}.</div>`:``}`);
  });
  s.push(`</div></div>`);

  // honest "what needs to happen" note
  s.push(`<div class="card"><div class="cap">As the season goes on this will show concrete paths ("win 2 of your last 3 and you're in"). With ${gamesLeft} games left for everyone, the field is still wide open. Check back weekly.</div></div>`);

  el.innerHTML = s.join("");
}

/* ============================ TRADE BLOCK (simple surplus/shortage counts) ============================ */
// Factual only: rostered COUNT per position vs Royal Crushers' startable need. No values, no rankings.
// Starting slots: QB, RB, RB, WR, WR, TE, FLEX, D/ST, K. FLEX is RB/WR/TE eligible.
const BLOCK_POS = ["QB","RB","WR","TE","DEF","K"];
const BLOCK_LABEL = { QB:"QB", RB:"RB", WR:"WR", TE:"TE", DEF:"D/ST", K:"K" };
// base starting requirement per position (dedicated slots only); FLEX handled separately across RB/WR/TE
const START_NEED = { QB:1, RB:2, WR:2, TE:1, DEF:1, K:1 };
const FLEX_POOL = ["RB","WR","TE"]; // one FLEX slot any of these can fill

// classify one team's count at a position vs need. Returns {count, need, status:'short'|'surplus'|'ok'}
// Consistent rule: SURPLUS when rostered is well above what you can start (startable + 1);
// SHORTAGE when at/below what you must start. K/D-ST (single slot, no depth expectation) = 1 is fine.
function blockStatus(pos, count){
  const need = START_NEED[pos] || 0;
  const flexEligible = FLEX_POOL.includes(pos);
  // K + D/ST: carrying 1 is normal → short only at 0, surplus at 3+ (hoarding).
  if(!flexEligible && (pos==="K" || pos==="DEF")){
    if(count === 0) return { count, need, status:"short" };
    if(count >= 3)  return { count, need, status:"surplus" };
    return { count, need, status:"ok" };
  }
  // "startable" = dedicated starting slots + (a share of the 1 FLEX for flex-eligible positions).
  const startable = need + (flexEligible ? 1 : 0);
  // SURPLUS = clearly more than you can start (one past startable). TE: need1+flex1=2 → 3+ = surplus. RB/WR: 4+.
  if(count >= startable + 1) return { count, need, status:"surplus" };
  // SHORTAGE = at/below what you must start (no depth). QB1 → 1 flagged thin; TE1 → 1 thin; RB2 → ≤2 thin.
  if(count <= need) return { count, need, status:"short" };
  return { count, need, status:"ok" };
}

function paintTradeBlock(){
  const D = DATA; const el = document.getElementById("pane-block");
  if(!D){ el.innerHTML = `<div class="note">No data.</div>`; return; }

  // count rostered players per position per team (plain counts, no weighting)
  const rows = D.teams.slice().sort((a,b)=> (b.record.w-a.record.w)||(b.pf-a.pf)).map(t=>{
    const cnt = {}; BLOCK_POS.forEach(p=>cnt[p]=0);
    t.players.forEach(p=>{ if(cnt[p.pos]!=null) cnt[p.pos]++; });
    const cells = BLOCK_POS.map(p=>({ pos:p, ...blockStatus(p, cnt[p]) }));
    return { id:t.id, disp:t.disp, short:t.short, cells,
             shortages: cells.filter(c=>c.status==="short").map(c=>BLOCK_LABEL[c.pos]),
             surpluses: cells.filter(c=>c.status==="surplus").map(c=>BLOCK_LABEL[c.pos]) };
  });

  const s = [];
  s.push(`<div class="card"><h2>Trade Block — who's deep, who's thin</h2>
    <div class="cap">Plain roster counts vs starting slots (QB, RB×2, WR×2, TE, FLEX, D/ST, K). <b>Surplus</b> = more bodies than you can start; <b>shortage</b> = at or below what you must start. Just counts — no player values, rankings, or recommendations. Auto from live rosters.</div>`);

  // legend
  s.push(`<div class="blk-legend"><span class="bpill surplus">surplus</span><span class="bpill short">shortage</span><span class="bpill ok">ok</span></div>`);

  // grid: team rows, position columns
  s.push(`<div class="blk-wrap"><table class="blk"><thead><tr><th class="tmh">Team</th>`
    + BLOCK_POS.map(p=>`<th>${BLOCK_LABEL[p]}</th>`).join("") + `</tr></thead><tbody>`);
  rows.forEach(r=>{
    s.push(`<tr><td class="tmh"><span class="tm-cell">${avatarHtml(r.id, r.short, 22)}<span>${esc(r.short)}</span></span></td>`
      + r.cells.map(c=>`<td class="bc ${c.status}"><span class="bn">${c.count}</span></td>`).join("")
      + `</tr>`);
  });
  s.push(`</tbody></table></div></div>`);

  // per-team plain-English summary (needs/available at a glance) — still just counts, no analysis
  s.push(`<div class="card"><h2>At a glance</h2><div class="ag-list">`
    + rows.map(r=>{
        const need = r.shortages.length ? `thin at <b>${r.shortages.join(", ")}</b>` : "";
        const deep = r.surpluses.length ? `deep at <b>${r.surpluses.join(", ")}</b>` : "";
        const both = [deep, need].filter(Boolean).join(" · ") || "balanced roster counts";
        return `<div class="ag-row">${avatarHtml(r.id, r.short, 26)}<span class="ag-nm">${esc(r.short)}</span><span class="ag-txt">${both}</span></div>`;
      }).join("")
    + `</div><div class="cap" style="margin-top:10px">Start a conversation with anyone deep where you're thin (and vice-versa). This board just shows the counts — the rest is up to you.</div></div>`);

  el.innerHTML = s.join("");
}

/* ============================ LOAD / SHELL ============================ */
async function load(){
  const status=document.getElementById("status"), errbox=document.getElementById("errbox");
  errbox.innerHTML=""; status.textContent="Loading…";
  // banner title = league name (uppercased, styled gold-on-purple); subtitle "League Hub" is static markup.
  document.getElementById("lgTitle").textContent = LEAGUE.name.toUpperCase();
  document.title = `${LEAGUE.name} League Hub`;
  try{
    const res = await providers[LEAGUE.provider].load();
    if(res.authExpired){
      errbox.innerHTML = `<div class="err">🔑 <b>ESPN session expired.</b> The saved cookie no longer works, so live data can't load right now. The league admin needs to refresh <code>ESPN_S2</code> + <code>ESPN_SWID</code> in the Vercel project settings. Everything else here will work again once that's done.</div>`;
      status.textContent=""; return;
    }
    if(res.notConfigured){
      errbox.innerHTML = `<div class="err">⚙️ The ESPN connection isn't configured on the server yet (missing env vars). No data to show until that's set up.</div>`;
      status.textContent=""; return;
    }
    DATA = res;
    document.getElementById("sub").textContent = `${DATA.size} teams · ${DATA.season||LEAGUE.season} · Week ${DATA.week}`;
    paintInsights(); paintPlayoffs(); paintTradeBlock();
    const hhmm = new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    status.textContent = `Updated ${hhmm}`;
    document.getElementById("foot").innerHTML =
      `Live from ESPN on each load / Refresh (an open tab auto-refreshes every ~${Math.round(AUTO_REFRESH_MS/60000*10)/10} min on game days). Points show 0 before kickoff; early-season samples are small. Not affiliated with ESPN.`;
  }catch(e){
    errbox.innerHTML = `<div class="err">Couldn't load the league right now: ${esc(e.message)}. Try Refresh in a moment.</div>`;
    status.textContent="";
  }
}

  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active", x===t));
  document.getElementById("pane-insights").classList.toggle("hide", ACTIVE!=="insights");
  document.getElementById("pane-playoffs").classList.toggle("hide", ACTIVE!=="playoffs");
  document.getElementById("pane-block").classList.toggle("hide", ACTIVE!=="block");
  window.scrollTo({top:0,behavior:"smooth"});
}));
document.getElementById("refreshBtn").addEventListener("click", load);

// optional light auto-refresh so an open tab stays current on game days (re-pulls; does not push)
let AUTO_TIMER = setInterval(()=>{ if(document.getElementById("autoRefresh").checked && !document.hidden) load(); }, AUTO_REFRESH_MS);
document.getElementById("autoRefresh").addEventListener("change", e=>{
  if(!e.target.checked && AUTO_TIMER){ clearInterval(AUTO_TIMER); AUTO_TIMER=null; }
  else if(e.target.checked && !AUTO_TIMER){ AUTO_TIMER=setInterval(()=>{ if(document.getElementById("autoRefresh").checked && !document.hidden) load(); }, AUTO_REFRESH_MS); }
});

load();
</script>
</body>
</html>
