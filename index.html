<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root{--accent:#7A4FB5;--accent-text-dark:#A585D6;--accent-text-light:#5E3796;--brand-gold:#D4AF37}
  /* Royal Crushers Hub on the Box Score family (assets/family.css). Flat fills only: no glow, no drop shadows. */
  b,strong{font-weight:600}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px 48px}

  /* brand band: flat royal purple + gold rule (crest deferred by owner; text wordmark only) */
  header.banner{margin:16px 0 0}
  .banner-inner{background:#3B2466;border-bottom:3px solid var(--brand-gold);padding:16px;display:flex;align-items:center;gap:16px}
  .brand{min-width:0}
  .brand-title{font:600 28px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--brand-gold)}
  @media (min-width:720px){ .brand-title{font-size:40px} }   /* wordmark-only exception, integer px */
  .brand-sub{font:600 12px/1.2 var(--font-display);letter-spacing:.2em;text-transform:uppercase;color:#fff;opacity:.9;margin-top:6px}

  /* app bar under the band: context, freshness, Refresh, Auto, theme */
  .bs-appbar{flex-wrap:wrap;row-gap:4px;padding:6px var(--sp-4);margin:0 0 var(--sp-2)}
  .bs-appbar .ctx{font-size:var(--fs-meta);color:var(--text-2);white-space:nowrap}
  .bs-appbar label{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-meta);color:var(--text-2);min-height:36px;cursor:pointer}
  #mainTabs{margin:0 0 var(--sp-4)}

  .loading{color:var(--text-2);padding:40px 0;text-align:center}
  .note{color:var(--text-2);font-size:var(--fs-meta);text-align:center;padding:16px 0}
  .err{color:var(--down);border:1px solid var(--down);border-radius:var(--r-panel);padding:12px;margin:12px 0;font-size:13px;line-height:1.6}
  .cap{color:var(--text-2);font-size:var(--fs-meta);margin:0 0 var(--sp-2)}
  .cap:last-child{margin-bottom:0}
  .bs-panel-head{flex-wrap:wrap}
  .bs-panel-body .wtabs{margin:0 0 var(--sp-1)}
  .bs-panel-body .bs-table-wrap{margin:0 calc(-1 * var(--sp-3))}
  .bs-panel-body .bs-table-wrap + .cap,.bs-panel-body .cap + .bs-table-wrap{margin-top:var(--sp-2)}
  .bs-seg{margin:0 0 var(--sp-3)}
  .sec-label{margin:var(--sp-4) 0 var(--sp-2)}
  .sec-label:first-child{margin-top:0}

  /* table cells */
  .tm-cell{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .bs-table td.wrap-ok{white-space:normal;min-width:120px;line-height:1.35;padding-top:6px;padding-bottom:6px}
  .bs-table td.lose-side{color:var(--text-2)}
  /* playoffs: a full-width sentence row under a table row (wraps inside 390px instead of scrolling) */
  .bs-table tr.po-main td{border-bottom:0}
  .bs-table tr.po-sub td{white-space:normal;line-height:1.35;height:auto;padding:0 var(--sp-2) 8px}
  .po-text{margin:0 0 var(--sp-2);line-height:1.45}
  .swipe-cue{display:none}
  @media (max-width:519px){
    #mainTabs{flex-wrap:wrap}
    .swipe-cue{display:block;flex-basis:100%;text-align:right}
  }
  .live{color:var(--down)}
  .why{color:var(--text-2);font-size:var(--fs-micro)}
  /* standings: stick1 pins Seed; this pins Team right after it (fixed-width Seed column) */
  .st-table th:first-child,.st-table td:first-child{width:40px;min-width:40px;max-width:40px}
  .st-table th:nth-child(2),.st-table td:nth-child(2){position:sticky;left:40px;z-index:2;background:var(--surface)}
  .st-table thead th:nth-child(2){z-index:3}
  .st-table tbody tr:hover td:nth-child(2){background:var(--surface-2)}
  /* member name: short on phones, "Name (Team)" from 720px */
  .nm-full{display:none}
  @media (min-width:720px){ .nm-short{display:none} .nm-full{display:inline} }

  /* member avatars (round logo, initial fallback) */
  .mav{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:50%;
       overflow:hidden;background:var(--surface-2);border:1px solid var(--border);vertical-align:middle}
  .mav img{width:100%;height:100%;object-fit:cover;display:block}
  .mav-fb{width:100%;height:100%;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text-2)}
  /* player image: headshot -> team logo -> position-color initial (the one sanctioned small fill) */
  .pav{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:50%;
       overflow:hidden;background:var(--surface-2);border:1px solid var(--border);vertical-align:middle}
  .pav img{width:100%;height:100%;object-fit:cover;display:block}
  .pav-fb{width:100%;height:100%;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--surface)}

  .foot{color:var(--text-2);font-size:var(--fs-micro);margin-top:24px;text-align:center}
  .hide{display:none}
</style>

<body>
<div class="wrap">
  <header class="banner">
    <div class="banner-inner">
      <!-- CREST SLOT: deferred by the owner (2026-10-13). Wiring is a separate, owner-gated step; text wordmark only until then. -->
      <div class="brand">
        <div class="brand-title" id="lgTitle">ROYAL CRUSHERS</div>
        <div class="brand-sub">League Hub</div>
      </div>
    </div>
  </header>

  <div class="bs-appbar">
    <span class="ctx" id="sub">Loading…</span>
    <span class="bs-fresh" id="status" role="status"></span>
    <button type="button" class="bs-btn" id="refreshBtn">Refresh</button>
    <label><input type="checkbox" id="autoRefresh" checked> Auto</label>
    <button type="button" class="bs-btn" id="themeBtn">Theme: System</button>
  </div>

  <div class="bs-tabs" role="tablist" aria-label="Sections" id="mainTabs">
    <button type="button" role="tab" id="tab-scores" data-key="scores" aria-controls="pane-scores" aria-selected="true">Scores</button>
    <button type="button" role="tab" id="tab-standings" data-key="standings" aria-controls="pane-standings" aria-selected="false" tabindex="-1">Standings</button>
    <button type="button" role="tab" id="tab-playoffs" data-key="playoffs" aria-controls="pane-playoffs" aria-selected="false" tabindex="-1">Playoffs</button>
    <button type="button" role="tab" id="tab-teams" data-key="teams" aria-controls="pane-teams" aria-selected="false" tabindex="-1">Teams</button>
    <button type="button" role="tab" id="tab-leaders" data-key="leaders" aria-controls="pane-leaders" aria-selected="false" tabindex="-1">Leaders</button>
    <button type="button" role="tab" id="tab-history" data-key="history" aria-controls="pane-history" aria-selected="false" tabindex="-1">History</button>
  </div>

  <div id="errbox"></div>
  <div id="pane-scores" role="tabpanel" aria-labelledby="tab-scores"><div class="loading">Loading…</div></div>
  <div id="pane-standings" role="tabpanel" aria-labelledby="tab-standings" class="hide"><div class="loading">Loading…</div></div>
  <div id="pane-playoffs" role="tabpanel" aria-labelledby="tab-playoffs" class="hide"><div class="loading">Loading…</div></div>
  <div id="pane-teams" role="tabpanel" aria-labelledby="tab-teams" class="hide"><div class="loading">Loading…</div></div>
  <div id="pane-leaders" role="tabpanel" aria-labelledby="tab-leaders" class="hide"><div class="loading">Loading…</div></div>
  <div id="pane-history" role="tabpanel" aria-labelledby="tab-history" class="hide"><div class="loading">Loading…</div></div>

  <div class="foot" id="foot"></div>
</div>

<script>
/* =============================================================================
   League Hub — standalone, shareable, league-FACING. No personal/targeting data.
   Royal Crushers = ESPN via the serverless proxy (cookie stays server-side).
   Provider abstraction: ESPN now, Sleeper (public API, no secret) can drop in later.
   ============================================================================= */

// ---- CONFIG ----
const LEAGUE = {
  provider: "espn",              // "espn" (via proxy) | "sleeper" (direct public API, later)
  id: "963488",                  // Royal Crushers
  season: "2026",
  name: "Royal Crushers",
  // ESPN proxy base: same-origin on the Vercel deploy; absolute fallback for local/other hosts.
  espnProxy: (location.hostname.endsWith("vercel.app") || location.hostname==="localhost")
    ? "/api/espn"
    : "https://fantasy-dashboard-orpin.vercel.app/api/espn",  // fallback to the existing proxy
};

// Real member names keyed by ESPN teamId (id-keyed = immune to team-name edits).
// Reconciled against the live 963488 team list: id 17 "Mr. Beer's Boys" = Zach, id 13 "5" = Evan.
const MEMBER = {
  1:"Seth", 2:"Riley", 5:"Nick", 6:"Henry", 7:"Bobby", 8:"Thor",
  12:"Ben", 13:"Evan", 15:"Charlie", 16:"Isaac", 17:"Zach", 18:"Chet",
};
// member logo files copied into assets/logos/ (lowercase firstname + "logo"; Evan is .jpg, rest .png).
const MEMBER_LOGO = {
  "Ben":"benlogo.png","Bobby":"bobbylogo.png","Charlie":"charlielogo.png","Chet":"chetlogo.png",
  "Evan":"Evanlogo.jpg","Henry":"henrylogo.png","Isaac":"isaaclogo.png","Nick":"nicklogo.png",
  "Riley":"rileylogo.png","Seth":"sethlogo.png","Thor":"thorlogo.png","Zach":"zachlogo.png",
};
// display: "Name (Team Name)" when mapped, else the ESPN team name (never blank).
function memberName(id, teamName){ const n = MEMBER[id]; return n ? `${n} (${teamName})` : teamName; }
function memberShort(id, teamName){ return MEMBER[id] || teamName; }
function logoFor(id){ const n = MEMBER[id]; const f = n && MEMBER_LOGO[n]; return f ? `assets/logos/${f}` : null; }
// small round avatar: member logo if present, else initials circle. `label` = name shown for initials fallback.
function avatarHtml(id, label, size){
  const url = logoFor(id); const px = size||24;
  const initial = esc((String(label||"?").trim()[0]||"?").toUpperCase());
  if(url) return `<span class="mav" style="width:${px}px;height:${px}px"><img src="${url}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="mav-fb" style="display:none">${initial}</span></span>`;
  return `<span class="mav" style="width:${px}px;height:${px}px"><span class="mav-fb" style="display:flex">${initial}</span></span>`;
}

// player image: ESPN headshot (by player id) -> NFL team logo (by abbrev) -> position-colored initial.
// Chained onerror so a missing headshot falls back to the team logo, then to a clean initial (never a broken img).
const POS_COLOR = {QB:"var(--pos-qb)",RB:"var(--pos-rb)",WR:"var(--pos-wr)",TE:"var(--pos-te)",DEF:"var(--pos-def)",K:"var(--pos-k)"};
function playerImgHtml(pid, team, pos, size){
  const px = size||18;
  const abbr = (team||"").toLowerCase();
  // D/ST "players" have negative ids and no headshot (a 404 every time): go straight to the team logo
  const head = (pid && !String(pid).startsWith("-")) ? `https://a.espncdn.com/i/headshots/nfl/players/full/${encodeURIComponent(pid)}.png` : "";
  const logo = abbr ? `https://a.espncdn.com/i/teamlogos/nfl/500/${encodeURIComponent(abbr)}.png` : "";
  const initial = esc((String(pos||"?").trim()[0]||"?").toUpperCase());
  const color = POS_COLOR[pos] || "var(--pos-k)";
  const fb = `<span class="pav-fb" aria-hidden="true" style="display:none;background:${color}">${initial}</span>`;
  // build the onerror chain: headshot -> team logo -> initial
  if(head){
    const onErr = logo
      ? `this.onerror=function(){this.style.display='none';this.parentNode.querySelector('.pav-fb').style.display='flex'};this.src='${logo}'`
      : `this.style.display='none';this.parentNode.querySelector('.pav-fb').style.display='flex'`;
    return `<span class="pav" style="width:${px}px;height:${px}px"><img src="${head}" alt="" loading="lazy" onerror="${onErr}">${fb}</span>`;
  }
  if(logo){
    return `<span class="pav" style="width:${px}px;height:${px}px"><img src="${logo}" alt="" loading="lazy" onerror="this.style.display='none';this.parentNode.querySelector('.pav-fb').style.display='flex'">${fb}</span>`;
  }
  return `<span class="pav" style="width:${px}px;height:${px}px"><span class="pav-fb" aria-hidden="true" style="display:flex;background:${color}">${initial}</span></span>`;
}

// auto-refresh: light poll so an open tab stays current on game days (does NOT push; re-pulls on interval)
const AUTO_REFRESH_MS = 150000; // 2.5 min

// ESPN maps (same as the dashboard's proven normalization)
const SLOT = {0:"QB",1:"TQB",2:"RB",3:"RB/WR",4:"WR",5:"WR/TE",6:"TE",7:"OP",8:"DT",9:"DE",
  10:"LB",11:"DL",12:"CB",13:"S",14:"DB",15:"DP",16:"D/ST",17:"K",18:"P",19:"HC",20:"BN",21:"IR",23:"FLEX",24:"ER"};
const POS = {1:"QB",2:"RB",3:"WR",4:"TE",5:"K",16:"DEF"};
const PRO = {0:"FA",1:"ATL",2:"BUF",3:"CHI",4:"CIN",5:"CLE",6:"DAL",7:"DEN",8:"DET",9:"GB",10:"TEN",
  11:"IND",12:"KC",13:"LV",14:"LAR",15:"MIA",16:"MIN",17:"NE",18:"NO",19:"NYG",20:"NYJ",21:"PHI",
  22:"ARI",23:"PIT",24:"LAC",25:"SF",26:"SEA",27:"TB",28:"WSH",29:"CAR",30:"JAX",33:"BAL",34:"HOU"};
const STARTABLE_POS = ["QB","RB","WR","TE","K","DEF"];

let DATA = null;
let ENGINE = null;   // playoff engine output for DATA (see playoffEngine; computed after the first paint)
let ACTIVE = "scores";

async function jraw(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pts(n){ return (Math.round((n||0)*10)/10).toFixed(1); }

/* ---------- provider: ESPN (via proxy) ---------- */
const providers = {};
providers.espn = (function(){
  function teamName(t){ return (t.name || `${t.location||""} ${t.nickname||""}`.trim() || ("Team "+t.id)); }
  const recOf = t => { const o=(t.record&&t.record.overall)||{}; return {w:o.wins||0,l:o.losses||0,t:o.ties||0}; };
  const pf = t => (t.record&&t.record.overall&&t.record.overall.pointsFor)||0;
  const pa = t => (t.record&&t.record.overall&&t.record.overall.pointsAgainst)||0;

  // actual points a player scored in a specific week (source 0 = actual, split 1 = weekly). null if none.
  function weekActual(p, wk){
    if(!p.stats) return null;
    const s = p.stats.find(x=>x.statSourceId===0 && x.statSplitTypeId===1 && x.scoringPeriodId===wk);
    return s ? Math.round((s.appliedTotal||0)*10)/10 : null;
  }
  function playerOf(entry, curWeek){
    const p = (entry.playerPoolEntry && entry.playerPoolEntry.player) || entry.player || {};
    // appliedStatTotal is the LATEST scoring period's points, NOT a season total (the default mRoster
    // only carries one weekly line). It used to feed "season PPG" = latest week (bug fixed 2026-10-13).
    const applied = (entry.playerPoolEntry && entry.playerPoolEntry.appliedStatTotal) || 0;
    const stats = p.stats||[];
    // ESPN's own season line: source 0 = actual, split 0 = season. appliedTotal = season pts,
    // stats["210"] = games played, appliedAverage = season PPG (= appliedTotal / games).
    const seas = stats.find(s=>s.statSourceId===0 && s.statSplitTypeId===0 && s.seasonId===Number(LEAGUE.season));
    // ESPN's projection for the current week (source 1 = projected, split 1 = weekly). Labeled as ESPN's.
    let projWk = 0;
    stats.forEach(s=>{ if(s.statSourceId===1 && s.statSplitTypeId===1 && s.scoringPeriodId===curWeek) projWk += (s.appliedTotal||0); });
    // per-week actual points map for every week this player has a stat line
    const byWeek = {};
    stats.forEach(s=>{ if(s.statSourceId===0 && s.statSplitTypeId===1 && s.scoringPeriodId!=null) byWeek[s.scoringPeriodId] = Math.round((s.appliedTotal||0)*10)/10; });
    return { id:String(p.id||entry.playerId||""), name:p.fullName||("id "+(entry.playerId||"?")),
             pos: POS[p.defaultPositionId]||"?", team: PRO[p.proTeamId]||"",
             eligible: (p.eligibleSlots||[]).slice(),          // raw slot ids the player can fill
             slot: SLOT[entry.lineupSlotId] || String(entry.lineupSlotId),
             slotId: entry.lineupSlotId,
             starter: SLOT[entry.lineupSlotId]!=="BN" && SLOT[entry.lineupSlotId]!=="IR",
             onIR: SLOT[entry.lineupSlotId]==="IR",
             latestPts: applied,                               // latest scoring period only (NOT season)
             seasonPts: seas ? (seas.appliedTotal||0) : 0,     // ESPN season total
             gp: seas && seas.stats ? (seas.stats["210"]||0) : 0, // ESPN games played
             seasonPPG: seas ? (seas.appliedAverage||0) : 0,   // ESPN season points per game
             projWk: Math.round(projWk*10)/10,                 // ESPN projection, current week
             byWeek };                                         // {week: actualPts}
  }
  function buildTeam(t, curWeek){
    const entries = ((t.roster||{}).entries)||[];
    const players = entries.map(e=>playerOf(e, curWeek));
    const tn = teamName(t);
    const starters = players.filter(p=>p.starter);           // starter = lineupSlotId not BN(20) / IR(21)
    const sim = t.currentSimulationResults;
    return {
      id: t.id, name: tn, disp: memberName(t.id, tn), short: memberShort(t.id, tn),
      record: recOf(t), pf: pf(t), pa: pa(t),
      moves: (t.transactionCounter&&t.transactionCounter.acquisitions)||0,
      players,
      starters,
      bench: players.filter(p=>!p.starter && !p.onIR),
      // ESPN's projected starters total for the current week (labeled as ESPN's wherever shown)
      projTeam: Math.round(starters.reduce((a,p)=>a+(p.projWk||0),0)*10)/10,
      // ESPN's own playoff odds (fraction 0..1 as ESPN sends it) and ESPN's current seed
      espnPlayoffPct: (sim && sim.playoffPct!=null) ? sim.playoffPct : null,
      espnSeedRank: t.playoffSeed!=null ? t.playoffSeed : null,
      // Identity: the client keys members by ESPN team id (MEMBER map), never by ESPN owner ids.
      // The proxy hashes team.owners / primaryOwner to "m" + 10 hex (api/espn.js sanitize), and the
      // same ESPN owner id always hashes the same, so History (FEAT-004) uses that hash as the cross-season
      // owner key (team ids get reused across seasons). data.members carries only hashed ids.
      owners: (t.owners||[]).slice(),
    };
  }

  async function load(){
    const url = `${LEAGUE.espnProxy}?league=${encodeURIComponent(LEAGUE.id)}&season=${encodeURIComponent(LEAGUE.season)}`
      + `&view=mTeam&view=mRoster&view=mMatchup&view=mSettings&view=mStandings&view=mSchedule`;
    const d = await jraw(url);
    if(d && d.error){
      if(d.error==="espn_auth_expired") return { authExpired:true };
      if(d.error==="server_not_configured") return { notConfigured:true };
      throw new Error(d.message || d.error);
    }
    const settings = d.settings||{};
    const sched = settings.scheduleSettings || {};
    const regWeeks = sched.matchupPeriodCount || 14;
    const playoffTeams = sched.playoffTeamCount || 6;
    // playoff rounds = matchup periods after the regular season (3 = Wk15-17); byes = 2^rounds - playoff teams
    const playoffRounds = Object.keys(sched.matchupPeriods||{}).filter(k=>parseInt(k,10) > regWeeks).length;
    const byes = playoffRounds ? Math.max(0, Math.pow(2, playoffRounds) - playoffTeams) : 0;
    const seedingRule = sched.playoffSeedingRule || null;   // e.g. "TOTAL_POINTS_SCORED" (the sim + clinch math assume it)
    const week = (d.status && d.status.currentMatchupPeriod) || d.scoringPeriodId || 1;
    const teams = (d.teams||[]).map(t=>buildTeam(t, week));
    const byId = {}; teams.forEach(t=>byId[t.id]=t);

    // lineup slot config (slotId -> count) for the exact optimal-lineup solve. Only slots with count>0
    // that aren't bench/IR are startable slots.
    const slotCounts = (settings.rosterSettings && settings.rosterSettings.lineupSlotCounts) || {};
    const startSlots = []; // list of startable slotIds, one entry per slot (e.g. RB appears twice if 2 RB)
    Object.keys(slotCounts).forEach(sid=>{
      const id = Number(sid), n = slotCounts[sid]||0, lbl = SLOT[id];
      if(n>0 && lbl!=="BN" && lbl!=="IR") for(let i=0;i<n;i++) startSlots.push(id);
    });

    // Live-score fix: ESPN leaves matchup totalPoints=0 for the current week until it FINALIZES (Tue after MNF),
    // even though games have been played. For the current/in-progress week, compute each team's live score by
    // summing its STARTERS' applied points from rosterForMatchupPeriod (excludes bench=20/IR=21). Prefer
    // totalPoints when >0 so it auto-heals once ESPN finalizes.
    function liveSideScore(side){
      const tp = side.totalPoints || 0;
      if(tp > 0) return { pts: tp, computed:false };            // finalized/populated -> trust it
      const rost = side.rosterForMatchupPeriod || side.rosterForCurrentScoringPeriod;
      const entries = (rost && rost.entries) || [];
      if(!entries.length) return { pts: 0, computed:false };
      let sum = 0;
      for(const e of entries){
        if(e.lineupSlotId===20 || e.lineupSlotId===21) continue;  // exclude bench / IR
        sum += (e.playerPoolEntry && e.playerPoolEntry.appliedStatTotal) || 0;
      }
      return { pts: Math.round(sum*10)/10, computed: sum>0 };     // computed live total from starters
    }
    // games from schedule; winner from ESPN when set; scores prefer totalPoints, else computed-from-starters.
    const games = (d.schedule||[]).filter(g=>g.home&&g.away&&g.home.teamId!=null&&g.away.teamId!=null).map(g=>{
      const h = liveSideScore(g.home), a = liveSideScore(g.away);
      const finalized = (g.winner==="HOME" || g.winner==="AWAY" || g.winner==="TIE") && (g.home.totalPoints>0 || g.away.totalPoints>0);
      return {
        period: g.matchupPeriodId,
        homeId: g.home.teamId, awayId: g.away.teamId,
        homePts: h.pts, awayPts: a.pts,
        winner: g.winner,  // "HOME" | "AWAY" | "UNDECIDED"
        // live = scores exist (played) but ESPN hasn't finalized totalPoints yet (computed from starters)
        live: (h.computed || a.computed) && !finalized,
        finalized,
      };
    });

    return {
      provider:"espn", name: settings.name || LEAGUE.name, size: settings.size || teams.length,
      week, regWeeks, playoffStart: regWeeks+1, playoffTeams, playoffRounds, byes, seedingRule,
      startSlots,
      teams, byId, games,
    };
  }

  // One week's rosters AS OF that scoring period (scoringPeriodId=N), so a player is credited to the team that
  // had him THAT week, plus each player's actual points that week. The default mRoster only carries the latest
  // week's lines, which is why the old top-scorers table was empty for earlier weeks.
  async function loadWeekRoster(wk){
    const url = `${LEAGUE.espnProxy}?league=${encodeURIComponent(LEAGUE.id)}&season=${encodeURIComponent(LEAGUE.season)}`
      + `&view=mRoster&scoringPeriodId=${encodeURIComponent(wk)}`;
    const d = await jraw(url);
    if(d && d.error) throw new Error(d.message || d.error);
    const rows = [];
    (d.teams||[]).forEach(t=>{
      (((t.roster||{}).entries)||[]).forEach(e=>{
        const p = (e.playerPoolEntry && e.playerPoolEntry.player) || e.player || {};
        const wp = weekActual(p, wk);
        if(wp==null) return;
        rows.push({ teamId:t.id, id:String(p.id||e.playerId||""), name:p.fullName||("id "+(e.playerId||"?")),
                    pos: POS[p.defaultPositionId]||"?", team: PRO[p.proTeamId]||"", pts:wp });
      });
    });
    return rows;
  }
  return { load, loadWeekRoster };
})();

// completed games only (a game with a winner set, or a period before the current week)
function completedGames(D){ return D.games.filter(g=>(g.winner==="HOME"||g.winner==="AWAY") || g.period < D.week); }

// plain standings: W-L order, points-for tiebreaker (no "power" editorializing)
function standingsList(D){
  return D.teams.slice().sort((a,b)=> (b.record.w-a.record.w) || (b.pf-a.pf))
    .map((t,i)=>({ rank:i+1, id:t.id, disp:t.disp, pf:t.pf, rec:t.record }));
}

// which completed weeks have games (for the week tabs)
function completedWeeks(D){
  const set = new Set(completedGames(D).map(g=>g.period));
  return [...set].sort((a,b)=>a-b);
}

// games for a specific week, with margin + winner/loser resolved
function weekGames(D, wk){
  return D.games.filter(g=>g.period===wk).map(g=>{
    const homeWon = g.homePts>g.awayPts, tie = g.homePts===g.awayPts;
    return {
      period:wk, homeId:g.homeId, awayId:g.awayId, homePts:g.homePts, awayPts:g.awayPts,
      margin: Math.round(Math.abs(g.homePts-g.awayPts)*10)/10, tie,
      winId: tie?null:(homeWon?g.homeId:g.awayId), loseId: tie?null:(homeWon?g.awayId:g.homeId),
      winPts: Math.max(g.homePts,g.awayPts), losePts: Math.min(g.homePts,g.awayPts),
      live: !!g.live, finalized: !!g.finalized,
    };
  });
}

// margin- + league-context-aware superlatives for ONE week
function weekSuperlatives(D, wk){
  const games = weekGames(D, wk).filter(g=>(g.homePts||g.awayPts)>0);
  if(!games.length) return null;
  // per-team scores this week
  const scores = [];
  games.forEach(g=>{
    scores.push({ id:g.homeId, pts:g.homePts, won:g.homePts>g.awayPts, opp:g.awayPts, margin:g.margin });
    scores.push({ id:g.awayId, pts:g.awayPts, won:g.awayPts>g.homePts, opp:g.homePts, margin:g.margin });
  });
  const ptsList = scores.map(s=>s.pts).sort((a,b)=>a-b);
  const median = ptsList[Math.floor(ptsList.length/2)];
  const rankOf = p => scores.filter(s=>s.pts>p).length + 1; // 1 = highest that week
  const n = scores.length;

  const byPts = scores.slice().sort((a,b)=>b.pts-a.pts);
  const high = byPts[0], low = byPts[byPts.length-1];
  const blowout = games.slice().sort((a,b)=>b.margin-a.margin)[0];
  const nailbiter = games.slice().sort((a,b)=>a.margin-b.margin)[0];

  const others = n - 1;  // number of OTHER teams in the league this week (for "N of M other teams")

  // Mutually exclusive pools: UNLUCKY only from losers, LUCKY only from winners. A team plays once/week,
  // so a loser can never be lucky and a winner can never be unlucky. Ties are excluded from both.
  const losers  = scores.filter(s=>!s.won && s.pts!==s.opp);
  const winners = scores.filter(s=> s.won && s.pts!==s.opp);

  // UNLUCKY: the LOSER whose score would have beaten the most OTHER teams this week (i.e. lost despite a
  // league-leading-caliber score). wouldBeat = how many of the other teams' scores it topped.
  let unlucky=null;
  if(losers.length){
    unlucky = losers.map(s=>{
      const wouldBeat = scores.filter(o=>o.id!==s.id && o.pts < s.pts).length;
      const isTopScore = s.pts === high.pts;      // scored the most in the whole league but still lost
      return { id:s.id, pts:s.pts, wouldBeat, others, isTopScore };
    }).sort((a,b)=> b.wouldBeat-a.wouldBeat || b.pts-a.pts)[0];
  }
  // LUCKY: the WINNER whose score was topped by the most OTHER teams this week (won despite a low score).
  // wouldLose = how many other teams outscored them; outscored = how many they beat.
  let lucky=null;
  if(winners.length){
    lucky = winners.map(s=>{
      const wouldLose  = scores.filter(o=>o.id!==s.id && o.pts > s.pts).length;
      const outscored  = scores.filter(o=>o.id!==s.id && o.pts < s.pts).length;
      return { id:s.id, pts:s.pts, wouldLose, outscored, others };
    }).sort((a,b)=> b.wouldLose-a.wouldLose || a.pts-b.pts)[0];
  }
  return { high, low, blowout, nailbiter, unlucky, lucky, median };
}

// NOTE: "Points Left on the Bench" was REMOVED in v3. A truly-exact figure needs each week's
// HISTORICAL started lineup, but ESPN's mRoster only exposes the CURRENT roster (which churns via
// adds/drops/lineup changes), so a past week's optimal-vs-actual can't be computed exactly. Per the
// "exact or gone" rule, it's gone rather than shipping a misleading approximation.

// games played + season PPG come straight from ESPN's season line (see playerOf), not from byWeek
// (the default mRoster only carries the latest week, which made "season PPG" = latest week's points).
function playerGames(p){ return p.gp||0; }
function playerPPG(p){ return p.seasonPPG||0; }

// Positional Leaders (season): top 3 per position BY ESPN season PPG, minimum games played =
// ceil(completed weeks / 2) so a one-game fluke can't lead. Rostered players only (ESPN league rosters).
function positionalLeaders(D){
  const byPos = {};  // pos -> [{id, pos, player, team, ownerId, owner, gp, total, ppg}]
  const minGames = Math.max(1, Math.ceil((D.week-1)/2));
  D.teams.forEach(t=>t.players.forEach(p=>{
    if(!STARTABLE_POS.includes(p.pos)) return;
    if(playerGames(p) < minGames) return;
    (byPos[p.pos]=byPos[p.pos]||[]).push({ id:p.id, pos:p.pos, player:p.name, team:p.team, ownerId:t.id, owner:t.short,
      gp:playerGames(p), total:p.seasonPts||0, ppg:playerPPG(p) });
  }));
  Object.keys(byPos).forEach(P=>{ byPos[P].sort((a,b)=> (b.ppg-a.ppg) || (b.total-a.total)); byPos[P] = byPos[P].slice(0,3); });
  return { byPos, minGames };
}

// Top-3 scorers per position for ONE week, from that week's rosters (loadWeekRoster): rows already carry the
// week's points and the team that rostered the player that week.
function weekTopScorers(rows){
  const byPos = {};  // pos -> [{id, pos, player, team, ownerId, pts}]
  (rows||[]).forEach(r=>{
    if(!STARTABLE_POS.includes(r.pos)) return;
    (byPos[r.pos]=byPos[r.pos]||[]).push({ id:r.id, pos:r.pos, player:r.name, team:r.team, ownerId:r.teamId, pts:r.pts });
  });
  Object.keys(byPos).forEach(P=>{ byPos[P].sort((a,b)=>b.pts-a.pts); byPos[P]=byPos[P].slice(0,3); });
  return byPos;
}

const POS_LABEL = {QB:"QB",RB:"RB",WR:"WR",TE:"TE",DEF:"D/ST",K:"K"};
const POS_ORDER = ["QB","RB","WR","TE","K","DEF"];

// which week the Scores tab is showing (null = default: the latest week that has scores)
let VIEW_WEEK = null;
let LOAD_SEQ = 0;            // bumps on every successful load(); the live week's rosters refetch per load
const WEEK_TOP = {};         // wk -> {state:"loading"|"ok"|"err", rows, seq}: per-week roster fetches, cached

// latest regular-season week with ANY scores (live or final); on Tue/Wed that is last week, not the empty current one
function latestScoredWeek(D){
  let best = 0;
  D.games.forEach(g=>{ if(g.period<=D.regWeeks && g.period<=D.week && (g.homePts||g.awayPts)>0 && g.period>best) best = g.period; });
  return best || D.week;
}

// this week's roster fetch: past weeks are fetched once and kept; the current (live) week refetches on each load
function weekTopEntry(wk){
  const D = DATA, e = WEEK_TOP[wk];
  const prov = providers[LEAGUE.provider];
  if(!prov.loadWeekRoster) return null;
  const stale = !e || (e.state!=="loading" && e.seq!==LOAD_SEQ && (e.state==="err" || wk >= D.week));
  if(!stale) return e;
  const ne = WEEK_TOP[wk] = { state:"loading", rows: e ? e.rows : null, seq: LOAD_SEQ };
  prov.loadWeekRoster(wk)
    .then(rows=>{ ne.state = "ok"; ne.rows = rows; }, err=>{ ne.state = "err"; console.warn("Week "+wk+" rosters:", err); })
    .then(()=> fillWeekTop(wk));
  return ne;
}
function fillWeekTop(wk){
  const el = document.getElementById("scTop");
  if(el && el.dataset.wk===String(wk)) el.innerHTML = weekTopHtml(wk);
}
function weekTopHtml(wk){
  const D = DATA, e = WEEK_TOP[wk];
  const live = wk===D.week ? " (live)" : "";
  const head = `<h3 class="bs-micro sec-label">Week ${wk} top scorers${live}</h3>`;
  if(!e || !e.rows){
    return head + `<p class="cap">${e && e.state==="err" ? `Couldn't load Week ${wk}'s rosters. Try Refresh.` : `Loading Week ${wk} top scorers…`}</p>`;
  }
  const tops = weekTopScorers(e.rows);
  const order = ["QB","RB","WR","TE","DEF","K"].filter(p=>tops[p] && tops[p].length);
  if(!order.length) return head + `<p class="cap">No player scores for Week ${wk} yet.</p>`;
  const shortOf = id => D.byId[id]?.short || "—";
  return head
    + `<p class="cap">Top 3 per position among rostered players (started or benched), credited to the team that had them in Week ${wk}.</p>`
    + `<div class="bs-table-wrap"><table class="bs-table"><thead><tr><th scope="col">Pos</th><th class="num" scope="col">#</th><th scope="col">Player</th>`
    + `<th scope="col">Owner</th><th class="num" scope="col">Pts</th></tr></thead><tbody>`
    + order.map(P=> tops[P].map((x,i)=>`<tr><td><span class="pos-${P}">${POS_LABEL[P]}</span></td><td class="num">${i+1}</td>`
        + `<td><span class="tm-cell">${playerImgHtml(x.id,x.team,x.pos,20)}<span>${esc(x.player)}</span></span></td>`
        + `<td>${esc(shortOf(x.ownerId))}</td><td class="num">${pts(x.pts)}</td></tr>`).join("")).join("")
    + `</tbody></table></div>`;
}

/* ============================ SCORES ============================ */
function paintScores(){
  const D = DATA; const el = document.getElementById("pane-scores");
  if(!D){ el.innerHTML = `<div class="note">No data.</div>`; return; }
  const s = [];
  const shortOf = id => D.byId[id]?.short || "—";

  // week tabs for ALL regular-season weeks; default = the latest week that has scores
  const allWeeks = []; for(let w=1; w<=D.regWeeks; w++) allWeeks.push(w);
  if(VIEW_WEEK==null || !allWeeks.includes(VIEW_WEEK)) VIEW_WEEK = latestScoredWeek(D);
  const wk = VIEW_WEEK;
  const isCurrent = wk === D.week;
  const isFuture = wk > D.week;

  const weekTabs = weekTabsHtml("scWtabs", "scWk-", "scWeekPane", allWeeks, wk, D.week);

  const wgAll = weekGames(D, wk);
  const wgScored = wgAll.filter(g=>(g.homePts||g.awayPts)>0);
  const anyScores = wgScored.length>0;

  // results table: Away · score · Home · score · status. Winner in --text, loser in --text-2, margin as a micro-label.
  // Per-game status: LIVE (computed from starters, not yet finalized) vs FINAL (ESPN finalized totalPoints).
  function resultRow(g){
    const scored = (g.homePts||g.awayPts)>0;
    const homeWins = scored && !g.tie && g.homePts>g.awayPts;
    const awayWins = scored && !g.tie && g.awayPts>g.homePts;
    const cls = (won, lost) => won ? "" : (lost ? " lose-side" : "");
    const st = g.finalized ? `<span class="bs-micro">FINAL</span>`
             : g.live ? `<span class="bs-micro live">● LIVE</span>` : (scored ? "" : `<span class="bs-micro">—</span>`);
    const mov = scored ? (g.tie ? ` <span class="bs-micro">tie</span>` : ` <span class="bs-micro">+${pts(g.margin)}</span>`) : "";
    return `<tr>
      <td class="${cls(awayWins, homeWins).trim()}">${esc(shortOf(g.awayId))}</td>
      <td class="num${cls(awayWins, homeWins)}">${scored?pts(g.awayPts):"—"}</td>
      <td class="${cls(homeWins, awayWins).trim()}">${esc(shortOf(g.homeId))}</td>
      <td class="num${cls(homeWins, awayWins)}">${scored?pts(g.homePts):"—"}</td>
      <td>${st}${mov}</td></tr>`;
  }
  const resultsTable = rowsHtml => `<div class="bs-table-wrap"><table class="bs-table"><thead><tr><th scope="col">Away</th><th class="num" scope="col">Pts</th>
      <th scope="col">Home</th><th class="num" scope="col">Pts</th><th scope="col">Status</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`;

  let weekBody;
  if(isFuture || !anyScores){
    weekBody = `<p class="cap">${isFuture?`Week ${wk} schedule.`:`No scores yet for Week ${wk}.`}</p>` + resultsTable(wgAll.map(resultRow).join(""));
  } else {
    const anyLive = wgScored.some(g=>g.live);
    const liveNote = anyLive
      ? `<p class="cap"><span class="live">● LIVE</span> scores are summed from starters until ESPN finalizes the week (Tuesday). Players yet to kick off show 0.</p>`
      : "";
    weekBody = liveNote + resultsTable(wgScored.map(resultRow).join(""));
  }

  // per-week superlatives (margin- + context-aware) — compact table, only when there are real scores
  const sup = anyScores ? weekSuperlatives(D, wk) : null;
  let supHtml = "";
  if(sup){
    const row=(cls,k,v,d)=>`<tr><td><span class="bs-micro${cls?" "+cls:""}">${k}</span></td><td>${esc(v)}</td><td class="wrap-ok">${esc(d)}</td></tr>`;
    supHtml = `<h3 class="bs-micro sec-label">Week ${wk} superlatives${isCurrent?" (live)":""}</h3>`
      + `<div class="bs-table-wrap"><table class="bs-table"><thead><tr><th scope="col">Award</th><th scope="col">Team</th><th scope="col">Detail</th></tr></thead><tbody>`
      + row("bs-up","Highest scorer", shortOf(sup.high.id), `${pts(sup.high.pts)} pts`)
      + row("bs-down","Lowest scorer", shortOf(sup.low.id), `${pts(sup.low.pts)} pts`)
      + row("","Biggest blowout", shortOf(sup.blowout.winId), `beat ${shortOf(sup.blowout.loseId)} by ${pts(sup.blowout.margin)}`)
      + row("","Closest game", shortOf(sup.nailbiter.winId), `won by ${pts(sup.nailbiter.margin)} over ${shortOf(sup.nailbiter.loseId)}`)
      + (sup.unlucky ? row("bs-warn","Unlucky", shortOf(sup.unlucky.id),
          sup.unlucky.isTopScore
            ? `${pts(sup.unlucky.pts)} pts, most in the league, and lost`
            : `${pts(sup.unlucky.pts)} pts and lost; would've beaten ${sup.unlucky.wouldBeat} of ${sup.unlucky.others} other teams`) : "")
      + (sup.lucky ? row("bs-warn","Lucky", shortOf(sup.lucky.id),
          `won with ${pts(sup.lucky.pts)} pts; outscored only ${sup.lucky.outscored} of ${sup.lucky.others} other teams`) : "")
      + `</tbody></table></div>`;
  }

  // top 3 per position for the selected week, from that week's rosters (fetched on demand, cached per week)
  let topHtml = "";
  if(anyScores && weekTopEntry(wk)) topHtml = `<div id="scTop" data-wk="${wk}">${weekTopHtml(wk)}</div>`;

  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">Scores</h2><span class="bs-meta">Week ${wk}${isCurrent?" (this week)":""}</span></div><div class="bs-panel-body">${weekTabs}</div>`);
  // single week tabpanel: everything scoped to the selected week (results, superlatives, top scorers)
  s.push(`<div class="bs-panel-body" id="scWeekPane" role="tabpanel" aria-labelledby="scWk-${wk}" tabindex="0">${weekBody}${supHtml}${topHtml}</div></section>`);

  el.innerHTML = s.join("");

  // wire week tabs (repaint keeps keyboard focus on the newly selected week)
  const wt = document.getElementById("scWtabs");
  if(wt) wireTabs(wt, k=>{
    const hadFocus = wt.contains(document.activeElement);
    VIEW_WEEK = Number(k); paintScores(); writeHash();
    if(hadFocus) document.getElementById("scWk-"+k)?.focus();
  });
}

// week tablist (1..regWeeks) as real tab buttons in a scroll-snap row; current week carries aria-current="date".
function weekTabsHtml(listId, idPrefix, paneId, weeks, sel, cur){

// Current streak for one team from completed games, newest first: "W3" / "L1" / "T1", "—" before any game.
// No winner (e.g. "UNDECIDED" past weeks) + unequal points -> the higher score wins, matching weekGames().
function streakOf(D, teamId){
  const gs = completedGames(D).filter(g=>(g.homeId===teamId||g.awayId===teamId) && !(g.homePts===0 && g.awayPts===0))
    .sort((a,b)=>b.period-a.period);
  let kind = null, n = 0;
  for(const g of gs){
    const home = g.homeId===teamId;
    let r;
    if(g.winner==="HOME") r = home?"W":"L";
    else if(g.winner==="AWAY") r = home?"L":"W";
    else if(g.winner==="TIE" || g.homePts===g.awayPts) r = "T";
    else r = (g.homePts>g.awayPts) === home ? "W" : "L";
    if(kind===null) kind = r;
    if(r!==kind) break;
    n++;
  }
  return kind ? kind+n : "—";
}

/* ============================ PLAYOFF SCENARIOS ============================ */

// standings sorted by W, then points-for tiebreaker
function standings(D){
  return D.teams.slice().sort((a,b)=> (b.record.w-a.record.w) || (b.pf-a.pf))
    .map((t,i)=>({ seed:i+1, id:t.id, name:t.disp, w:t.record.w, l:t.record.l, t:t.record.t, pf:t.pf }));
}

/* ============================ PLAYOFF ENGINE ============================ */
// Proposal section 3 (hub overhaul, 2026-10-13). Pure functions over DATA; nothing here fetches. Inputs are
// ESPN league data only, plus ESPN's own current-week projected starter totals (team.projTeam), which are
// labeled as ESPN's wherever they show. Replaces the old #1-seed race, Playoff-Spot race and Stakes tab.

const SIM_N = 10000;          // simulated seasons per data load
const ODDS_ENUM_CAP = 18;     // exact 2^k enumeration once <= 18 regular-season games remain (2^18 = 262144)

const winsOf = t => t.record.w + 0.5*t.record.t;             // H2H wins, a tie counts half
const recStr = r => `${r.w}-${r.l}${r.t?"-"+r.t:""}`;
const fmtW = x => Number.isInteger(x) ? String(x) : x.toFixed(1);
const ordinal = n => n + ((n%100>=11 && n%100<=13) ? "th" : ({1:"st",2:"nd",3:"rd"}[n%10] || "th"));
function signed1(x){ const v = Math.round(x*10)/10; return v===0 ? "0.0" : (v>0?"+":"\u2212") + Math.abs(v).toFixed(1); }
// whole percent; "<1%" / ">99%" at the extremes. oddsTxt lets the exact clinch/elim math override the sim.
function pc(p){ if(p==null) return "—"; const v = Math.round(p*100); return v>=100 ? ">99%" : v<=0 ? "<1%" : v+"%"; }
function oddsTxt(p, c){ if(c && c.clinchedIn) return "100%"; if(c && c.eliminated) return "0%"; return pc(p); }

// a completed regular-season game: before the current week and scored (live in-progress scores never count)
const isDoneReg = (D, g) => g.period < D.week && g.period <= D.regWeeks && (g.homePts||g.awayPts) > 0;

// {teamId: [weekly scores, oldest first]} for completed regular-season weeks
function completedWeekScores(D){
  const out = {}; D.teams.forEach(t=> out[t.id] = []);
  D.games.filter(g=>isDoneReg(D, g)).sort((a,b)=>a.period-b.period).forEach(g=>{
    if(out[g.homeId]) out[g.homeId].push(g.homePts);
    if(out[g.awayId]) out[g.awayId].push(g.awayPts);
  });
  return out;
}

// per team: PF/game, all-play record (each week vs all 11 others, 0.5 for equal), expected wins
// (sum of teams beaten / 11 per week), luck = actual wins - expected wins, last-3 average, mean.
function teamStrength(D){
  const scores = completedWeekScores(D);
  const weekMap = {};   // {week: {teamId: pts}}
  D.games.filter(g=>isDoneReg(D, g)).forEach(g=>{
    const m = weekMap[g.period] = weekMap[g.period] || {};
    m[g.homeId] = g.homePts; m[g.awayId] = g.awayPts;
  });
  const out = {};
  D.teams.forEach(t=>{
    const sc = scores[t.id], n = sc.length;
    let aw = 0, al = 0, expW = 0;
    Object.values(weekMap).forEach(m=>{
      const mine = m[t.id]; if(mine==null) return;
      let beat = 0, opp = 0;
      Object.keys(m).forEach(k=>{ if(Number(k)===t.id) return; opp++; beat += mine>m[k] ? 1 : (mine===m[k] ? 0.5 : 0); });
      aw += beat; al += opp - beat; if(opp) expW += beat/opp;
    });
    const sum = sc.reduce((a,b)=>a+b, 0), l3 = sc.slice(-3);
    out[t.id] = { n, scores:sc, mean: n ? sum/n : 0, pfg: n ? t.pf/n : 0,
      allplayW:aw, allplayL:al, expW, luck: winsOf(t) - expW,
      last3: l3.length ? l3.reduce((a,b)=>a+b, 0)/l3.length : null };
  });
  return out;
}

// every remaining regular-season game (current week .. last regular week), indices into D.teams
function remainingGames(D){
  const ix = {}; D.teams.forEach((t,i)=> ix[t.id] = i);
  return D.games
    .filter(g=> g.period>=D.week && g.period<=D.regWeeks && ix[g.homeId]!=null && ix[g.awayId]!=null)
    .sort((a,b)=> (a.period-b.period) || (a.homeId-b.homeId))
    .map(g=>({ wk:g.period, homeIx:ix[g.homeId], awayIx:ix[g.awayId], homeId:g.homeId, awayId:g.awayId }));
}

// remaining strength of schedule: mean PF/game of each remaining opponent (one entry per game); rank 1 = easiest
function sosRemaining(D, str){
  str = str || teamStrength(D);
  const acc = {}; D.teams.forEach(t=> acc[t.id] = { sum:0, n:0 });
  remainingGames(D).forEach(g=>{
    acc[g.homeId].sum += str[g.awayId].pfg; acc[g.homeId].n++;
    acc[g.awayId].sum += str[g.homeId].pfg; acc[g.awayId].n++;
  });
  const out = {}; D.teams.forEach(t=>{ const a = acc[t.id]; out[t.id] = { opp: a.n ? a.sum/a.n : null, games:a.n, rank:null }; });
  D.teams.filter(t=>out[t.id].opp!=null).sort((a,b)=> (out[a.id].opp - out[b.id].opp) || (a.id-b.id))
    .forEach((t,i)=> out[t.id].rank = i+1);
  return out;
}

// seeded PRNG (mulberry32) + Box-Muller normals: same inputs -> identical odds on every load
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function normalSource(rand){
  let spare = null;
  return function(){
    if(spare!==null){ const z = spare; spare = null; return z; }
    let u = 0; while(u===0) u = rand();
    const v = rand(), r = Math.sqrt(-2*Math.log(u));
    spare = r*Math.sin(2*Math.PI*v);
    return r*Math.cos(2*Math.PI*v);
  };
}

// Monte Carlo of the rest of the regular season (proposal 3.3). Returns null before 2 completed weeks.
function monteCarlo(D, str){
  str = str || teamStrength(D);
  const T = D.teams, NT = T.length;
  if(NT < 2) return null;
  const n = Math.min(...T.map(t=>str[t.id].n));            // completed weeks
  if(n < 2) return null;
  // 1. week-to-week noise: pooled within-team SD
  let ss = 0, cnt = 0, total = 0;
  T.forEach(t=>{ const x = str[t.id]; x.scores.forEach(v=>{ ss += (v-x.mean)*(v-x.mean); cnt++; total += v; }); });
  const sigma = Math.sqrt(ss / Math.max(1, cnt - NT));
  const L = total / cnt;                                     // league mean of all completed team-scores
  // 2. shrinkage: tau^2 = how much of the spread in averages is skill; K = clamp(sigma^2/tau^2, 2, 12)
  const means = T.map(t=>str[t.id].mean), mBar = means.reduce((a,b)=>a+b, 0)/NT;
  const varM = means.reduce((a,m)=>a+(m-mBar)*(m-mBar), 0)/(NT-1);
  const tau2 = Math.max(1e-6, varM - sigma*sigma/n);
  const K = Math.min(12, Math.max(2, sigma*sigma/tau2));
  const mu = Float64Array.from(T, t=>(n*str[t.id].mean + K*L)/(n+K));
  // 3. strength uncertainty per simulated season
  const sdTheta = sigma/Math.sqrt(n+K);
  // 4. ESPN's projected starters total, blended 50/50 into the CURRENT week only (0 = none -> theta alone)
  const proj = Float64Array.from(T, t=> t.projTeam>0 ? t.projTeam : 0);
  const rem = remainingGames(D), G = rem.length;
  const gH = Int32Array.from(rem, g=>g.homeIx), gA = Int32Array.from(rem, g=>g.awayIx);
  const gCur = Uint8Array.from(rem, g=> g.wk===D.week ? 1 : 0);
  const baseW = Float64Array.from(T, winsOf), basePF = Float64Array.from(T, t=>t.pf);
  const gLeft = new Int32Array(NT); rem.forEach(g=>{ gLeft[g.homeIx]++; gLeft[g.awayIx]++; });
  const P = D.playoffTeams, B = D.byes || 0;
  const maxG = Math.max(0, ...gLeft), NW = maxG + 1;
  const norm = normalSource(mulberry32(Number(LEAGUE.season)*100 + D.week));
  const inCnt = new Uint32Array(NT), seedHist = new Uint32Array(NT*NT), sumW = new Float64Array(NT);
  const cond = new Uint32Array(G*2*NT), homeWins = new Uint32Array(G);   // P(t in | home / away wins g)
  const needIn = new Uint32Array(NT*NW), needAll = new Uint32Array(NT*NW); // by the team's own remaining wins
  const theta = new Float64Array(NT), w = new Float64Array(NT), pf = new Float64Array(NT), myW = new Int32Array(NT);
  const hw = new Uint8Array(G), order = new Int32Array(NT);
  const t0 = performance.now();
  for(let s=0; s<SIM_N; s++){
    for(let i=0; i<NT; i++){ theta[i] = mu[i] + sdTheta*norm(); w[i] = baseW[i]; pf[i] = basePF[i]; myW[i] = 0; }
    // 5. each remaining game: score ~ Normal(game mean, sigma) per side, higher score wins, scores add to PF
    for(let g=0; g<G; g++){
      const h = gH[g], a = gA[g];
      const mh = (gCur[g] && proj[h]>0) ? 0.5*theta[h] + 0.5*proj[h] : theta[h];
      const ma = (gCur[g] && proj[a]>0) ? 0.5*theta[a] + 0.5*proj[a] : theta[a];
      const sh = mh + sigma*norm(), sa = ma + sigma*norm();
      pf[h] += sh; pf[a] += sa;
      if(sh >= sa){ w[h]++; myW[h]++; hw[g] = 1; homeWins[g]++; } else { w[a]++; myW[a]++; hw[g] = 0; }
    }
    // 6. final order: wins desc, then PF desc (TOTAL_POINTS_SCORED); insertion sort over 12 teams
    for(let i=0; i<NT; i++){
      order[i] = i;
      for(let j=i; j>0; j--){
        const y = order[j], x = order[j-1];
        if(w[y] > w[x] || (w[y]===w[x] && pf[y] > pf[x])){ order[j-1] = y; order[j] = x; } else break;
      }
    }
    // 8. accumulate seeds, wins, and the per-game conditional counters in the same pass
    for(let r=0; r<NT; r++){ const i = order[r]; seedHist[i*NT + r]++; if(r < P) inCnt[i]++; }
    for(let i=0; i<NT; i++){ sumW[i] += myW[i]; needAll[i*NW + myW[i]]++; }
    for(let r=0; r<P; r++){ const i = order[r]; needIn[i*NW + myW[i]]++; }
    for(let g=0; g<G; g++){ const base = (g*2 + (hw[g] ? 0 : 1))*NT; for(let r=0; r<P; r++) cond[base + order[r]]++; }
  }
  const simMs = performance.now() - t0;
  const ix = {}; T.forEach((t,i)=> ix[t.id] = i);
  const teams = {};
  T.forEach((t,i)=>{
    const seedDist = []; for(let r=0; r<NT; r++) seedDist.push(seedHist[i*NT + r]/SIM_N);
    let pBye = 0; for(let r=0; r<B; r++) pBye += seedDist[r];
    const need = []; for(let k=0; k<=gLeft[i]; k++){ const a = needAll[i*NW + k]; need.push({ n:a, p: a ? needIn[i*NW + k]/a : null }); }
    const mW = sumW[i]/SIM_N;
    teams[t.id] = { pIn: inCnt[i]/SIM_N, pBye, seedDist, need, gLeft: gLeft[i],
      projW: baseW[i] + mW, projL: t.record.l + 0.5*t.record.t + gLeft[i] - mW, mu: mu[i] };
  });
  return { N:SIM_N, NT, n, sigma, K, L, sdTheta, simMs, rem, ix, cond, homeWins, teams };
}

// P(team makes the playoffs | remaining game gi goes to home (homeWon=true) or away). null if never sampled.
function condIn(mc, gi, teamId, homeWon){
  const i = mc.ix[teamId]; if(i==null) return null;
  const den = homeWon ? mc.homeWins[gi] : mc.N - mc.homeWins[gi];
  return den ? mc.cond[(gi*2 + (homeWon ? 0 : 1))*mc.NT + i]/den : null;
}

// Exact clinch / elimination (proposal 3.4), never from the sim. A tie in wins at the line is UNDECIDED
// (clinch needs strict >, elimination strict <) because future points-for is unknown.
function clinchMath(D){
  const T = D.teams, NT = T.length, P = D.playoffTeams, B = D.byes || 0;
  const rem = remainingGames(D);
  const W = {}, G = {};
  T.forEach(t=>{ W[t.id] = winsOf(t); G[t.id] = 0; });
  rem.forEach(g=>{ G[g.homeId]++; G[g.awayId]++; });
  const kth = (vals, k) => { const v = vals.slice().sort((a,b)=>b-a); return (k>=1 && k<=v.length) ? v[k-1] : -Infinity; };
  const out = {};
  if(!rem.length){   // regular season over: the final order decides
    standings(D).forEach((r,i)=>{ out[r.id] = { W:W[r.id], G:0, clinchedIn:i<P, eliminated:i>=P,
      clinchedBye:i<B, byeGone:i>=B, magic:null, elimNum:null }; });
    return { byId:out, exact:true };
  }
  T.forEach(t=>{
    const others = T.filter(o=>o.id!==t.id);
    const oCeil = others.map(o=>W[o.id]+G[o.id]), oNow = others.map(o=>W[o.id]);
    const Wi = W[t.id], Gi = G[t.id];
    const ceilP = kth(oCeil, P), nowP = kth(oNow, P);         // the 7th-best OTHER team: ceiling / today
    const r = { W:Wi, G:Gi, clinchedIn: Wi > ceilP, eliminated: Wi + Gi < nowP,
      clinchedBye: B>0 && Wi > kth(oCeil, B), byeGone: B>0 && Wi + Gi < kth(oNow, B), magic:null, elimNum:null };
    for(let m=0; m<=Gi; m++){ if(Wi + m > ceilP){ r.magic = m; break; } }          // wins that clinch regardless
    for(let x=0; x<=Gi; x++){ if(Wi + Gi - x < nowP){ r.elimNum = x; break; } }     // losses that end it regardless
    out[t.id] = r;
  });
  let exact = false;
  if(rem.length <= ODDS_ENUM_CAP){
    // late season: enumerate all 2^k outcomes (the loop carried over from the retired oddsSwing()). Catches
    // cases the bounds miss, e.g. two chasers who play each other can't both win.
    exact = true;
    const ids = T.map(t=>t.id), w = new Float64Array(NT), base = Float64Array.from(ids, id=>W[id]);
    const allIn = new Uint8Array(NT).fill(1), allOut = new Uint8Array(NT).fill(1);
    const allBye = new Uint8Array(NT).fill(1), noBye = new Uint8Array(NT).fill(1);
    const combos = 1 << rem.length;
    for(let mask=0; mask<combos; mask++){
      w.set(base);
      for(let i=0; i<rem.length; i++){ const g = rem[i]; if(mask & (1<<i)) w[g.homeIx]++; else w[g.awayIx]++; }
      for(let i=0; i<NT; i++){
        let above = 0, level = 0;
        for(let j=0; j<NT; j++){ if(j===i) continue; if(w[j] > w[i]) above++; else if(w[j]===w[i]) level++; }
        if(above + level >= P) allIn[i] = 0;   // wins-ties resolved against i: i could miss
        if(above < P) allOut[i] = 0;           // wins-ties resolved for i: i could get in
        if(B>0){ if(above + level >= B) allBye[i] = 0; if(above < B) noBye[i] = 0; }
      }
    }
    ids.forEach((id,i)=>{
      const r = out[id];
      r.clinchedIn = r.clinchedIn || !!allIn[i]; r.eliminated = r.eliminated || !!allOut[i];
      if(B>0){ r.clinchedBye = r.clinchedBye || !!allBye[i]; r.byeGone = r.byeGone || !!noBye[i]; }
    });
  }
  T.forEach(t=>{ const r = out[t.id]; if(r.clinchedIn) r.magic = 0; if(r.eliminated) r.elimNum = 0; });
  return { byId:out, exact };
}

// Badges (proposal 3.5): one rule, by games from the line. BUBBLE = undecided and within 1 game either side.
const BADGE = { bye:{label:"BYE",cls:"bs-up"}, clinched:{label:"CLINCHED",cls:"bs-up"}, in:{label:"IN",cls:"bs-up"},
  bubble:{label:"BUBBLE",cls:"bs-warn"}, out:{label:"OUT",cls:"bs-dim"}, elim:{label:"ELIMINATED",cls:"bs-down"} };
function badgeHtml(b){ return `<span class="bs-tag ${b.cls}">${b.label}</span>`; }
function playoffBadges(D, cm){
  const st = standings(D), P = D.playoffTeams;
  const Wd = r => r.w + 0.5*(r.t||0);
  const W7 = st[P-1] ? Wd(st[P-1]) : 0, W8 = st[P] ? Wd(st[P]) : W7;
  const byId = {};
  st.forEach((r,i)=>{
    const c = cm.byId[r.id], Wi = Wd(r), inNow = i < P;
    const gap = inNow ? Wi - W8 : W7 - Wi;                 // in: games over the first team out; out: games back
    let key;
    if(c.clinchedBye) key = "bye"; else if(c.clinchedIn) key = "clinched"; else if(c.eliminated) key = "elim";
    else key = gap > 1 ? (inNow ? "in" : "out") : "bubble";
    byId[r.id] = { key, label:BADGE[key].label, cls:BADGE[key].cls, seed:i+1, inNow, gap,
      line: gap===0 ? "0, on points" : inNow ? `+${fmtW(gap)}` : `${fmtW(gap)} back` };
  });
  return { byId, W7, W8 };
}

// everything the Playoffs tab (and the Status badges) need, computed once per data load
function playoffEngine(D){
  const t0 = performance.now();
  const str = teamStrength(D), sos = sosRemaining(D, str), cm = clinchMath(D), bd = playoffBadges(D, cm);
  const mc = D.week >= 3 ? monteCarlo(D, str) : null;     // odds from Week 3 on (two weeks of scores)
  return { week:D.week, str, sos, cm:cm.byId, exact:cm.exact, bd, mc, rem: remainingGames(D), ms: performance.now()-t0 };
}

// This week's Stakes: current-week games sorted by swing = |odds if win - odds if lose|, both teams added.
function stakesThisWeek(D, E){
  const mc = E.mc; if(!mc) return [];
  const sh = id => D.byId[id]?.short || "—";
  const P = D.playoffTeams, seedOf = id => E.bd.byId[id]?.seed;
  const rows = [];
  mc.rem.forEach((g,gi)=>{
    if(g.wk!==D.week) return;
    const h = { id:g.homeId, win:condIn(mc,gi,g.homeId,true), lose:condIn(mc,gi,g.homeId,false) };
    const a = { id:g.awayId, win:condIn(mc,gi,g.awayId,false), lose:condIn(mc,gi,g.awayId,true) };
    if([h.win,h.lose,a.win,a.lose].some(x=>x==null)) return;
    h.sw = Math.abs(h.win-h.lose); a.sw = Math.abs(a.win-a.lose);
    let third = null;   // biggest move for a team NOT in this game
    D.teams.forEach(t=>{
      if(t.id===g.homeId || t.id===g.awayId) return;
      const ph = condIn(mc,gi,t.id,true), pa = condIn(mc,gi,t.id,false);
      if(ph==null || pa==null) return;
      const d = Math.abs(ph-pa); if(!third || d > third.d) third = { id:t.id, ph, pa, d };
    });
    rows.push({ gi, homeId:g.homeId, awayId:g.awayId, home:h, away:a, swing: Math.round((h.sw + a.sw)*100), third });
  });
  rows.sort((x,y)=> (y.swing-x.swing) || ((y.home.sw+y.away.sw)-(x.home.sw+x.away.sw)) || (x.gi-y.gi));
  rows.forEach((r,i)=>{
    const [A, Bt] = r.home.sw >= r.away.sw ? [r.home, r.away] : [r.away, r.home];
    const aLine = `${pc(A.win)} with a win, ${pc(A.lose)} with a loss`;
    let s;
    if(i===0) s = `Biggest game of the week. ${sh(A.id)}: ${aLine}.`;
    else if(seedOf(A.id)===P) s = `${sh(A.id)}'s hold on the last spot is on the line: ${aLine}.`;
    else if(seedOf(A.id)===P+1) s = `${sh(A.id)}, the first team out: ${aLine}.`;
    else s = `${sh(A.id)}: ${aLine}.`;
    if(Bt.lose >= 0.9) s += ` ${sh(Bt.id)} is close to safe either way: ${pc(Bt.win)} / ${pc(Bt.lose)}.`;
    else if(Bt.win < 0.25 && Bt.win >= 0.1) s += ` ${sh(Bt.id)} needs it to stay alive: ${pc(Bt.win)} / ${pc(Bt.lose)}.`;
    else s += ` ${sh(Bt.id)}: ${pc(Bt.win)} / ${pc(Bt.lose)}.`;
    if(r.third && Math.round(r.third.d*100) > 4)
      s += ` Also matters to ${sh(r.third.id)}: ${pc(r.third.ph)} if ${sh(r.homeId)} wins, ${pc(r.third.pa)} if ${sh(r.awayId)} wins.`;
    r.sentence = s; r.firstId = A.id; r.secondId = Bt.id;
  });
  return rows;
}

// one bubble card's text: record + seed, schedule rank, form/luck when notable, odds, this week's game,
// and the biggest remaining game by the team's own swing (when it isn't this week's).
function bubbleSentence(D, E, id, topGi){
  const mc = E.mc, b = E.bd.byId[id], x = E.str[id], so = E.sos[id], t = D.byId[id];
  const P = D.playoffTeams, NT = D.teams.length, nm = t.short, sh = k => D.byId[k]?.short || "—";
  const out = [];
  if(b.seed===P && b.gap===0) out.push(`${nm} is ${recStr(t.record)} and holds the last spot on points.`);
  else if(b.seed===P+1) out.push(`${nm} is ${recStr(t.record)}, the first team out.`);
  else out.push(`${nm} is ${recStr(t.record)} (seed ${b.seed}).`);
  if(so.rank!=null){
    const r = so.rank, opp = pts(so.opp);
    let sch;
    if(r===1) sch = `The easiest remaining schedule in the league (opponents avg ${opp})`;
    else if(r<=3) sch = `The ${ordinal(r)}-easiest schedule left (opponents avg ${opp})`;
    else if(r===NT) sch = `The hardest remaining schedule in the league (opponents avg ${opp})`;
    else if(r>=NT-2) sch = `The ${ordinal(NT-r+1)}-hardest schedule left (rank ${r} of ${NT}, opponents avg ${opp})`;
    else sch = `A middle-of-the-pack schedule left (rank ${r} of ${NT}, opponents avg ${opp})`;
    const notes = [];
    if(x.last3!=null && Math.abs(x.last3 - x.pfg) >= 10) notes.push(`${pts(x.last3)} a game over the last 3`);
    if(Math.abs(x.luck) >= 1) notes.push(`${fmtW(Math.round(Math.abs(x.luck)*10)/10)} wins ${x.luck>0?"luckier":"unluckier"} than the all-play record`);
    out.push(sch + (notes.length ? " and " + notes.join(" and ") : "") + ".");
  }
  out.push(`${oddsTxt(mc.teams[id].pIn, E.cm[id])} to make it.`);
  let best = null, cur = null;
  mc.rem.forEach((g,gi)=>{
    if(g.homeId!==id && g.awayId!==id) return;
    const home = g.homeId===id, win = condIn(mc,gi,id,home), lose = condIn(mc,gi,id,!home);
    if(win==null || lose==null) return;
    const y = { gi, wk:g.wk, opp: home ? g.awayId : g.homeId, win, lose, sw: Math.abs(win-lose) };
    if(g.wk===D.week) cur = y;
    if(!best || y.sw > best.sw) best = y;
  });
  if(cur) out.push(cur.gi===topGi
    ? `This week vs ${sh(cur.opp)} is the biggest game of the week: ${pc(cur.win)} with a win, ${pc(cur.lose)} with a loss.`
    : `This week vs ${sh(cur.opp)}: ${pc(cur.win)} with a win, ${pc(cur.lose)} with a loss.`);
  if(best && (!cur || best.gi!==cur.gi)) out.push(`Biggest game left: Week ${best.wk} vs ${sh(best.opp)} (${pc(best.win)} / ${pc(best.lose)}).`);
  return out.join(" ");
}

// "Usually in (80%+) with N more wins of G", from the sims, by the team's own remaining wins
function needLine(mc, id){
  const T = mc.teams[id]; if(!T) return null;
  const k = T.need.findIndex(v=>v.n>=100 && v.p>=0.8);
  if(k<0) return null;
  return k===0 ? `Usually in (80%+) even losing out.` : `Usually in (80%+) with ${k} more win${k===1?"":"s"} of ${T.gLeft}.`;
}

  // ---- 4. Team strength (all teams): both odds columns, labeled Hub and ESPN ----
  s.push(`<section class="bs-panel" id="po-teams"><div class="bs-panel-head"><h2 class="bs-h2">Team strength</h2><span class="bs-meta">Playoff odds: Hub = this page's simulation · ESPN = ESPN's own</span></div>`);
  if(!E) s.push(`<div class="bs-panel-body"><p class="cap">${pending}</p></div>`);
  else {
    const th = (label, title, num) => `<th${num===false?"":' class="num"'} scope="col"${title?` title="${esc(title)}"`:""}>${label}</th>`;
    s.push(`<div class="bs-table-wrap"><table class="bs-table bs-table--stick1"><thead><tr>`
      + th("Team", "", false) + th("W-L") + th("PF/g", "Points for per game")

      + (B ? th("Bye (Hub)", "Odds of the #1 seed and the bye, from the Hub simulation") : "")
      + th("Proj W-L", "Average final record across the Hub simulations")

      + th(`ESPN proj Wk ${D.week}`, "ESPN's projected points for this week's starters (blended into this week's games only)")
      + `</tr></thead><tbody>`
      + st.map(r=>{
          const id = r.id, x = E.str[id], so = E.sos[id], c = E.cm[id], m = mc ? mc.teams[id] : null, t = D.byId[id];
          const espn = t.espnPlayoffPct!=null ? Math.round(t.espnPlayoffPct*100)+"%" : "—";
          const co = c.clinchedIn ? "Clinched" : c.eliminated ? "Eliminated"
            : c.magic!=null ? `${c.magic} W` : c.elimNum!=null ? `${c.elimNum} L` : "—";
          return `<tr><td>${teamCell(id, r.seed)}</td><td class="num">${recStr(r)}</td><td class="num">${pts(x.pfg)}</td>`
            + `<td class="num">${fmtW(x.allplayW)}-${fmtW(x.allplayL)}</td><td class="num">${signed1(x.luck)}</td>`
            + `<td class="num">${x.last3!=null ? pts(x.last3) : "—"}</td>`
            + `<td class="num">${so.opp!=null ? `${pts(so.opp)} (${so.rank})` : "—"}</td>`

            + (B ? `<td class="num">${m ? (c.clinchedBye ? "100%" : c.byeGone ? "0%" : pc(m.pBye)) : "—"}</td>` : "")
            + `<td class="num">${m ? `${m.projW.toFixed(1)}-${m.projL.toFixed(1)}` : "—"}</td>`

        }).join("")
      + `</tbody></table></div>`);
    const rule = D.seedingRule;
    s.push(`<div class="bs-panel-body"><p class="cap">All-play: your record if you played all ${D.size-1} other teams every week. Luck: actual wins minus all-play expected wins. SOS left: remaining opponents' points per game, rank 1 = easiest. Clinch / Out: W = wins that clinch a spot no matter what, L = losses that end it.</p>`
      + (rule && rule!=="TOTAL_POINTS_SCORED"
          ? `<p class="cap">Tiebreak: ${esc(rule)} (the Hub's clinch math assumes total points for).</p>`

  // ---- 5. How this works (collapsed) ----
  s.push(`<section class="bs-panel"><div class="bs-panel-body"><details class="bs-details"><summary>How this works</summary>`
    + `<p class="cap">Odds come from playing out the rest of the regular season 10,000 times. Each team's weekly score is drawn around its season average, pulled toward the league average early on, with ESPN's projections mixed in for this week only.</p>`
    + `<p class="cap">Ties in record go to total points for, like ESPN. Clinched and eliminated are exact math, not simulations.</p>`
    + `<p class="cap">The numbers stay the same all week and update when ESPN finalizes scores.</p>`
    + `</details></div></section>`);

  el.innerHTML = s.join("");
}

// The playoff engine runs AFTER the first paint (standings render first, odds fill in), on the first load and
// then only when its inputs change: records, points for, or the set of finalized games (engineSig). An
// auto-refresh with nothing new keeps the same ENGINE, so the odds don't re-run every 2.5 minutes.
let ENGINE_TIMER = null;
let ENGINE_SIG = null;
function engineSig(D){
  return D.week + "|" + D.teams.map(t=>`${t.id}:${t.record.w}-${t.record.l}-${t.record.t}:${t.pf}`).join(",")
    + "|" + D.games.filter(g=>g.finalized).length;
}
function runPlayoffEngine(){
  clearTimeout(ENGINE_TIMER);
  ENGINE_TIMER = setTimeout(()=>{
    if(!DATA) return;
    const sig = engineSig(DATA);
    try{ ENGINE = playoffEngine(DATA); ENGINE_SIG = sig; }
    catch(e){ console.error("Playoff engine failed:", e); return; }
    paintPlayoffs(); paintStandings();
    scrollToPlayoffSub();
  }, 0);
}

/* ============================ TRADE BLOCK (simple surplus/shortage counts) ============================ */
// Factual only: rostered COUNT per position vs Royal Crushers' startable need. No values, no rankings.
// Starting slots: QB, RB, RB, WR, WR, TE, FLEX, D/ST, K. FLEX is RB/WR/TE eligible.
const BLOCK_POS = ["QB","RB","WR","TE","DEF","K"];
const BLOCK_LABEL = { QB:"QB", RB:"RB", WR:"WR", TE:"TE", DEF:"D/ST", K:"K" };
// base starting requirement per position (dedicated slots only); FLEX handled separately across RB/WR/TE
const START_NEED = { QB:1, RB:2, WR:2, TE:1, DEF:1, K:1 };
const FLEX_POOL = ["RB","WR","TE"]; // one FLEX slot any of these can fill

// classify one team's count at a position vs need. Returns {count, need, status:'short'|'surplus'|'ok'}
// Consistent rule: SURPLUS when rostered is well above what you can start (startable + 1);
// SHORTAGE when at/below what you must start. K/D-ST (single slot, no depth expectation) = 1 is fine.
function blockStatus(pos, count){
  const need = START_NEED[pos] || 0;
  const flexEligible = FLEX_POOL.includes(pos);
  // K + D/ST: carrying 1 is normal → short only at 0, surplus at 3+ (hoarding).
  if(!flexEligible && (pos==="K" || pos==="DEF")){
    if(count === 0) return { count, need, status:"short" };
    if(count >= 3)  return { count, need, status:"surplus" };
    return { count, need, status:"ok" };
  }
  // "startable" = dedicated starting slots + (a share of the 1 FLEX for flex-eligible positions).
  const startable = need + (flexEligible ? 1 : 0);
  // SURPLUS = clearly more than you can start (one past startable). TE: need1+flex1=2 → 3+ = surplus. RB/WR: 4+.
  if(count >= startable + 1) return { count, need, status:"surplus" };
  // SHORTAGE = at/below what you must start (no depth). QB1 → 1 flagged thin; TE1 → 1 thin; RB2 → ≤2 thin.
  if(count <= need) return { count, need, status:"short" };
  return { count, need, status:"ok" };
}

function paintTradeBlock(){
  const D = DATA; const el = document.getElementById("pane-block");
  if(!D){ el.innerHTML = `<div class="note">No data.</div>`; return; }

  // count rostered players per position per team (plain counts, no weighting)
  const rows = D.teams.slice().sort((a,b)=> (b.record.w-a.record.w)||(b.pf-a.pf)).map(t=>{
    const cnt = {}; BLOCK_POS.forEach(p=>cnt[p]=0);
    t.players.forEach(p=>{ if(cnt[p.pos]!=null) cnt[p.pos]++; });
    const cells = BLOCK_POS.map(p=>({ pos:p, ...blockStatus(p, cnt[p]) }));
    return { id:t.id, disp:t.disp, short:t.short, cells,
             shortages: cells.filter(c=>c.status==="short").map(c=>BLOCK_LABEL[c.pos]),
             surpluses: cells.filter(c=>c.status==="surplus").map(c=>BLOCK_LABEL[c.pos]) };
  });

  const s = [];
  const CNT_CLS = { surplus:"bs-up", short:"bs-down", ok:"" };
  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">Trade Block: who's deep, who's thin</h2></div><div class="bs-panel-body">
    <p class="cap">Roster counts vs starting slots (QB, RB×2, WR×2, TE, FLEX, D/ST, K). Surplus: more than you can start. Shortage: at or below what you must start. Counts only, from live rosters.</p>
    <p class="cap"><span class="bs-up">Surplus</span> · <span class="bs-down">Shortage</span> · OK</p>`);

  // grid: team rows, position columns
  s.push(`<div class="bs-table-wrap"><table class="bs-table bs-table--stick1"><thead><tr><th scope="col">Team</th>`
    + BLOCK_POS.map(p=>`<th class="num" scope="col">${BLOCK_LABEL[p]}</th>`).join("") + `</tr></thead><tbody>`);
  rows.forEach(r=>{
    s.push(`<tr><td><span class="tm-cell">${avatarHtml(r.id, r.short, 22)}<span>${esc(r.short)}</span></span></td>`
      + r.cells.map(c=>`<td class="num"><span class="${CNT_CLS[c.status]}">${c.count}</span></td>`).join("")
      + `</tr>`);
  });
  s.push(`</tbody></table></div></div></section>`);

  // per-team plain-English summary (needs/available at a glance) — still just counts, no analysis
  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">At a glance</h2></div>`
    + `<div class="bs-table-wrap"><table class="bs-table"><thead><tr><th scope="col">Team</th><th scope="col">Note</th></tr></thead><tbody>`
    + rows.map(r=>{
        const need = r.shortages.length ? `thin at <b>${r.shortages.join(", ")}</b>` : "";
        const deep = r.surpluses.length ? `deep at <b>${r.surpluses.join(", ")}</b>` : "";
        const both = [deep, need].filter(Boolean).join(" · ") || "balanced roster counts";
        return `<tr><td><span class="tm-cell">${avatarHtml(r.id, r.short, 22)}<span>${esc(r.short)}</span></span></td><td class="wrap-ok">${both}</td></tr>`;
      }).join("")
    + `</tbody></table></div></section>`);

  el.innerHTML = s.join("");
}

/* ============================ LOAD / SHELL ============================ */
async function load(){
  const status=document.getElementById("status"), errbox=document.getElementById("errbox");
  errbox.innerHTML=""; status.textContent="ESPN · loading…";
  // banner title = league name (uppercased, styled gold-on-purple); subtitle "League Hub" is static markup.
  document.getElementById("lgTitle").textContent = LEAGUE.name.toUpperCase();
  document.title = `${LEAGUE.name} League Hub`;
  try{
    const res = await providers[LEAGUE.provider].load();
    if(res.authExpired){
      errbox.innerHTML = `<div class="err"><b>ESPN session expired.</b> The saved cookie no longer works, so live data can't load right now. The league admin needs to refresh <code>ESPN_S2</code> + <code>ESPN_SWID</code> in the Vercel project settings. Everything else here will work again once that's done.</div>`;
      status.textContent="ESPN · couldn't update"; return;
    }
    if(res.notConfigured){
      errbox.innerHTML = `<div class="err">The ESPN connection isn't configured on the server yet (missing env vars). No data to show until that's set up.</div>`;
      status.textContent="ESPN · couldn't update"; return;
    }
    DATA = res; LOAD_SEQ++;
    // re-run the odds only when records / points for / finalized games changed (always on the first load)
    const needEngine = !ENGINE || ENGINE_SIG !== engineSig(DATA);
    if(needEngine) ENGINE = null;
    // first successful load: apply the week/position parts of a shared link (needs D.regWeeks). Auto-refresh keeps in-memory state.
    if(!HASH_APPLIED){ applyHash(readHash()); HASH_APPLIED = true; }
    document.getElementById("sub").textContent = `${DATA.size} teams · ${DATA.season||LEAGUE.season} · Week ${DATA.week}`;
    paintScores(); paintStandings(); paintPlayoffs(); paintLeaders();
    writeHash();
    const hhmm = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    status.textContent = `ESPN · updated ${hhmm}`;
    document.getElementById("foot").textContent = "Not affiliated with ESPN.";
    if(needEngine) runPlayoffEngine();   // odds fill in after the first paint
    else scrollToPlayoffSub();
  }catch(e){
    errbox.innerHTML = `<div class="err">Couldn't load the league right now: ${esc(e.message)}. Try Refresh in a moment.</div>`;
    status.textContent="ESPN · couldn't update";
  }
}

/* ---- theme toggle: System -> Light -> Dark (shared snippet, identical across the three apps) ---- */
// theme-color metas follow the OS via media=; a manual choice overrides both so the browser chrome matches (review N7).
const TC_META=[...document.querySelectorAll('meta[name="theme-color"]')], TC_ORIG=TC_META.map(x=>x.content), TC_BG={light:"#F5F6F8",dark:"#0E1116"};
function applyTheme(m){ const r=document.documentElement; if(m==="light"||m==="dark") r.setAttribute("data-theme",m); else r.removeAttribute("data-theme");
  TC_META.forEach((x,i)=>{ x.content = TC_BG[m] || TC_ORIG[i]; });
  try{ m==="system"?localStorage.removeItem("bs-theme"):localStorage.setItem("bs-theme",m); }catch(e){}
  const b=document.getElementById("themeBtn"); if(b){ b.textContent="Theme: "+m[0].toUpperCase()+m.slice(1); b.setAttribute("aria-label","Color theme: "+m+". Activate to change."); } }
function currentTheme(){ return document.documentElement.getAttribute("data-theme")||"system"; }
document.getElementById("themeBtn").addEventListener("click",()=>{ const o=["system","light","dark"]; applyTheme(o[(o.indexOf(currentTheme())+1)%3]); });
applyTheme(currentTheme());

/* ---- tabs (WAI-ARIA tabs pattern, roving tabindex; shared snippet, identical across the three apps) ---- */
// tablist: element with role="tablist"; onSelect(key) paints + writes the hash. Buttons carry data-key.
function wireTabs(tablist, onSelect){
  const tabs=[...tablist.querySelectorAll('[role="tab"]')];
  tabs.forEach((t,i)=>{
    t.addEventListener("click",()=>onSelect(t.dataset.key));
    t.addEventListener("keydown",e=>{ let j=null;
      if(e.key==="ArrowRight") j=(i+1)%tabs.length; else if(e.key==="ArrowLeft") j=(i-1+tabs.length)%tabs.length;
      else if(e.key==="Home") j=0; else if(e.key==="End") j=tabs.length-1;
      if(j!==null){ e.preventDefault(); tabs[j].focus(); onSelect(tabs[j].dataset.key); } });
  });
}
function setSelectedTab(tablist, key){ tablist.querySelectorAll('[role="tab"]').forEach(t=>{ const on=t.dataset.key===key;
  t.setAttribute("aria-selected", on?"true":"false"); t.tabIndex = on?0:-1; }); }

/* ---- URL-hash state (proposal 4): #scores[/wkN] · #standings · #playoffs[/stakes|bubble|teams] ·
        #teams[/<teamId>] · #leaders[/<POS>] · #history[/<year>]
        Old links still work: #insights[/wkN] -> #scores[/wkN], #stakes -> #playoffs/stakes, #block -> #teams ---- */
const TAB_KEYS = ["scores","standings","playoffs","teams","leaders","history"];
const LEGACY_TAB = { insights:"scores", stakes:"playoffs", block:"teams" };
const PO_SUBS = ["stakes","bubble","teams"];
const HASH_POS = { qb:"QB", rb:"RB", wr:"WR", te:"TE", k:"K", def:"DEF", dst:"DEF" };
let HASH_APPLIED = false;   // week/position segments are applied once, after the first successful load()
let PO_SUB = null;          // Playoffs section to scroll to (#playoffs/<sub>); cleared when the user changes tabs
let PO_SCROLL = false;      // a pending sub-anchor scroll (runs once the Playoffs pane has its content)
let TEAM_SEL = null;        // #teams/<teamId> (painted by the Teams tab, FEAT-004)
let HIST_YEAR = null;       // #history/<year> (painted by the History tab, FEAT-004)
function readHash(){
  const segs = String(location.hash||"").replace(/^#/,"").toLowerCase().split("/").filter(Boolean);
  let tab = segs[0] || "", sub = null;
  if(LEGACY_TAB[tab]){ if(tab==="stakes") sub = "stakes"; tab = LEGACY_TAB[tab]; }
  if(!TAB_KEYS.includes(tab)) tab = "scores";
  let wk = null, pos = null, teamId = null, year = null;
  segs.slice(1).forEach(x=>{
    const m = /^wk(\d{1,2})$/.exec(x);
    if(m && tab==="scores") wk = Number(m[1]);
    else if(tab==="playoffs" && PO_SUBS.includes(x)) sub = x;
    else if(tab==="leaders" && HASH_POS[x]) pos = HASH_POS[x];
    else if(tab==="teams" && /^\d{1,3}$/.test(x)) teamId = Number(x);
    else if(tab==="history" && /^\d{4}$/.test(x)) year = Number(x);
  });
  if(tab!=="playoffs") sub = null;
  return { tab, wk, sub, pos, teamId, year };
}
// apply the non-tab parts of a hash; out-of-range values are ignored (the tabs then use their defaults).
// Only touch a value when the hash carries one (an in-page "#scores" link must not reset a picked week).
function applyHash(h){
  if(h.tab==="playoffs"){ PO_SUB = h.sub; PO_SCROLL = !!h.sub; }
  if(h.tab==="teams" && h.teamId!=null) TEAM_SEL = h.teamId;
  if(h.tab==="history" && h.year!=null) HIST_YEAR = h.year;
  if(h.tab==="leaders" && h.pos) LEAD_POS = h.pos;
  if(!DATA) return;
  if(h.tab==="scores" && h.wk!=null && h.wk>=1 && h.wk<=DATA.regWeeks) VIEW_WEEK = h.wk;
}
function writeHash(){
  if(!DATA && !HASH_APPLIED) return;           // never wipe a pending link's segments before the first load
  const parts = [ACTIVE];
  if(DATA && ACTIVE==="scores" && VIEW_WEEK!=null && VIEW_WEEK!==latestScoredWeek(DATA)) parts.push("wk"+VIEW_WEEK);
  if(ACTIVE==="playoffs" && PO_SUB) parts.push(PO_SUB);
  if(ACTIVE==="teams" && TEAM_SEL!=null) parts.push(String(TEAM_SEL));
  if(ACTIVE==="leaders" && LEAD_POS!=="all") parts.push(LEAD_POS==="DEF" ? "DST" : LEAD_POS);
  if(ACTIVE==="history" && HIST_YEAR!=null) parts.push(String(HIST_YEAR));
  const h = "#"+parts.join("/");
  try{ if(location.hash!==h) history.replaceState(null, "", h); }catch(e){}
}
// scroll to a Playoffs section once its content is painted: #po-stakes / #po-bubble / #po-teams
function scrollToPlayoffSub(){
  if(!PO_SCROLL || !PO_SUB || ACTIVE!=="playoffs" || !DATA) return;
  const el = document.getElementById("po-"+PO_SUB);
  if(!el) return;
  el.scrollIntoView({block:"start"});
  if(ENGINE) PO_SCROLL = false;   // stay pending until the odds have filled in (the page grows)
}
function selectTab(key, opts){
  if(!TAB_KEYS.includes(key)) key = "scores";
  ACTIVE = key;
  const tl = document.getElementById("mainTabs");
  setSelectedTab(tl, key);
  TAB_KEYS.forEach(k=> document.getElementById("pane-"+k).classList.toggle("hide", k!==key));
  // scroll to the tab bar only when it has scrolled above the viewport
  if(!(opts&&opts.noScroll) && tl.getBoundingClientRect().top < 0) tl.scrollIntoView({block:"start"});
  writeHash();
}
wireTabs(document.getElementById("mainTabs"), k=>{ PO_SUB = null; PO_SCROLL = false; selectTab(k); });
{ const h0 = readHash(); applyHash(h0); selectTab(h0.tab, {noScroll:true}); }
addEventListener("hashchange", ()=>{
  const h = readHash();
  applyHash(h);
  if(DATA){ paintScores(); paintLeaders(); }
  selectTab(h.tab, {noScroll:true});
  scrollToPlayoffSub();
});
document.getElementById("refreshBtn").addEventListener("click", load);

// optional light auto-refresh so an open tab stays current on game days (re-pulls; does not push)
let AUTO_TIMER = setInterval(()=>{ if(document.getElementById("autoRefresh").checked && !document.hidden) load(); }, AUTO_REFRESH_MS);
document.getElementById("autoRefresh").addEventListener("change", e=>{
  if(!e.target.checked && AUTO_TIMER){ clearInterval(AUTO_TIMER); AUTO_TIMER=null; }
  else if(e.target.checked && !AUTO_TIMER){ AUTO_TIMER=setInterval(()=>{ if(document.getElementById("autoRefresh").checked && !document.hidden) load(); }, AUTO_REFRESH_MS); }
});

load();
</script>
