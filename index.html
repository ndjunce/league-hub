<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<script>(function(){try{var t=localStorage.getItem("bs-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>

<title>Royal Crushers League Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">

<style>
  :root{--accent:#7A4FB5;--accent-text-dark:#A585D6;--accent-text-light:#5E3796;--brand-gold:#D4AF37}
  /* Royal Crushers Hub on the Box Score family (assets/family.css). Flat fills only: no glow, no drop shadows. */
  b,strong{font-weight:600}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px 48px}

  /* brand band: flat royal purple + gold rule (crest deferred by owner; text wordmark only) */
  header.banner{margin:16px 0 0}
  .banner-inner{background:#3B2466;border-bottom:3px solid var(--brand-gold);padding:16px;display:flex;align-items:center;gap:16px}
  .brand{min-width:0}
  .brand-title{font:600 28px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--brand-gold)}
  @media (min-width:720px){ .brand-title{font-size:40px} }   /* wordmark-only exception, integer px */
  .brand-sub{font:600 12px/1.2 var(--font-display);letter-spacing:.2em;text-transform:uppercase;color:#fff;opacity:.9;margin-top:6px}

  /* app bar under the band: context, freshness, Refresh, Auto, theme */
  .bs-appbar{flex-wrap:wrap;row-gap:4px;padding:6px var(--sp-4);margin:0 0 var(--sp-2)}
  .bs-appbar .ctx{font-size:var(--fs-meta);color:var(--text-2);white-space:nowrap}
  .bs-appbar label{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-meta);color:var(--text-2);min-height:36px;cursor:pointer}
  #mainTabs{margin:0 0 var(--sp-4)}

  .loading{color:var(--text-2);padding:40px 0;text-align:center}
  .note{color:var(--text-2);font-size:var(--fs-meta);text-align:center;padding:16px 0}
  .err{color:var(--down);border:1px solid var(--down);border-radius:var(--r-panel);padding:12px;margin:12px 0;font-size:13px;line-height:1.6}
  .cap{color:var(--text-2);font-size:var(--fs-meta);margin:0 0 var(--sp-2)}
  .cap:last-child{margin-bottom:0}
  .bs-panel-head{flex-wrap:wrap}
  .bs-panel-body .wtabs{margin:0 0 var(--sp-1)}
  .bs-panel-body .bs-table-wrap{margin:0 calc(-1 * var(--sp-3))}
  .bs-panel-body .bs-table-wrap + .cap,.bs-panel-body .cap + .bs-table-wrap{margin-top:var(--sp-2)}
  .bs-seg{margin:0 0 var(--sp-3)}
  .sec-label{margin:var(--sp-4) 0 var(--sp-2)}
  .sec-label:first-child{margin-top:0}

  /* table cells */
  .tm-cell{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .bs-table td.wrap-ok{white-space:normal;min-width:120px;line-height:1.35;padding-top:6px;padding-bottom:6px}
  .bs-table td.lose-side{color:var(--text-2)}
  /* stakes matchup tables: fixed columns so If win / If lose wrap inside 390px instead of scrolling */
  table.stk-table{table-layout:fixed}
  .stk-table th:first-child{width:30%}
  .stk-table td:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stk-table td.wrap-ok{min-width:0}
  .bs-table tr.seed1 td:first-child{box-shadow:inset 3px 0 0 var(--brand-gold)}
  /* race tables: Path/Gap is its own column on wide screens; below 520px it drops to a full-width
     second row under each team (restores the old .race-need reflow, so nothing clips at 390px) */
  .race-table tr.race-sub{display:none}
  .swipe-cue{display:none}
  @media (max-width:519px){
    .race-table .race-path{display:none}
    .race-table tr.race-sub{display:table-row}
    .race-table tr.race-main td{border-bottom:0}
    .race-table tr.race-sub td{white-space:normal;line-height:1.35;height:auto;padding:0 var(--sp-2) 8px 38px;color:var(--text-2)}
    #mainTabs{flex-wrap:wrap}
    .swipe-cue{display:block;flex-basis:100%;text-align:right}
  }
  .live{color:var(--down)}
  .why{color:var(--text-2);font-size:var(--fs-micro)}

  /* member avatars (round logo, initial fallback) */
  .mav{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:50%;
       overflow:hidden;background:var(--surface-2);border:1px solid var(--border);vertical-align:middle}
  .mav img{width:100%;height:100%;object-fit:cover;display:block}
  .mav-fb{width:100%;height:100%;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text-2)}
  /* player image: headshot -> team logo -> position-color initial (the one sanctioned small fill) */
  .pav{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:50%;
       overflow:hidden;background:var(--surface-2);border:1px solid var(--border);vertical-align:middle}
  .pav img{width:100%;height:100%;object-fit:cover;display:block}
  .pav-fb{width:100%;height:100%;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--surface)}

  .foot{color:var(--text-2);font-size:var(--fs-micro);margin-top:24px;text-align:center}
  .hide{display:none}
</style>

<body>
<div class="wrap">
  <header class="banner">
    <div class="banner-inner">
      <!-- CREST SLOT: deferred by the owner (2026-10-13). Wiring is a separate, owner-gated step; text wordmark only until then. -->
      <div class="brand">
        <div class="brand-title" id="lgTitle">ROYAL CRUSHERS</div>
        <div class="brand-sub">League Hub</div>
      </div>
    </div>
  </header>

  <div class="bs-appbar">
    <span class="ctx" id="sub">Loading…</span>
    <span class="bs-fresh" id="status" role="status"></span>
    <button type="button" class="bs-btn" id="refreshBtn">Refresh</button>
    <label><input type="checkbox" id="autoRefresh" checked> Auto</label>
    <button type="button" class="bs-btn" id="themeBtn">Theme: System</button>
  </div>

  <div class="bs-tabs" role="tablist" aria-label="Sections" id="mainTabs">
    <button type="button" role="tab" id="tab-insights" data-key="insights" aria-controls="pane-insights" aria-selected="true">League Insights</button>
    <button type="button" role="tab" id="tab-stakes" data-key="stakes" aria-controls="pane-stakes" aria-selected="false" tabindex="-1">Stakes</button>
    <button type="button" role="tab" id="tab-playoffs" data-key="playoffs" aria-controls="pane-playoffs" aria-selected="false" tabindex="-1">Playoff Picture</button>

  </div>

  <div id="errbox"></div>
  <div id="pane-insights" role="tabpanel" aria-labelledby="tab-insights"><div class="loading">Loading…</div></div>
  <div id="pane-stakes" role="tabpanel" aria-labelledby="tab-stakes" class="hide"><div class="loading">Loading…</div></div>
  <div id="pane-playoffs" role="tabpanel" aria-labelledby="tab-playoffs" class="hide"><div class="loading">Loading…</div></div>
  <div id="pane-block" role="tabpanel" aria-labelledby="tab-block" class="hide"><div class="loading">Loading…</div></div>

  <div class="foot" id="foot"></div>
</div>

<script>
/* =============================================================================
   League Hub — standalone, shareable, league-FACING. No personal/targeting data.
   Royal Crushers = ESPN via the serverless proxy (cookie stays server-side).
   Provider abstraction: ESPN now, Sleeper (public API, no secret) can drop in later.
   ============================================================================= */

// ---- CONFIG ----
const LEAGUE = {
  provider: "espn",              // "espn" (via proxy) | "sleeper" (direct public API, later)
  id: "963488",                  // Royal Crushers
  season: "2026",
  name: "Royal Crushers",
  // ESPN proxy base: same-origin on the Vercel deploy; absolute fallback for local/other hosts.
  espnProxy: (location.hostname.endsWith("vercel.app") || location.hostname==="localhost")
    ? "/api/espn"
    : "https://fantasy-dashboard-orpin.vercel.app/api/espn",  // fallback to the existing proxy
};

// Real member names keyed by ESPN teamId (id-keyed = immune to team-name edits).
// Reconciled against the live 963488 team list: id 17 "Mr. Beer's Boys" = Zach, id 13 "5" = Evan.
const MEMBER = {
  1:"Seth", 2:"Riley", 5:"Nick", 6:"Henry", 7:"Bobby", 8:"Thor",
  12:"Ben", 13:"Evan", 15:"Charlie", 16:"Isaac", 17:"Zach", 18:"Chet",
};
// member logo files copied into assets/logos/ (lowercase firstname + "logo"; Evan is .jpg, rest .png).
const MEMBER_LOGO = {
  "Ben":"benlogo.png","Bobby":"bobbylogo.png","Charlie":"charlielogo.png","Chet":"chetlogo.png",
  "Evan":"Evanlogo.jpg","Henry":"henrylogo.png","Isaac":"isaaclogo.png","Nick":"nicklogo.png",
  "Riley":"rileylogo.png","Seth":"sethlogo.png","Thor":"thorlogo.png","Zach":"zachlogo.png",
};
// display: "Name (Team Name)" when mapped, else the ESPN team name (never blank).
function memberName(id, teamName){ const n = MEMBER[id]; return n ? `${n} (${teamName})` : teamName; }
function memberShort(id, teamName){ return MEMBER[id] || teamName; }
function logoFor(id){ const n = MEMBER[id]; const f = n && MEMBER_LOGO[n]; return f ? `assets/logos/${f}` : null; }
// small round avatar: member logo if present, else initials circle. `label` = name shown for initials fallback.
function avatarHtml(id, label, size){
  const url = logoFor(id); const px = size||24;
  const initial = esc((String(label||"?").trim()[0]||"?").toUpperCase());
  if(url) return `<span class="mav" style="width:${px}px;height:${px}px"><img src="${url}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="mav-fb" style="display:none">${initial}</span></span>`;
  return `<span class="mav" style="width:${px}px;height:${px}px"><span class="mav-fb" style="display:flex">${initial}</span></span>`;
}

// player image: ESPN headshot (by player id) -> NFL team logo (by abbrev) -> position-colored initial.
// Chained onerror so a missing headshot falls back to the team logo, then to a clean initial (never a broken img).
const POS_COLOR = {QB:"var(--pos-qb)",RB:"var(--pos-rb)",WR:"var(--pos-wr)",TE:"var(--pos-te)",DEF:"var(--pos-def)",K:"var(--pos-k)"};
function playerImgHtml(pid, team, pos, size){
  const px = size||18;
  const abbr = (team||"").toLowerCase();
  const head = pid ? `https://a.espncdn.com/i/headshots/nfl/players/full/${encodeURIComponent(pid)}.png` : "";
  const logo = abbr ? `https://a.espncdn.com/i/teamlogos/nfl/500/${encodeURIComponent(abbr)}.png` : "";
  const initial = esc((String(pos||"?").trim()[0]||"?").toUpperCase());
  const color = POS_COLOR[pos] || "var(--pos-k)";
  const fb = `<span class="pav-fb" aria-hidden="true" style="display:none;background:${color}">${initial}</span>`;
  // build the onerror chain: headshot -> team logo -> initial
  if(head){
    const onErr = logo
      ? `this.onerror=function(){this.style.display='none';this.parentNode.querySelector('.pav-fb').style.display='flex'};this.src='${logo}'`
      : `this.style.display='none';this.parentNode.querySelector('.pav-fb').style.display='flex'`;
    return `<span class="pav" style="width:${px}px;height:${px}px"><img src="${head}" alt="" loading="lazy" onerror="${onErr}">${fb}</span>`;
  }
  if(logo){
    return `<span class="pav" style="width:${px}px;height:${px}px"><img src="${logo}" alt="" loading="lazy" onerror="this.style.display='none';this.parentNode.querySelector('.pav-fb').style.display='flex'">${fb}</span>`;
  }
  return `<span class="pav" style="width:${px}px;height:${px}px"><span class="pav-fb" aria-hidden="true" style="display:flex;background:${color}">${initial}</span></span>`;
}

// auto-refresh: light poll so an open tab stays current on game days (does NOT push; re-pulls on interval)
const AUTO_REFRESH_MS = 150000; // 2.5 min

// ESPN maps (same as the dashboard's proven normalization)
const SLOT = {0:"QB",1:"TQB",2:"RB",3:"RB/WR",4:"WR",5:"WR/TE",6:"TE",7:"OP",8:"DT",9:"DE",
  10:"LB",11:"DL",12:"CB",13:"S",14:"DB",15:"DP",16:"D/ST",17:"K",18:"P",19:"HC",20:"BN",21:"IR",23:"FLEX",24:"ER"};
const POS = {1:"QB",2:"RB",3:"WR",4:"TE",5:"K",16:"DEF"};
const PRO = {0:"FA",1:"ATL",2:"BUF",3:"CHI",4:"CIN",5:"CLE",6:"DAL",7:"DEN",8:"DET",9:"GB",10:"TEN",
  11:"IND",12:"KC",13:"LV",14:"LAR",15:"MIA",16:"MIN",17:"NE",18:"NO",19:"NYG",20:"NYJ",21:"PHI",
  22:"ARI",23:"PIT",24:"LAC",25:"SF",26:"SEA",27:"TB",28:"WSH",29:"CAR",30:"JAX",33:"BAL",34:"HOU"};
const STARTABLE_POS = ["QB","RB","WR","TE","K","DEF"];

let DATA = null;
let ACTIVE = "insights";

async function jraw(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pts(n){ return (Math.round((n||0)*10)/10).toFixed(1); }

/* ---------- provider: ESPN (via proxy) ---------- */
const providers = {};
providers.espn = (function(){
  function teamName(t){ return (t.name || `${t.location||""} ${t.nickname||""}`.trim() || ("Team "+t.id)); }
  const recOf = t => { const o=(t.record&&t.record.overall)||{}; return {w:o.wins||0,l:o.losses||0,t:o.ties||0}; };
  const pf = t => (t.record&&t.record.overall&&t.record.overall.pointsFor)||0;
  const pa = t => (t.record&&t.record.overall&&t.record.overall.pointsAgainst)||0;

  // actual points a player scored in a specific week (source 0 = actual, split 1 = weekly). null if none.
  function weekActual(p, wk){
    if(!p.stats) return null;
    const s = p.stats.find(x=>x.statSourceId===0 && x.statSplitTypeId===1 && x.scoringPeriodId===wk);
    return s ? Math.round((s.appliedTotal||0)*10)/10 : null;
  }
  function playerOf(entry, curWeek){
    const p = (entry.playerPoolEntry && entry.playerPoolEntry.player) || entry.player || {};
    const applied = (entry.playerPoolEntry && entry.playerPoolEntry.appliedStatTotal) || 0; // season-to-date actual
    // per-week actual points map for every week this player has a stat line
    const byWeek = {};
    (p.stats||[]).forEach(s=>{ if(s.statSourceId===0 && s.statSplitTypeId===1 && s.scoringPeriodId!=null) byWeek[s.scoringPeriodId] = Math.round((s.appliedTotal||0)*10)/10; });
    return { id:String(p.id||entry.playerId||""), name:p.fullName||("id "+(entry.playerId||"?")),
             pos: POS[p.defaultPositionId]||"?", team: PRO[p.proTeamId]||"",
             eligible: (p.eligibleSlots||[]).slice(),          // raw slot ids the player can fill
             slot: SLOT[entry.lineupSlotId] || String(entry.lineupSlotId),
             slotId: entry.lineupSlotId,
             starter: SLOT[entry.lineupSlotId]!=="BN" && SLOT[entry.lineupSlotId]!=="IR",
             onIR: SLOT[entry.lineupSlotId]==="IR",
             pts: applied,                                     // season total (positional leaders)
             byWeek };                                         // {week: actualPts}
  }
  function buildTeam(t, curWeek){
    const entries = ((t.roster||{}).entries)||[];
    const players = entries.map(e=>playerOf(e, curWeek));
    const tn = teamName(t);
    return {
      id: t.id, name: tn, disp: memberName(t.id, tn), short: memberShort(t.id, tn),
      record: recOf(t), pf: pf(t), pa: pa(t),
      moves: (t.transactionCounter&&t.transactionCounter.acquisitions)||0,
      players,
      starters: players.filter(p=>p.starter),
      bench: players.filter(p=>!p.starter && !p.onIR),
    };
  }

  async function load(){
    const url = `${LEAGUE.espnProxy}?league=${encodeURIComponent(LEAGUE.id)}&season=${encodeURIComponent(LEAGUE.season)}`
      + `&view=mTeam&view=mRoster&view=mMatchup&view=mSettings&view=mStandings&view=mSchedule`;
    const d = await jraw(url);
    if(d && d.error){
      if(d.error==="espn_auth_expired") return { authExpired:true };
      if(d.error==="server_not_configured") return { notConfigured:true };
      throw new Error(d.message || d.error);
    }
    const settings = d.settings||{};
    const sched = settings.scheduleSettings || {};
    const regWeeks = sched.matchupPeriodCount || 14;
    const playoffTeams = sched.playoffTeamCount || 6;
    const week = (d.status && d.status.currentMatchupPeriod) || d.scoringPeriodId || 1;
    const teams = (d.teams||[]).map(t=>buildTeam(t, week));
    const byId = {}; teams.forEach(t=>byId[t.id]=t);

    // lineup slot config (slotId -> count) for the exact optimal-lineup solve. Only slots with count>0
    // that aren't bench/IR are startable slots.
    const slotCounts = (settings.rosterSettings && settings.rosterSettings.lineupSlotCounts) || {};
    const startSlots = []; // list of startable slotIds, one entry per slot (e.g. RB appears twice if 2 RB)
    Object.keys(slotCounts).forEach(sid=>{
      const id = Number(sid), n = slotCounts[sid]||0, lbl = SLOT[id];
      if(n>0 && lbl!=="BN" && lbl!=="IR") for(let i=0;i<n;i++) startSlots.push(id);
    });

    // Live-score fix: ESPN leaves matchup totalPoints=0 for the current week until it FINALIZES (Tue after MNF),
    // even though games have been played. For the current/in-progress week, compute each team's live score by
    // summing its STARTERS' applied points from rosterForMatchupPeriod (excludes bench=20/IR=21). Prefer
    // totalPoints when >0 so it auto-heals once ESPN finalizes.
    function liveSideScore(side){
      const tp = side.totalPoints || 0;
      if(tp > 0) return { pts: tp, computed:false };            // finalized/populated -> trust it
      const rost = side.rosterForMatchupPeriod || side.rosterForCurrentScoringPeriod;
      const entries = (rost && rost.entries) || [];
      if(!entries.length) return { pts: 0, computed:false };
      let sum = 0;
      for(const e of entries){
        if(e.lineupSlotId===20 || e.lineupSlotId===21) continue;  // exclude bench / IR
        sum += (e.playerPoolEntry && e.playerPoolEntry.appliedStatTotal) || 0;
      }
      return { pts: Math.round(sum*10)/10, computed: sum>0 };     // computed live total from starters
    }
    // games from schedule; winner from ESPN when set; scores prefer totalPoints, else computed-from-starters.
    const games = (d.schedule||[]).filter(g=>g.home&&g.away&&g.home.teamId!=null&&g.away.teamId!=null).map(g=>{
      const h = liveSideScore(g.home), a = liveSideScore(g.away);
      const finalized = (g.winner==="HOME" || g.winner==="AWAY" || g.winner==="TIE") && (g.home.totalPoints>0 || g.away.totalPoints>0);
      return {
        period: g.matchupPeriodId,
        homeId: g.home.teamId, awayId: g.away.teamId,
        homePts: h.pts, awayPts: a.pts,
        winner: g.winner,  // "HOME" | "AWAY" | "UNDECIDED"
        // live = scores exist (played) but ESPN hasn't finalized totalPoints yet (computed from starters)
        live: (h.computed || a.computed) && !finalized,
        finalized,
      };
    });

    return {
      provider:"espn", name: settings.name || LEAGUE.name, size: settings.size || teams.length,
      week, regWeeks, playoffStart: regWeeks+1, playoffTeams,
      startSlots,
      teams, byId, games,
    };
  }
  return { load };
})();

/* ---------- provider: Sleeper (stub for later — public API, no secret) ---------- */
providers.sleeper = (function(){
  async function load(){ throw new Error("Sleeper provider not enabled yet for this hub."); }
  return { load };
})();

/* ============================ INSIGHTS ============================ */

// completed games only (a game with a winner set, or a period before the current week)
function completedGames(D){ return D.games.filter(g=>(g.winner==="HOME"||g.winner==="AWAY") || g.period < D.week); }

// plain standings: W-L order, points-for tiebreaker (no "power" editorializing)
function standingsList(D){
  return D.teams.slice().sort((a,b)=> (b.record.w-a.record.w) || (b.pf-a.pf))
    .map((t,i)=>({ rank:i+1, id:t.id, disp:t.disp, pf:t.pf, rec:t.record }));
}

// which completed weeks have games (for the week tabs)
function completedWeeks(D){
  const set = new Set(completedGames(D).map(g=>g.period));
  return [...set].sort((a,b)=>a-b);
}

// games for a specific week, with margin + winner/loser resolved
function weekGames(D, wk){
  return D.games.filter(g=>g.period===wk).map(g=>{
    const homeWon = g.homePts>g.awayPts, tie = g.homePts===g.awayPts;
    return {
      period:wk, homeId:g.homeId, awayId:g.awayId, homePts:g.homePts, awayPts:g.awayPts,
      margin: Math.round(Math.abs(g.homePts-g.awayPts)*10)/10, tie,
      winId: tie?null:(homeWon?g.homeId:g.awayId), loseId: tie?null:(homeWon?g.awayId:g.homeId),
      winPts: Math.max(g.homePts,g.awayPts), losePts: Math.min(g.homePts,g.awayPts),
      live: !!g.live, finalized: !!g.finalized,
    };
  });
}

// margin- + league-context-aware superlatives for ONE week
function weekSuperlatives(D, wk){
  const games = weekGames(D, wk).filter(g=>(g.homePts||g.awayPts)>0);
  if(!games.length) return null;
  // per-team scores this week
  const scores = [];
  games.forEach(g=>{
    scores.push({ id:g.homeId, pts:g.homePts, won:g.homePts>g.awayPts, opp:g.awayPts, margin:g.margin });
    scores.push({ id:g.awayId, pts:g.awayPts, won:g.awayPts>g.homePts, opp:g.homePts, margin:g.margin });
  });
  const ptsList = scores.map(s=>s.pts).sort((a,b)=>a-b);
  const median = ptsList[Math.floor(ptsList.length/2)];
  const rankOf = p => scores.filter(s=>s.pts>p).length + 1; // 1 = highest that week
  const n = scores.length;

  const byPts = scores.slice().sort((a,b)=>b.pts-a.pts);
  const high = byPts[0], low = byPts[byPts.length-1];
  const blowout = games.slice().sort((a,b)=>b.margin-a.margin)[0];
  const nailbiter = games.slice().sort((a,b)=>a.margin-b.margin)[0];

  const others = n - 1;  // number of OTHER teams in the league this week (for "N of M other teams")

  // Mutually exclusive pools: UNLUCKY only from losers, LUCKY only from winners. A team plays once/week,
  // so a loser can never be lucky and a winner can never be unlucky. Ties are excluded from both.
  const losers  = scores.filter(s=>!s.won && s.pts!==s.opp);
  const winners = scores.filter(s=> s.won && s.pts!==s.opp);

  // UNLUCKY: the LOSER whose score would have beaten the most OTHER teams this week (i.e. lost despite a
  // league-leading-caliber score). wouldBeat = how many of the other teams' scores it topped.
  let unlucky=null;
  if(losers.length){
    unlucky = losers.map(s=>{
      const wouldBeat = scores.filter(o=>o.id!==s.id && o.pts < s.pts).length;
      const isTopScore = s.pts === high.pts;      // scored the most in the whole league but still lost
      return { id:s.id, pts:s.pts, wouldBeat, others, isTopScore };
    }).sort((a,b)=> b.wouldBeat-a.wouldBeat || b.pts-a.pts)[0];
  }
  // LUCKY: the WINNER whose score was topped by the most OTHER teams this week (won despite a low score).
  // wouldLose = how many other teams outscored them; outscored = how many they beat.
  let lucky=null;
  if(winners.length){
    lucky = winners.map(s=>{
      const wouldLose  = scores.filter(o=>o.id!==s.id && o.pts > s.pts).length;
      const outscored  = scores.filter(o=>o.id!==s.id && o.pts < s.pts).length;
      return { id:s.id, pts:s.pts, wouldLose, outscored, others };
    }).sort((a,b)=> b.wouldLose-a.wouldLose || a.pts-b.pts)[0];
  }
  return { high, low, blowout, nailbiter, unlucky, lucky, median };
}

// NOTE: "Points Left on the Bench" was REMOVED in v3. A truly-exact figure needs each week's
// HISTORICAL started lineup, but ESPN's mRoster only exposes the CURRENT roster (which churns via
// adds/drops/lineup changes), so a past week's optimal-vs-actual can't be computed exactly. Per the
// "exact or gone" rule, it's gone rather than shipping a misleading approximation.

// games played for PPG = number of weeks this player has an actual weekly stat entry (dynamic, not hardcoded).
function playerGames(p){ return Object.keys(p.byWeek||{}).length; }
function playerPPG(p){ const g = playerGames(p); return g ? (p.pts / g) : 0; }

// Positional Leaders (season): top scorer per position BY PPG (season total ÷ games played).
function positionalLeaders(D){
  const best = {};  // pos -> {player, team, ppg, ownerId, owner}
  D.teams.forEach(t=>t.players.forEach(p=>{
    if(!STARTABLE_POS.includes(p.pos)) return;
    const ppg = playerPPG(p);
    if(!best[p.pos] || ppg > best[p.pos].ppg) best[p.pos] = { player:p.name, team:p.team, ppg, ownerId:t.id, owner:t.short };
  }));
  return best;
}

// Top-3 scorers per position for a SPECIFIC week (from each player's actual weekly points).
function weekTopScorers(D, wk){
  const byPos = {};  // pos -> [{player, team, ownerId, owner, pts}]
  D.teams.forEach(t=>t.players.forEach(p=>{
    if(!STARTABLE_POS.includes(p.pos)) return;
    const wp = (p.byWeek||{})[wk];
    if(wp==null) return;
    (byPos[p.pos]=byPos[p.pos]||[]).push({ id:p.id, pos:p.pos, player:p.name, team:p.team, ownerId:t.id, owner:t.short, pts:wp });
  }));
  Object.keys(byPos).forEach(P=>{ byPos[P].sort((a,b)=>b.pts-a.pts); byPos[P]=byPos[P].slice(0,3); });
  return byPos;
}

// week tablist (1..regWeeks) as real tab buttons in a scroll-snap row; current week carries aria-current="date".
function weekTabsHtml(listId, idPrefix, paneId, weeks, sel, cur){
  return `<div class="bs-tabs bs-tabs--sub wtabs" role="tablist" aria-label="Week" id="${listId}">` + weeks.map(w =>
    `<button type="button" role="tab" id="${idPrefix}${w}" data-key="${w}" aria-controls="${paneId}"`
    + ` aria-selected="${w===sel}" tabindex="${w===sel?0:-1}"${w===cur?' aria-current="date"':''}>Wk ${w}</button>`).join("") + `</div>`;

// Current streak for one team from completed games, newest first: "W3" / "L1" / "T1", "—" before any game.
// No winner (e.g. "UNDECIDED" past weeks) + unequal points -> the higher score wins, matching weekGames().
function streakOf(D, teamId){
  const gs = completedGames(D).filter(g=>(g.homeId===teamId||g.awayId===teamId) && !(g.homePts===0 && g.awayPts===0))
    .sort((a,b)=>b.period-a.period);
  let kind = null, n = 0;
  for(const g of gs){
    const home = g.homeId===teamId;
    let r;
    if(g.winner==="HOME") r = home?"W":"L";
    else if(g.winner==="AWAY") r = home?"L":"W";
    else if(g.winner==="TIE" || g.homePts===g.awayPts) r = "T";
    else r = (g.homePts>g.awayPts) === home ? "W" : "L";
    if(kind===null) kind = r;
    if(r!==kind) break;
    n++;
  }
  return kind ? kind+n : "—";
}

// Per-team playoff status, extracted verbatim from the old paintPlayoffs() "Standings & Status" loop.
// Returns {id -> {key:"clinch|elim|alive", label:"IN|OUT|ALIVE", why}}.
function standingStatus(D){
  const st = standings(D);
  const played = Math.max(0, D.week-1);
  const gamesLeft = Math.max(0, D.regWeeks - played);
  const cutoff = D.playoffTeams;
  const out = {};
  st.forEach((t,i)=>{
    const inLine = i < cutoff;
    // ALIVE by default early; only mark clinched/eliminated when math is certain
    let status="alive", label="ALIVE", why="";
    if(gamesLeft===0){
      status = inLine ? "clinch" : "elim"; label = inLine ? "IN" : "OUT";
    } else {
      // eliminated if even winning out can't catch the current cutoff team's floor (lose-out)... too strict early -> keep ALIVE
      const bestFinish = t.w + gamesLeft;
      const cutoffFloor = (st[cutoff-1]?.w)||0; // current #cutoff wins (won't decrease)
      if(bestFinish < cutoffFloor && i>=cutoff){ status="elim"; label="OUT"; why="can't catch the cut line even winning out"; }
      // clinched if worst finish still beats the best possible of the first team out
      const worstFinish = t.w;
      const chaserCeil = (st[cutoff]?.w||0) + gamesLeft;
      if(i<cutoff && worstFinish > chaserCeil){ status="clinch"; label="IN"; why="can't be caught even losing out"; }
    }
    out[t.id] = { key:status, label, why };
  });
  return out;
}

/* ============================ PLAYOFF SCENARIOS ============================ */

// standings sorted by W, then points-for tiebreaker
function standings(D){
  return D.teams.slice().sort((a,b)=> (b.record.w-a.record.w) || (b.pf-a.pf))
    .map((t,i)=>({ seed:i+1, id:t.id, name:t.disp, w:t.record.w, l:t.record.l, t:t.record.t, pf:t.pf }));
}

/* ============================ WEEKLY STAKES ============================ */
// PUBLIC + honest: for the CURRENT week's matchups (leaguewide), the win-vs-lose swing.
// Two metrics, filterable: (1) SEEDING/RECORD DELTA — reuse standings(D) with one game flipped;
// (2) PLAYOFF-ODDS SWING — enumerate remaining outcomes when the tree is small enough, else
// honest win-out/lose-out BOUNDS (never a fabricated %). Nothing here re-fetches or re-derives
// standings/schedule; it's a pure read over the existing DATA object.

let STAKES_MODE = "both"; // "seeding" | "odds" | "both"
let STAKES_WEEK = null;   // selected week for the Stakes view; null -> defaults to D.week

// Base seed lookup {id -> seed} from a records array [{id,w,l,t,pf}] using the SAME sort as standings().
function seedMapFrom(recs){
  const sorted = recs.slice().sort((a,b)=> (b.w-a.w) || (b.pf-a.pf));
  const m = {}; sorted.forEach((r,i)=> m[r.id]=i+1); return m;
}
// Snapshot of current records (what standings() sorts on), as a plain mutable array.
function recordsSnapshot(D){
  return D.teams.map(t=>({ id:t.id, w:t.record.w, l:t.record.l, t:t.record.t, pf:t.pf }));
}
// Seed map if `winnerId` beats `loserId` in ONE otherwise-unplayed game: +1 W winner, +1 L loser, PF unchanged.
function seedMapIfWin(D, winnerId, loserId){
  const recs = recordsSnapshot(D);
  recs.forEach(r=>{ if(r.id===winnerId) r.w++; else if(r.id===loserId) r.l++; });
  return seedMapFrom(recs);
}

// Remaining (unplayed) matchups leaguewide: games in weeks >= current week that have no result yet.
// Each = {period, aId, bId}. Used both to size the odds tree and to enumerate it.
function remainingMatchups(D){
  const out = [];
  D.games.forEach(g=>{
    const played = (g.winner==="HOME"||g.winner==="AWAY") || (g.homePts||g.awayPts)>0 || g.period < D.week;
    if(!played && g.period<=D.regWeeks) out.push({ period:g.period, aId:g.homeId, bId:g.awayId });
  });
  return out;
}

// current-week matchups (the ones we show), from weekGames — leaguewide, both scored & unscored.
function currentWeekMatchups(D){
  return weekGames(D, D.week).map(g=>({ period:D.week, aId:g.homeId, bId:g.awayId }));
}
// matchups for ANY week (used by the Stakes week tabs); carries the resolved result for past weeks.
function weekMatchups(D, wk){
  return weekGames(D, wk).map(g=>({ period:wk, aId:g.homeId, bId:g.awayId,
    winId:g.winId, loseId:g.loseId, tie:g.tie, homePts:g.homePts, awayPts:g.awayPts,
    scored:(g.homePts||g.awayPts)>0 }));
}

const ODDS_ENUM_CAP = 18; // 2^18 = 262144 combos — feasible; above this we fall back to honest bounds.

// Playoff-odds swing for one matchup (aId vs bId) using FULL enumeration of ALL remaining games.
// Returns { ok:true, a:{win,lose}, b:{win,lose} } as make-playoffs probabilities (0..1), or {ok:false}
// when the remaining tree is too large (caller falls back to bounds). Enumerate by flipping the target
// game to each side first, then brute-forcing every OTHER remaining game's winner.
function oddsSwing(D, aId, bId){
  const rem = remainingMatchups(D);
  // "others" = every remaining game except the one we're evaluating (match by the unordered team pair + week)
  const isTarget = m => m.period===D.week &&
    ((m.aId===aId&&m.bId===bId)||(m.aId===bId&&m.bId===aId));
  const others = rem.filter(m=>!isTarget(m));
  if(others.length > ODDS_ENUM_CAP) return { ok:false };
  const cutoff = D.playoffTeams;
  const baseW = {}; D.teams.forEach(t=> baseW[t.id]=t.record.w);
  const basePF = {}; D.teams.forEach(t=> basePF[t.id]=t.pf);
  const combos = 1 << others.length;

  // fraction of enumerated worlds (over `others`) where teamId lands in the top-`cutoff` seeds,
  // GIVEN the target game already decided (targetWinner beats targetLoser).
  function makeFrac(teamId, targetWinner, targetLoser){
    let made = 0;
    for(let mask=0; mask<combos; mask++){
      const w = Object.assign({}, baseW);
      w[targetWinner]++; // target game locked
      for(let i=0;i<others.length;i++){
        const g = others[i];
        if(mask & (1<<i)) w[g.aId]++; else w[g.bId]++;
      }
      // seed by wins then existing PF (same tiebreak as standings; PF held at today's value — honest v1)
      const order = D.teams.map(t=>t.id).sort((x,y)=> (w[y]-w[x]) || (basePF[y]-basePF[x]));
      if(order.indexOf(teamId) < cutoff) made++;
    }
    return made / combos;
  }
  return {
    ok:true,
    a:{ win: makeFrac(aId, aId, bId), lose: makeFrac(aId, bId, aId) },
    b:{ win: makeFrac(bId, bId, aId), lose: makeFrac(bId, aId, bId) },
  };
}

// Honest bounds fallback (mirrors paintPlayoffs): for a team, best case = win out, worst = lose out.
// We report the seed range [bestSeed..worstSeed] and whether the cut line (playoffTeams) is inside it.
function boundsFor(D, teamId){
  const played = Math.max(0, D.week-1);
  const gamesLeft = Math.max(0, D.regWeeks - played);
  const recs = recordsSnapshot(D);
  const me = recs.find(r=>r.id===teamId);
  // best: I win all remaining, everyone else loses all remaining
  const best = recs.map(r=>({ id:r.id, w: r.w + (r.id===teamId?gamesLeft:0), pf:r.pf }));
  const bestSeed = seedMapFrom(best)[teamId];
  // worst: I lose all remaining, everyone else wins all remaining
  const worst = recs.map(r=>({ id:r.id, w: r.w + (r.id===teamId?0:gamesLeft), pf:r.pf }));
  const worstSeed = seedMapFrom(worst)[teamId];
  return { bestSeed, worstSeed, gamesLeft };
}

// Standings compression: the win-spread among playoff-relevant teams (those whose win-out ceiling can
// still reach the current cut-line team's wins). When that spread is tight, a single result can reshuffle
// seeding, so every undecided game is genuinely high-leverage and the fine-grained band split is noise.
// Returns { spread, tight, contenderCount } — matches the Hub's "gets sharper each week" discipline.
function standingsCompression(D){
  const st = standings(D);
  const played = Math.max(0, D.week-1);
  const gamesLeft = Math.max(0, D.regWeeks - played);
  const cutoff = D.playoffTeams;
  const cutW = st[cutoff-1] ? st[cutoff-1].w : 0;   // wins of the team on the cut line
  // playoff-relevant = still able to reach the cut line if they win out (ceiling >= cutW)
  const relevant = st.filter(t => (t.w + gamesLeft) >= cutW);
  const ws = relevant.map(t=>t.w);
  const spread = ws.length ? (Math.max(...ws) - Math.min(...ws)) : 0;
  // tight when the field is bunched within ~2 games (a single result can reshuffle seeding)
  const tight = spread <= 2;
  return { spread, tight, contenderCount: relevant.length };
}

// classify importance band from a numeric swing score (0..1-ish) and whether the cut line is crossed.
// `tight` (optional): when standings are compressed, every undecided game is high-leverage → force PIVOTAL
// rather than splitting hairs on tiny odds-swing differences that are within noise this early.
function importanceBand(score, crossesLine, tight){
  if(tight) return { key:"pivotal", label:"PIVOTAL" };
  if(crossesLine || score >= 0.20) return { key:"pivotal", label:"PIVOTAL" };
  if(score >= 0.05) return { key:"meaningful", label:"MEANINGFUL" };
  return { key:"low", label:"LOW STAKES" };
}

function paintStakes(){
  const D = DATA; const el = document.getElementById("pane-stakes");
  if(!D){ el.innerHTML = `<div class="note">No data.</div>`; return; }
  const dispOf = id => D.byId[id]?.disp || "—";
  const shortOf = id => D.byId[id]?.short || "—";
  const cutoff = D.playoffTeams;

  const baseSeed = seedMapFrom(recordsSnapshot(D)); // current seeds
  const recById = {}; D.teams.forEach(t=> recById[t.id]=t.record);

  // selected week (default current). Week tabs let you look ahead/back.
  const allWeeks = []; for(let w=1; w<=D.regWeeks; w++) allWeeks.push(w);
  if(STAKES_WEEK==null || !allWeeks.includes(STAKES_WEEK)) STAKES_WEEK = D.week;
  const wk = STAKES_WEEK;
  const isCurrent = wk === D.week;
  const isFuture  = wk >  D.week;
  const isPast    = wk <  D.week;

  // is the odds tree enumerable right now? (drives whether "odds" mode shows % or honest bounds)
  // ONLY meaningful for the current week — oddsSwing targets the current week's game.
  const remOthersCount = Math.max(0, remainingMatchups(D).length - 1);
  const oddsEnumerable = isCurrent && remOthersCount <= ODDS_ENUM_CAP;

  // Standings compression gate: when the playoff-relevant field is bunched, every undecided game is
  // genuinely pivotal, so we force PIVOTAL rather than splitting tiny odds-swing hairs (noise this early).
  const comp = standingsCompression(D);
  const tightBands = comp.tight && !isPast;   // past weeks show results, not hypothetical bands

  const mus = weekMatchups(D, wk);

  // build a computed record per matchup, then sort by importance
  const rows = mus.map(m=>{
    const { aId, bId } = m;
    // SEEDING deltas — directional + honest for ANY week (records flipped by one game).
    const seedIfA = seedMapIfWin(D, aId, bId);   // A wins
    const seedIfB = seedMapIfWin(D, bId, aId);   // B wins
    const aWinSeed = seedIfA[aId], aLoseSeed = seedIfB[aId];
    const bWinSeed = seedIfB[bId], bLoseSeed = seedIfA[bId];
    const seedSwing = Math.abs(aWinSeed-aLoseSeed) + Math.abs(bWinSeed-bLoseSeed);
    // crosses the playoff cut line for either team? (in when seed<=cutoff)
    const aCross = (aWinSeed<=cutoff) !== (aLoseSeed<=cutoff);
    const bCross = (bWinSeed<=cutoff) !== (bLoseSeed<=cutoff);
    const crossesLine = aCross || bCross;

    // ODDS swing — EXACT only for the current week when the tree is enumerable. Future/past weeks never
    // fabricate an exact %; future weeks show a directional/bounds estimate, past weeks show the known result.
    let odds = null;
    if(oddsEnumerable){
      const o = oddsSwing(D, aId, bId);
      if(o.ok){
        odds = { aSwing: Math.abs(o.a.win - o.a.lose), bSwing: Math.abs(o.b.win - o.b.lose), a:o.a, b:o.b };
      }
    }

    // importance score depends on active mode
    let score, crosses = crossesLine;
    if(STAKES_MODE==="odds"){
      score = odds ? Math.max(odds.aSwing, odds.bSwing) : (seedSwing/ D.size); // fallback proxy
    } else if(STAKES_MODE==="seeding"){
      score = seedSwing / Math.max(1, D.size);
    } else { // both
      const oddsPart = odds ? Math.max(odds.aSwing, odds.bSwing) : 0;
      score = Math.max(oddsPart, seedSwing/Math.max(1,D.size));
    }
    return { aId, bId, aWinSeed, aLoseSeed, bWinSeed, bLoseSeed, seedSwing, crosses, odds,
             aRec:recById[aId], bRec:recById[bId], score,
             winId:m.winId, loseId:m.loseId, tie:m.tie, scored:m.scored, homePts:m.homePts, awayPts:m.awayPts };
  });

  rows.sort((x,y)=> y.score - x.score);

  const s = [];
  // header panel: title, caption, week tablist
  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">Weekly Stakes, Week ${wk}</h2><span class="bs-meta">${isCurrent?"Current":isFuture?"Upcoming":"Past"}</span></div>
    <div class="bs-panel-body"><p class="cap">Swing between a win and a loss. Top ${cutoff} of ${D.size} make the playoffs. Most pivotal first.</p>`);

  // week tabs (1..regWeeks), current week marked
  s.push(weekTabsHtml("stkWtabs", "stkWk-", "stkWeekPane", allWeeks, wk, D.week));
  s.push(`</div></section>`);
  // single week tabpanel: everything scoped to the selected week
  s.push(`<div id="stkWeekPane" role="tabpanel" aria-labelledby="stkWk-${wk}" tabindex="0">`);

  // filter control
  s.push(`<div class="bs-seg" id="stkFilter" role="group" aria-label="Stakes view">
      <button type="button" data-mode="seeding" aria-pressed="${STAKES_MODE==='seeding'}">Seeding</button>
      <button type="button" data-mode="odds" aria-pressed="${STAKES_MODE==='odds'}">Playoff odds</button>
      <button type="button" data-mode="both" aria-pressed="${STAKES_MODE==='both'}">Both</button>
    </div>`);

  // precision label per week distance
  if(isFuture){
    s.push(`<p class="cap">Projected from today's records.</p>`);
  } else if(isPast){
    s.push(`<p class="cap">Final results.</p>`);
  } else if((STAKES_MODE==="odds"||STAKES_MODE==="both") && !oddsEnumerable){
    s.push(`<p class="cap">Too early for exact odds — showing best/worst-case seeds.</p>`);
  }

  // standings-compression framing: explain why every game reads PIVOTAL when the field is bunched
  if(tightBands){
    s.push(`<p class="cap">Standings are bunched within ${comp.spread} game${comp.spread===1?"":"s"} — every game is pivotal this week.</p>`);
  }

  const wireStakesWeeks = () => {
    const wt = document.getElementById("stkWtabs");
    if(wt) wireTabs(wt, k=>{
      const hadFocus = wt.contains(document.activeElement);
      STAKES_WEEK = Number(k); paintStakes(); writeHash();
      if(hadFocus) document.getElementById("stkWk-"+k)?.focus();
    });
  };

  if(!rows.length){
    s.push(`<section class="bs-panel"><div class="bs-panel-body"><p class="cap">No matchups scheduled for Week ${wk}.</p></div></section>`);
    s.push(`</div>`); // end #stkWeekPane
    el.innerHTML = s.join(""); wireStakesWeeks(); return;
  }

  const pct = x => (Math.round(x*1000)/10).toFixed(1)+"%";
  const seedTxt = (seed) => seed<=cutoff ? `seed ${seed} <b>(in)</b>` : `seed ${seed} (out)`;
  const BAND_CLS = { pivotal:"bs-down", meaningful:"bs-warn", low:"bs-dim" };

  // one flat panel per matchup: head "A vs B" + band word; body = Team · If win · If lose table
  rows.forEach(r=>{
    const band = importanceBand(r.score, r.crosses, tightBands);
    const aName = shortOf(r.aId), bName = shortOf(r.bId);
    const parts = [];
    // past week with a known result: show the result word instead of an importance band.
    const headWord = (isPast && r.scored)
      ? `<span class="bs-micro">${r.tie ? "TIE" : "FINAL"}</span>`
      : `<span class="bs-micro ${BAND_CLS[band.key]||"bs-dim"}">${band.label}</span>`;
    parts.push(`<section class="bs-panel"><div class="bs-panel-head"><h3 class="bs-h2">${esc(aName)} vs ${esc(bName)}</h3><span class="bs-meta">${headWord}</span></div>`);

    if(isPast && r.scored){
      // KNOWN result — retrospective. Who won, and whether it was a cut-line swing in hindsight.
      const won = r.tie ? null : shortOf(r.winId);
      parts.push(`<div class="bs-panel-body"><p class="cap">`
        + (r.tie
            ? `Ended in a tie, ${pts(r.homePts)}–${pts(r.awayPts)}.`
            : `<span class="bs-up"><b>${esc(won)}</b> won, ${pts(Math.max(r.homePts,r.awayPts))}–${pts(Math.min(r.homePts,r.awayPts))}</span>`)
        + `</p>`);
      if(r.crosses){
        parts.push(`<p class="cap">Cut-line swing game: the result moved a team across the playoff line.</p>`);
      }
      parts.push(`</div></section>`);
      s.push(parts.join(""));
      return;
    }

    // per-team outcome rows (current or future — hypothetical win/lose)
    parts.push(`<div class="bs-table-wrap"><table class="bs-table stk-table"><thead><tr><th scope="col">Team</th><th scope="col">If win</th><th scope="col">If lose</th></tr></thead><tbody>`);
    [[r.aId, aName, r.aWinSeed, r.aLoseSeed, r.aRec, r.odds?r.odds.a:null],
     [r.bId, bName, r.bWinSeed, r.bLoseSeed, r.bRec, r.odds?r.odds.b:null]].forEach(([id,nm,winSeed,loseSeed,rec,od])=>{
      const winRec = `${rec.w+1}-${rec.l}${rec.t?"-"+rec.t:""}`;
      const loseRec = `${rec.w}-${rec.l+1}${rec.t?"-"+rec.t:""}`;
      const win = [], lose = [];
      if(STAKES_MODE==="seeding" || STAKES_MODE==="both"){
        win.push(`<span class="bs-up"><b>${winRec}</b>, ${seedTxt(winSeed)}</span>`);
        lose.push(`<span class="bs-down"><b>${loseRec}</b>, ${seedTxt(loseSeed)}</span>`);
      }
      if(STAKES_MODE==="odds" || STAKES_MODE==="both"){
        if(od){ // exact enumerated odds (current week only)
          win.push(`<span class="bs-up"><b>${pct(od.win)}</b> playoffs</span>`);
          lose.push(`<span class="bs-down"><b>${pct(od.lose)}</b> playoffs</span>`);
        } else { // not enumerable (early season / future week) → honest win-out/lose-out bounds (BOTH & odds)
          const b = boundsFor(D, id);
          win.push(`<span class="bs-dim">Best case: <b>seed ${b.bestSeed}</b> (win out)</span>`);
          lose.push(`<span class="bs-dim">Worst case: <b>seed ${b.worstSeed}</b> (lose out)</span>`);
        }
      }
      parts.push(`<tr><td><span class="tm-cell">${avatarHtml(id, nm, 20)}<span>${esc(nm)}</span></span></td>`
        + `<td class="wrap-ok">${win.join("<br>")}</td><td class="wrap-ok">${lose.join("<br>")}</td></tr>`);
    });
    parts.push(`</tbody></table></div>`);

    // per-panel note
    if(r.crosses){
      parts.push(`<div class="bs-panel-body"><p class="cap">${isFuture?"Projected: this game could move a team across the playoff cut line.":"This game can move a team across the playoff cut line."}</p></div>`);
    }
    parts.push(`</section>`);
    s.push(parts.join(""));
  });

  s.push(`</div>`); // end #stkWeekPane
  el.innerHTML = s.join("");

  // wire the filter (aria-pressed buttons; focus stays on the chosen mode after repaint)
  const f = document.getElementById("stkFilter");
  if(f) f.querySelectorAll("button[data-mode]").forEach(seg=> seg.addEventListener("click", ()=>{
    STAKES_MODE = seg.dataset.mode; paintStakes(); writeHash();
    document.querySelector(`#stkFilter [data-mode="${STAKES_MODE}"]`)?.focus();
  }));
  // wire the week tabs
  wireStakesWeeks();
}

/* ---- Playoff Races (pure data fns over D; reuse standings/boundsFor discipline) ---- */

// #1-seed / first-round-bye race. Ceiling = win out (w+gamesLeft); floor = lose out (w).
// A team is a contender for #1 if its ceiling >= the current leader's floor (w). CLINCHED #1 when a team's
// floor beats every OTHER team's ceiling (can't be caught for the top seed even if it loses out).
function seedRaceData(D){
  const st = standings(D); // seeded by W then PF
  const played = Math.max(0, D.week-1);
  const gamesLeft = Math.max(0, D.regWeeks - played);
  const leader = st[0];
  const ceil = t => t.w + gamesLeft;      // win-out wins
  const floor = t => t.w;                 // lose-out wins (won't decrease)
  // clinched #1: a team whose floor > every other team's ceiling
  let clinchedId = null;
  st.forEach(t=>{
    const others = st.filter(o=>o.id!==t.id);
    if(gamesLeft>=0 && others.every(o=> floor(t) > ceil(o))) clinchedId = t.id;
  });
  // contenders: ceiling can reach the leader's floor (i.e. mathematically still able to tie/pass the top)
  const leaderFloor = floor(leader);
  const contenders = st.filter(t => ceil(t) >= leaderFloor).map(t=>({
    id:t.id, name:t.name, seed: st.indexOf(t)+1, w:t.w, l:t.l, pf:t.pf,
    ceiling: ceil(t), floor: floor(t),
    gamesBack: Math.max(0, leader.w - t.w),
    isLeader: t.id===leader.id,
    clinched: t.id===clinchedId,
  }));
  return { leader, gamesLeft, clinchedId, contenders, cutoff:D.playoffTeams };
}

// General playoff-spot race for the top-`playoffTeams` cutoff.
// IN = current seed <= cutoff. BUBBLE = the cut line is reachable both directions (best-case in, worst-case out).
// CHASING = out now but win-out ceiling can still reach the current cut team's floor (still alive).
function spotRaceData(D){
  const st = standings(D);
  const cutoff = D.playoffTeams;
  const played = Math.max(0, D.week-1);
  const gamesLeft = Math.max(0, D.regWeeks - played);
  const cutTeam = st[cutoff-1];        // last team currently IN
  const firstOut = st[cutoff];         // first team currently OUT
  const cutW = cutTeam ? cutTeam.w : 0;
  const firstOutW = firstOut ? firstOut.w : cutW;
  const rows = st.map((t,i)=>{
    const b = boundsFor(D, t.id);      // {bestSeed, worstSeed, gamesLeft} — kept for honest bounds, not the headline
    const inNow = i < cutoff;
    // theoretical extremes (span the whole league early season -> not the headline signal)
    const canBeIn  = b.bestSeed  <= cutoff;
    const canBeOut = b.worstSeed >  cutoff;
    // SIGNED games from the cut line, using CURRENT record (the real, informative signal today):
    //  in-line teams: cushion over the first team OUT (t.w - firstOutW) -> higher = safer
    //  out-line teams: deficit to the cut team (t.w - cutW, negative) -> more negative = further back
    const gamesFromLine = inNow ? (t.w - firstOutW) : (t.w - cutW);
    const gamesBack = inNow ? 0 : Math.max(0, cutW - t.w);        // legacy positive GB for out teams
    // BAND by CURRENT standing (not the still-wide clinch/elim math), unless the math is actually certain.
    // BUBBLE is reserved for teams straddling the cut line: the two seeds just inside and just outside it,
    // OR any team level on wins with the cut-line team. Clearly-above by seed = IN, clearly-below = CHASING —
    // so the current ordering (W then PF) separates a 2-0 leader from an 0-2 cellar-dweller instead of
    // flattening everyone to BUBBLE on the still-wide win-out/lose-out extremes.
    const seed = i+1;
    let band;
    if(gamesLeft===0){ band = inNow ? "in" : "out"; }
    else if(!canBeIn) band = "out";                  // truly ELIMINATED (can't reach even winning out)
    else if(canBeIn && !canBeOut) band = "in";       // truly CLINCHED-ish (can't fall out even losing out)
    else {
      // straddling = the seeds just inside/just outside the line (cutoff and the two either side)
      const straddlesLine = seed>=cutoff-1 && seed<=cutoff+2;
      if(straddlesLine) band = "bubble";
      else if(inNow) band = "in";
      else band = "chasing";
    }
    // magic / elimination numbers (unchanged — only surface once certain)
    const chasers = st.slice(cutoff);
    const bestChaserCeil = chasers.length ? Math.max(...chasers.map(c=>c.w + gamesLeft)) : 0;
    let magic = null;
    if(inNow && gamesLeft>0){
      for(let m=0;m<=gamesLeft;m++){ if(t.w + m > bestChaserCeil){ magic = m; break; } }
    }
    let elim = null;
    if(!inNow && gamesLeft>0){
      for(let x=0;x<=gamesLeft;x++){ if(t.w + (gamesLeft - x) < cutW){ elim = x; break; } }
    }
    return { id:t.id, name:t.name, seed:i+1, w:t.w, l:t.l, t:t.t, pf:t.pf,
             band, gamesBack, gamesFromLine, bestSeed:b.bestSeed, worstSeed:b.worstSeed,
             magic, elim, inNow, boundsWide:(b.worstSeed - b.bestSeed) >= (D.size-1) };
  });
  // PF-tie flags: mark a row when it shares the same wins as an adjacent row (PF is what orders them)
  rows.forEach((r,i)=>{
    const prev = rows[i-1], next = rows[i+1];
    r.pfTie = (prev && prev.w===r.w) || (next && next.w===r.w);
  });
  return { rows, cutoff, cutW, firstOutW, gamesLeft, cutTeam, firstOut };
}

// definitions moved out of the always-on closing paragraph into a collapsed disclosure
const RACES_HOWTO = `<details class="bs-details"><summary>How races work</summary>
  <p class="cap">Magic number: wins that guarantee a spot. Elimination number: losses that end the chase.
  The seed range appears once it narrows. Points-for breaks ties.</p></details>`;

function paintPlayoffs(){
  const D = DATA; const el = document.getElementById("pane-playoffs");
  if(!D){ el.innerHTML = `<div class="note">No data.</div>`; return; }
  const played = Math.max(0, D.week-1);
  const gamesLeft = Math.max(0, D.regWeeks - played);
  const cutoff = D.playoffTeams;
  const s = [];

  // header / context (the standings table itself lives on League Insights: one table, no duplicate)
  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">Playoff Picture</h2></div><div class="bs-panel-body">
    <p class="cap">Top <b>${cutoff}</b> of ${D.size} make the playoffs · ${D.regWeeks}-week regular season · ~${gamesLeft} game(s) left (playoffs start Week ${D.playoffStart}).</p>`);
  if(gamesLeft >= D.regWeeks-1){
    s.push(`<p class="cap">Early season: ranges still span the league.</p>`);
  }
  s.push(`<p class="cap">Full standings: <a href="#insights">League Insights</a></p></div></section>`);

  // ===== RACE 1: #1 seed / first-round bye =====
  const shortOf = id => D.byId[id]?.short || "—";
  const sr = seedRaceData(D);
  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">#1 Seed / First-Round Bye Race</h2></div><div class="bs-panel-body">
    <p class="cap">The #1 seed earns a first-round bye. Games back are from the leader (${esc(shortOf(sr.leader.id))}, ${sr.leader.w}-${sr.leader.l}).</p>`);
  if(sr.gamesLeft===0){
    s.push(`<p class="cap">Regular season is over — ${esc(shortOf(sr.leader.id))} is the #1 seed.</p>`);
  } else if(sr.contenders.length<=1){
    s.push(`<p class="cap">${sr.clinchedId ? `${esc(shortOf(sr.clinchedId))} has CLINCHED the #1 seed (can't be caught even losing out).` : `Only ${esc(shortOf(sr.leader.id))} can reach the top seed right now.`}</p>`);
  }
  // flag contenders tied on games-back (same wins) so we can note PF is what separates them
  const gbCounts = {}; sr.contenders.forEach(c=> gbCounts[c.gamesBack]=(gbCounts[c.gamesBack]||0)+1);
  s.push(`<div class="bs-table-wrap"><table class="bs-table race-table"><thead><tr><th scope="col">Team</th><th class="num" scope="col">W-L</th>
    <th class="num" scope="col">PF</th><th class="num" scope="col">GB</th><th scope="col">Status</th><th class="race-path" scope="col">Path</th></tr></thead><tbody>`);
  sr.contenders.forEach(c=>{
    const tiedOnGB = gbCounts[c.gamesBack] > 1;
    const need = c.isLeader
      ? (c.clinched ? "Locked in — can't be caught for #1." : "Win out and the top seed is theirs.")
      : `Needs to win out (ceiling ${c.ceiling}) + ${esc(shortOf(sr.leader.id))} to slip.`
        + (tiedOnGB ? ` · ${pts(c.pf)} pf breaks the tie` : "");
    const tag = c.clinched ? `<span class="bs-up">CLINCHED #1</span>`
              : c.isLeader ? `<span class="bs-up">LEADER</span>`
              : `<span class="bs-dim">—</span>`;   // games back already has its own GB column
    const s1 = c.seed===1 ? " seed1" : "";
    s.push(`<tr class="race-main${s1}">
      <td><span class="tm-cell">${avatarHtml(c.id, shortOf(c.id), 22)}<span>${esc(shortOf(c.id))}</span></span></td>
      <td class="num">${c.w}-${c.l}</td><td class="num">${pts(c.pf)}</td><td class="num">${c.isLeader?"—":c.gamesBack}</td>
      <td>${tag}</td><td class="wrap-ok race-path">${need}</td></tr>
      <tr class="race-sub${s1}"><td colspan="5">${need}</td></tr>`);
  });
  s.push(`</tbody></table></div></div></section>`);

  // ===== RACE 2: general playoff-spot race =====
  const spr = spotRaceData(D);
  const BAND = {
    in:      {label:"IN",      cls:"bs-up"},
    bubble:  {label:"BUBBLE",  cls:"bs-warn"},
    chasing: {label:"CHASING", cls:"bs-dim"},
    out:     {label:"OUT",     cls:"bs-down"},
  };
  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">Playoff-Spot Race</h2></div><div class="bs-panel-body">
    <p class="cap">Top <b>${spr.cutoff}</b> make it, ordered by W then points-for. IN: holding a spot. BUBBLE: around the cut line. CHASING: below the line, alive. OUT: can't get in even winning out. ${spr.cutTeam?`${esc(shortOf(spr.cutTeam.id))} holds the last spot at ${spr.cutW} W.`:""}</p>`);
  if(spr.gamesLeft>=D.regWeeks-1){
    s.push(`<p class="cap">Early season: ranges still span the league.</p>`);
  }
  s.push(`<div class="bs-table-wrap"><table class="bs-table race-table"><thead><tr><th class="num" scope="col">Seed</th><th scope="col">Team</th>
    <th class="num" scope="col">W-L</th><th class="num" scope="col">PF</th><th scope="col">Band</th><th class="race-path" scope="col">Gap</th></tr></thead><tbody>`);
  spr.rows.forEach(r=>{
    const b = BAND[r.band];
    // headline signal = CURRENT gap from the cut line (+ PF tiebreak), not the non-informative wide seed range.
    let gapTxt;
    if(spr.gamesLeft===0){ gapTxt = r.inNow ? "made it" : "missed out"; }
    else if(r.inNow){
      gapTxt = r.gamesFromLine>0 ? `+${r.gamesFromLine} game${r.gamesFromLine===1?"":"s"} above the line`
             : `level with the line`;
    } else {
      const gb = Math.max(0, spr.cutW - r.w);
      gapTxt = gb>0 ? `${gb} game${gb===1?"":"s"} back` : `level with the line`;
    }
    // PF tiebreak note when tied on wins with a neighbor (mirrors how standings(D) actually breaks it)
    const pfTxt = r.pfTie ? ` · ${pts(r.pf)} pf breaks the tie` : "";
    // magic/elim only when certain; wide early-season bounds shown de-emphasized, not as the headline
    const extra = [];
    if(r.magic!=null) extra.push(`magic ${r.magic}`);
    if(r.elim!=null) extra.push(`elim ${r.elim}`);
    if(!r.boundsWide) extra.push(`range seed ${r.bestSeed}–${r.worstSeed}`); // only when it actually narrows
    const extraTxt = extra.length ? ` · <b>${extra.join(" · ")}</b>` : "";
    // cut line: dashed --down rule under the last IN seed
    const cut = r.seed===spr.cutoff ? " bs-cut" : "";
    s.push(`<tr class="race-main">
      <td class="num${cut}">${r.seed}</td>
      <td class="${cut.trim()}"><span class="tm-cell">${avatarHtml(r.id, shortOf(r.id), 22)}<span>${esc(shortOf(r.id))}</span></span></td>
      <td class="num${cut}">${r.w}-${r.l}${r.t?"-"+r.t:""}</td><td class="num${cut}">${pts(r.pf)}</td>
      <td class="${cut.trim()}"><span class="${b.cls}">${b.label}</span></td>
      <td class="wrap-ok race-path${cut}">${gapTxt}${pfTxt}${extraTxt}</td></tr>
      <tr class="race-sub"><td colspan="5" class="${cut.trim()}">${gapTxt}${pfTxt}${extraTxt}</td></tr>`);
  });
  s.push(`</tbody></table></div>${RACES_HOWTO}</div></section>`);

  el.innerHTML = s.join("");
}

/* ============================ TRADE BLOCK (simple surplus/shortage counts) ============================ */
// Factual only: rostered COUNT per position vs Royal Crushers' startable need. No values, no rankings.
// Starting slots: QB, RB, RB, WR, WR, TE, FLEX, D/ST, K. FLEX is RB/WR/TE eligible.
const BLOCK_POS = ["QB","RB","WR","TE","DEF","K"];
const BLOCK_LABEL = { QB:"QB", RB:"RB", WR:"WR", TE:"TE", DEF:"D/ST", K:"K" };
// base starting requirement per position (dedicated slots only); FLEX handled separately across RB/WR/TE
const START_NEED = { QB:1, RB:2, WR:2, TE:1, DEF:1, K:1 };
const FLEX_POOL = ["RB","WR","TE"]; // one FLEX slot any of these can fill

// classify one team's count at a position vs need. Returns {count, need, status:'short'|'surplus'|'ok'}
// Consistent rule: SURPLUS when rostered is well above what you can start (startable + 1);
// SHORTAGE when at/below what you must start. K/D-ST (single slot, no depth expectation) = 1 is fine.
function blockStatus(pos, count){
  const need = START_NEED[pos] || 0;
  const flexEligible = FLEX_POOL.includes(pos);
  // K + D/ST: carrying 1 is normal → short only at 0, surplus at 3+ (hoarding).
  if(!flexEligible && (pos==="K" || pos==="DEF")){
    if(count === 0) return { count, need, status:"short" };
    if(count >= 3)  return { count, need, status:"surplus" };
    return { count, need, status:"ok" };
  }
  // "startable" = dedicated starting slots + (a share of the 1 FLEX for flex-eligible positions).
  const startable = need + (flexEligible ? 1 : 0);
  // SURPLUS = clearly more than you can start (one past startable). TE: need1+flex1=2 → 3+ = surplus. RB/WR: 4+.
  if(count >= startable + 1) return { count, need, status:"surplus" };
  // SHORTAGE = at/below what you must start (no depth). QB1 → 1 flagged thin; TE1 → 1 thin; RB2 → ≤2 thin.
  if(count <= need) return { count, need, status:"short" };
  return { count, need, status:"ok" };
}

function paintTradeBlock(){
  const D = DATA; const el = document.getElementById("pane-block");
  if(!D){ el.innerHTML = `<div class="note">No data.</div>`; return; }

  // count rostered players per position per team (plain counts, no weighting)
  const rows = D.teams.slice().sort((a,b)=> (b.record.w-a.record.w)||(b.pf-a.pf)).map(t=>{
    const cnt = {}; BLOCK_POS.forEach(p=>cnt[p]=0);
    t.players.forEach(p=>{ if(cnt[p.pos]!=null) cnt[p.pos]++; });
    const cells = BLOCK_POS.map(p=>({ pos:p, ...blockStatus(p, cnt[p]) }));
    return { id:t.id, disp:t.disp, short:t.short, cells,
             shortages: cells.filter(c=>c.status==="short").map(c=>BLOCK_LABEL[c.pos]),
             surpluses: cells.filter(c=>c.status==="surplus").map(c=>BLOCK_LABEL[c.pos]) };
  });

  const s = [];
  const CNT_CLS = { surplus:"bs-up", short:"bs-down", ok:"" };
  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">Trade Block: who's deep, who's thin</h2></div><div class="bs-panel-body">
    <p class="cap">Roster counts vs starting slots (QB, RB×2, WR×2, TE, FLEX, D/ST, K). Surplus: more than you can start. Shortage: at or below what you must start. Counts only, from live rosters.</p>
    <p class="cap"><span class="bs-up">Surplus</span> · <span class="bs-down">Shortage</span> · OK</p>`);

  // grid: team rows, position columns
  s.push(`<div class="bs-table-wrap"><table class="bs-table bs-table--stick1"><thead><tr><th scope="col">Team</th>`
    + BLOCK_POS.map(p=>`<th class="num" scope="col">${BLOCK_LABEL[p]}</th>`).join("") + `</tr></thead><tbody>`);
  rows.forEach(r=>{
    s.push(`<tr><td><span class="tm-cell">${avatarHtml(r.id, r.short, 22)}<span>${esc(r.short)}</span></span></td>`
      + r.cells.map(c=>`<td class="num"><span class="${CNT_CLS[c.status]}">${c.count}</span></td>`).join("")
      + `</tr>`);
  });
  s.push(`</tbody></table></div></div></section>`);

  // per-team plain-English summary (needs/available at a glance) — still just counts, no analysis
  s.push(`<section class="bs-panel"><div class="bs-panel-head"><h2 class="bs-h2">At a glance</h2></div>`
    + `<div class="bs-table-wrap"><table class="bs-table"><thead><tr><th scope="col">Team</th><th scope="col">Note</th></tr></thead><tbody>`
    + rows.map(r=>{
        const need = r.shortages.length ? `thin at <b>${r.shortages.join(", ")}</b>` : "";
        const deep = r.surpluses.length ? `deep at <b>${r.surpluses.join(", ")}</b>` : "";
        const both = [deep, need].filter(Boolean).join(" · ") || "balanced roster counts";
        return `<tr><td><span class="tm-cell">${avatarHtml(r.id, r.short, 22)}<span>${esc(r.short)}</span></span></td><td class="wrap-ok">${both}</td></tr>`;
      }).join("")
    + `</tbody></table></div></section>`);

  el.innerHTML = s.join("");
}

/* ============================ LOAD / SHELL ============================ */
async function load(){
  const status=document.getElementById("status"), errbox=document.getElementById("errbox");
  errbox.innerHTML=""; status.textContent="ESPN · loading…";
  // banner title = league name (uppercased, styled gold-on-purple); subtitle "League Hub" is static markup.
  document.getElementById("lgTitle").textContent = LEAGUE.name.toUpperCase();
  document.title = `${LEAGUE.name} League Hub`;
  try{
    const res = await providers[LEAGUE.provider].load();
    if(res.authExpired){
      errbox.innerHTML = `<div class="err"><b>ESPN session expired.</b> The saved cookie no longer works, so live data can't load right now. The league admin needs to refresh <code>ESPN_S2</code> + <code>ESPN_SWID</code> in the Vercel project settings. Everything else here will work again once that's done.</div>`;
      status.textContent="ESPN · couldn't update"; return;
    }
    if(res.notConfigured){
      errbox.innerHTML = `<div class="err">The ESPN connection isn't configured on the server yet (missing env vars). No data to show until that's set up.</div>`;
      status.textContent="ESPN · couldn't update"; return;
    }
    DATA = res;
    // first successful load: apply the week/mode parts of a shared link (needs D.regWeeks). Auto-refresh keeps in-memory state.
    if(!HASH_APPLIED){ applyHashWeeks(readHash()); HASH_APPLIED = true; }
    document.getElementById("sub").textContent = `${DATA.size} teams · ${DATA.season||LEAGUE.season} · Week ${DATA.week}`;
    paintInsights(); paintStakes(); paintPlayoffs(); paintTradeBlock();
    writeHash();
    const hhmm = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    status.textContent = `ESPN · updated ${hhmm}`;
    document.getElementById("foot").textContent = "Not affiliated with ESPN.";
  }catch(e){
    errbox.innerHTML = `<div class="err">Couldn't load the league right now: ${esc(e.message)}. Try Refresh in a moment.</div>`;
    status.textContent="ESPN · couldn't update";
  }
}

/* ---- theme toggle: System -> Light -> Dark (shared snippet, identical across the three apps) ---- */
// theme-color metas follow the OS via media=; a manual choice overrides both so the browser chrome matches (review N7).
const TC_META=[...document.querySelectorAll('meta[name="theme-color"]')], TC_ORIG=TC_META.map(x=>x.content), TC_BG={light:"#F5F6F8",dark:"#0E1116"};
function applyTheme(m){ const r=document.documentElement; if(m==="light"||m==="dark") r.setAttribute("data-theme",m); else r.removeAttribute("data-theme");
  TC_META.forEach((x,i)=>{ x.content = TC_BG[m] || TC_ORIG[i]; });
  try{ m==="system"?localStorage.removeItem("bs-theme"):localStorage.setItem("bs-theme",m); }catch(e){}
  const b=document.getElementById("themeBtn"); if(b){ b.textContent="Theme: "+m[0].toUpperCase()+m.slice(1); b.setAttribute("aria-label","Color theme: "+m+". Activate to change."); } }
function currentTheme(){ return document.documentElement.getAttribute("data-theme")||"system"; }
document.getElementById("themeBtn").addEventListener("click",()=>{ const o=["system","light","dark"]; applyTheme(o[(o.indexOf(currentTheme())+1)%3]); });
applyTheme(currentTheme());

/* ---- tabs (WAI-ARIA tabs pattern, roving tabindex; shared snippet, identical across the three apps) ---- */
// tablist: element with role="tablist"; onSelect(key) paints + writes the hash. Buttons carry data-key.
function wireTabs(tablist, onSelect){
  const tabs=[...tablist.querySelectorAll('[role="tab"]')];
  tabs.forEach((t,i)=>{
    t.addEventListener("click",()=>onSelect(t.dataset.key));
    t.addEventListener("keydown",e=>{ let j=null;
      if(e.key==="ArrowRight") j=(i+1)%tabs.length; else if(e.key==="ArrowLeft") j=(i-1+tabs.length)%tabs.length;
      else if(e.key==="Home") j=0; else if(e.key==="End") j=tabs.length-1;
      if(j!==null){ e.preventDefault(); tabs[j].focus(); onSelect(tabs[j].dataset.key); } });
  });
}
function setSelectedTab(tablist, key){ tablist.querySelectorAll('[role="tab"]').forEach(t=>{ const on=t.dataset.key===key;
  t.setAttribute("aria-selected", on?"true":"false"); t.tabIndex = on?0:-1; }); }

/* ---- URL-hash state: #insights[/wkN] · #stakes[/wkN][/seeding|odds|both] · #playoffs · #block ---- */
const TAB_KEYS = ["insights","stakes","playoffs","block"];
const STAKES_MODES = ["seeding","odds","both"];
let HASH_APPLIED = false;   // week/mode segments are applied once, after the first successful load()
function readHash(){
  const segs = String(location.hash||"").replace(/^#/,"").toLowerCase().split("/").filter(Boolean);
  const tab = TAB_KEYS.includes(segs[0]) ? segs[0] : "insights";
  let wk = null, mode = null;
  segs.slice(1).forEach(x=>{
    const m = /^wk(\d{1,2})$/.exec(x);
    if(m) wk = Number(m[1]); else if(STAKES_MODES.includes(x)) mode = x;
  });
  return { tab, wk, mode };
}
// week must be 1..D.regWeeks, else ignored (the paint functions then default to the current week)
function applyHashWeeks(h){
  if(!DATA) return;
  const okWk = h.wk!=null && h.wk>=1 && h.wk<=DATA.regWeeks ? h.wk : null;
  // only touch a week when the hash carries a valid wkN (an in-page "#insights" link must not reset a picked week)
  if(h.tab==="insights" && okWk!=null) VIEW_WEEK = okWk;
  if(h.tab==="stakes"){ if(okWk!=null) STAKES_WEEK = okWk; if(h.mode) STAKES_MODE = h.mode; }
}
function writeHash(){
  if(!DATA && !HASH_APPLIED) return;           // never wipe a pending link's week before the first load
  const parts = [ACTIVE];
  if(DATA && ACTIVE==="insights" && VIEW_WEEK!=null && VIEW_WEEK!==DATA.week) parts.push("wk"+VIEW_WEEK);
  if(DATA && ACTIVE==="stakes"){
    const wk = STAKES_WEEK==null ? DATA.week : STAKES_WEEK;
    if(wk!==DATA.week || STAKES_MODE!=="both") parts.push("wk"+wk);
    if(STAKES_MODE!=="both") parts.push(STAKES_MODE);
  }
  const h = "#"+parts.join("/");
  try{ if(location.hash!==h) history.replaceState(null, "", h); }catch(e){}
}
function selectTab(key, opts){
  if(!TAB_KEYS.includes(key)) key = "insights";
  ACTIVE = key;
  const tl = document.getElementById("mainTabs");
  setSelectedTab(tl, key);
  TAB_KEYS.forEach(k=> document.getElementById("pane-"+k).classList.toggle("hide", k!==key));
  // scroll to the tab bar only when it has scrolled above the viewport
  if(!(opts&&opts.noScroll) && tl.getBoundingClientRect().top < 0) tl.scrollIntoView({block:"start"});
  writeHash();
}
wireTabs(document.getElementById("mainTabs"), k=>selectTab(k));
selectTab(readHash().tab, {noScroll:true});
addEventListener("hashchange", ()=>{
  const h = readHash();
  if(DATA){ applyHashWeeks(h); paintInsights(); paintStakes(); }
  selectTab(h.tab, {noScroll:true});
});
document.getElementById("refreshBtn").addEventListener("click", load);

// optional light auto-refresh so an open tab stays current on game days (re-pulls; does not push)
let AUTO_TIMER = setInterval(()=>{ if(document.getElementById("autoRefresh").checked && !document.hidden) load(); }, AUTO_REFRESH_MS);
document.getElementById("autoRefresh").addEventListener("change", e=>{
  if(!e.target.checked && AUTO_TIMER){ clearInterval(AUTO_TIMER); AUTO_TIMER=null; }
  else if(e.target.checked && !AUTO_TIMER){ AUTO_TIMER=setInterval(()=>{ if(document.getElementById("autoRefresh").checked && !document.hidden) load(); }, AUTO_REFRESH_MS); }
});

load();
</script>
